<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="45 38 288 288" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">拉壳仔弦的小琴师</title>
  <desc id="desc">黑白手绘风格的小琴师坐在矮凳上，一手按弦，一手拉弓；壳仔弦有长琴杆、两个弦轴和小巧的椰壳琴筒。</desc>
  <g stroke="#FFFFFF" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
