    <path d="M125 151Q126 162 121 176M96 218Q100 226 112 229" stroke="#141510" stroke-width="2.6"/>
    <!-- Neck, ear and a gently tilted profile. -->
    <path d="M115 115 114 134Q121 145 133 140L140 120Z" fill="#141510"/>
    <path d="M102 79Q116 63 139 73Q156 77 159 93L164 105 172 110Q175 115 164 118L164 128Q155 143 136 137Q118 134 108 117L102 103Z" fill="#141510"/>
    <!-- Hair: an asymmetric, slightly unruly shape rather than a detailed headdress. -->
    <path d="M104 109Q94 101 97 87Q93 79 99 70Q105 64 113 63L108 56Q122 53 129 64Q142 59 154 69Q162 76 161 87Q145 88 139 77Q136 91 113 96L112 108Z" fill="#FFFFFF"/>
