    <path d="M208 64Q210 58 214 61L216 224 208 231Z" fill="#141510"/>
    <path d="M206 80 226 77 227 84 207 87Z" fill="#FFFFFF"/>
    <path d="M197 96 217 93 218 100 198 103Z" fill="#FFFFFF"/>
    <path d="M221 75Q230 72 231 79Q232 86 224 87ZM197 93Q190 91 190 98Q190 105 198 104Z" fill="#141510"/>
    <!-- The fretting hand wraps around the neck, rather than floating near it. -->
    <path d="M197 132Q200 126 207 124L214 125Q222 122 223 127Q222 131 215 132L219 136Q222 139 218 142L213 142Q216 147 212 150L204 149 201 143Z" fill="#141510"/>
    <path d="M207 134 215 135M207 141 213 142" stroke-width="2"/>
    <!-- Small coconut-shell resonator on the thigh, with a pale front soundboard. -->
    <path d="M196 225Q208 217 222 224Q231 230 229 244Q224 257 210 256Q197 254 193 243Q190 232 196 225Z" fill="#FFFFFF"/>
    <path d="M217 223Q231 224 232 237Q231 250 220 253Q211 249 212 238Q211 229 217 223Z" fill="#141510"/>
