 项如下。演唱信息按页面署名记录，含角色标签；不会把角色名误当作演员名。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e候选\u003c/th\u003e\n\u003cth\u003e曲调及来源页\u003c/th\u003e\n\u003cth\u003e演唱署名\u003c/th\u003e\n\u003cth\u003e文件头时长\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eC004\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/20\"\u003e古早七字仔\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e鄭力榮\u003c/td\u003e\n\u003ctd\u003e1:06.90\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC005\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/22\"\u003e都馬調\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e生（薛丁山）/林祉淩、旦（樊梨花）/陳韡慈\u003c/td\u003e\n\u003ctd\u003e2:44.99\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC006\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/23\"\u003e西樂都馬\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e龔俊杰\u003c/td\u003e\n\u003ctd\u003e1:14.44\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC007\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/26\"\u003e崁仔腳調\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e林俊辰\u003c/td\u003e\n\u003ctd\u003e0:51.39\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC008\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/27\"\u003e臺東調（平埔調）\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e張閔鈞\u003c/td\u003e\n\u003ctd\u003e1:14.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC009\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/28\"\u003e思想起（恆春調)\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e林祉淩\u003c/td\u003e\n\u003ctd\u003e1:09.30\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e新增候选合计 501.062 秒，约 8 分 21 秒，原始文件预计总计 145,080,840 字节（138.36 MiB）。加上现有三份，全部九项总长约 13 分 03 秒。这是录音时长上限线索，不是已通过审核的配对时长，不能把不同轨或复制片段重复计时。\u003c/p\u003e\n\u003cp\u003e六项页面均提供 WAV 直链；只用 HTTP Range 读取每份前 65,536 字节，均返回 206。RIFF 文件头声明 48 kHz、双声道、24-bit PCM，与既有输入格式一致。本轮未保存任何完整音频，未做这些新文件的完整哈希、解码或听验。元数据不完整时应留待核验，不用网页访问量推断时长。\u003c/p\u003e\n\u003ch2 id=\"_2\"\u003e建议首批执行顺序\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e确认本表六个候选为首批范围后，完整下载到独立录音目录，核对格式、大小、SHA-256 与全文件解码，检查与现有录音是否重复，再登记正式编号。保留原始录音。\u003c/li\u003e\n\u003cli\u003e先对最长的 C005 都馬調（约 2 分 45 秒，含生/旦角色署名）执行同参数 Demucs 完整分离。它比当前测试录音更长、角色信息也不同，作为这批的代表录音。技术核查并由用户听验双轨，通过后处理其余五份。\u003c/li\u003e\n\u003cli\u003e按既有门槛逐份审核双轨，记录通过、局部可用或剔除；按完整结构选择共同分段边界，保留过门和尾奏，不按固定 30 秒切断。\u003c/li\u003e\n\u003cli\u003e保存可追溯配对与质量记录，按已接受的旋律/目标特征、真实长度及 FM 主损失输入规则核验。使用新运行目录，不改旧产物。若复用现有脚本需修改逻辑，先展示核心 diff、解释后确认；本提案不预先批准代码变更。\u003c/li\u003e\n\u003cli\u003e汇总这一批的新增合格数量/时长、失败原因、资源实测及后续来源需求。最终数据划分按原录音/演出分组，避免同源片段跨集合；分组数量与长度确定后再选比例，不把 13 对同源片段当作 13 个独立来源。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"_3\"\u003e资源预算与人工工作\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e存储：新增原音约 138 MiB，44.1 kHz 双声道 FLOAT 完整双轨约 337 MiB，保留全长的配对片段双轨约再占 337 MiB；新特征、试听副本、日志及临时文件另计，建议本批预留 2 GiB。片段是否全部可用未知，因此这是处理预算，不是最终数据大小。\u003c/li\u003e\n\u003cli\u003e分离：沿用独立环境与 Demucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e，逐份单卡执行。先前显存预算为 4–10 GiB，未实测 Demucs 峰值；本批开始前检查空闲 GPU 与磁盘并记录实际资源。由既有录音耗时粗估，六份任务合计数分钟，网络、模型加载和硬件占用会影响实际时间。\u003c/li\u003e\n\u003cli\u003e特征/FM 核验：既有 FM 主损失检查峰值约 7.83 GiB，仅支持相近长度与批次设置。新分段长度未确定，不能把它当作任意长段的资源保证。长段出现内存问题时记录并提出明确处理，不静默截断。\u003c/li\u003e\n\u003cli\u003e人工工作：六份录音的分离双轨试听和结构边界审核是必需工作；本表尚不能给出最终片段数量或确定审核耗时。不会以自动听音模型代替用户接受结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"929_1\"\u003e首批与整个 929 的区别\u003c/h2\u003e\n\u003cp\u003e这六份是有明确来源的第一批扩建候选，不等于整个规模化建集的最终规模。现有目录全部录音合计也只有约 13 分钟；如目标为 1 小时或 5 小时合格配对数据，还需要补充来源，不能先承诺该目录足够，也不能随意设定最低时长保证微调效果。\u003c/p\u003e\n\u003cp\u003e最终应由用户明确数量或合格配对时长。目标确定后列出来源计划、预算与停止条件；若来源不足或可用率低，报告缺口并有限调整，不无限追加搜索、处理或研究。达到目标并完成核验、分组划分和交付后结束 929，正式微调另开实验。\u003c/p\u003e\n\u003cp\u003e来源与权利状态继续记录为待核实，沿用本次内部技术试验约定，不标记为已授权发表/共享 限验收，准备本地记录同步\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#2026-10-01_8\"\u003e2026-10-01 规模化首批来源只读核查与具体提案（待确认）\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/nav\u003e\u003cdiv class=\"reader-meta\"\u003e\u003cdetails\u003e\u003csummary\u003e查看来源与版本\u003c/summary\u003e\u003cp\u003e来源：$PROJECT_ROOT\\anyaccomp_gezi_finetune\\docs\\archive\\929训练数据采集_历史记录_20261001T093748Z.md\u003c/p\u003e\u003cp\u003eSHA-256：bbe987bd8a1289d3a16b4587460588edb73ff63249f957dd7d1f9f60faa58e98\u003c/p\u003e\u003cp\u003e文件更新后，双击“更新看板”刷新此页。\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\n\u003carticle id=\"file-content\" class=\"reader-content file-content\" data-file-type=\"md\"\u003e\u003ch1 id=\"929\"\u003e929训练数据采集：歌仔戏配对数据与训练输入核验\u003c/h1\u003e\n\u003cp\u003e更新日期：2026-10-01。本文是\u003cstrong\u003e本次数据实验的进度文档与最终数据交付记录\u003c/strong\u003e；每结束一个有独立产物的阶段，就更新实际结果、证据、用户判断、遗留问题和下一步，并同步本地与云端副本。状态以实际证据为准，不把已下载录音或计划写成可训练样本。\u003c/p\u003e\n\u003cp\u003e模型、工具与技术在本项目中的职责、输入输出、当前使用状态及验证范围，单独整理于\u003ca href=\"929%E9%A1%B9%E7%9B%AE%E6%A8%A1%E5%9E%8B%E4%B8%8E%E6%8A%80%E6%9C%AF%E8%AF%B4%E6%98%8E-528d3187045a.html\"\u003e929 项目模型与技术说明\u003c/a\u003e，方便回看；本进度文档继续保存实际执行证据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2026-10-01 用户重申的推进边界\u003c/strong\u003e：规模化建集原已列入 929 的目标与阶段表；用户本次明确“包含规模化建集”，是重申原范围，不是新增任务。929 的范围固定为“小规模流程验证 → 按明确规模建集 → 质量与训练输入核验 → 数据划分和交付”，完成后报告结论并停止。正式微调、长期训练、生成效果研究和其他实验不自动纳入。扩大建集前仍需完成小规模验收并确定来源清单、目标数量或合格配对时长；此次确认范围不等于已有明确批量任务清单。下文既有“下一步”描述是候选待办，不表示用户已批准立即执行新增实验代码。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有限验收与停止规则\u003c/strong\u003e：先汇总已有分离听验、结构边界、配对可追溯性、特征/时间网格、FM 主损失及提示/补齐检查、声码器听验的证据；对剩余项明确标为“通过 / 未验证 / 本轮不做”，不为消除所有不确定性不断追加研究。形成剩余必需检查的固定清单、明确本轮采用的输入规则及未实现的论文配方；完成已确认的验收项和文档交付后，报告 929 结论并停止。不能把遗留限制写成通过，也不能把保留限制当作无限扩展任务的理由。完整作者配方复现不是默认验收要求。若确需新增实验代码，仍先展示核心 diff、解释并等待确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e明确的终点\u003c/strong\u003e：交付达到约定规模、来源可追溯、经质量与配对审核及约定训练输入核验的歌仔戏人声—伴奏数据集，同时交付训练/验证/测试清单、输入规格、处理与审核记录、统计及遗留限制说明，并由用户验收。当前三份录音和 13 对片段是流程验证材料，不能作为整个 929 已完成的依据。具体建集数量或合格时长尚未确定；确定后写入记录，达到目标后不自动提高规模或增加新研究。\u003c/p\u003e\n\u003ch2 id=\"1\"\u003e1. 目标、路线与边界\u003c/h2\u003e\n\u003cp\u003e目标是先用少量录音验证数据构建全流程，再扩大音频收集与处理，最终获得\u003cstrong\u003e足量、来源可追溯、质量合格、时间对齐，并经 AnyAccomp 实际训练输入流程核验可用\u003c/strong\u003e的歌仔戏人声—伴奏配对训练数据。只有孤立人声不能直接提供对应的戏曲配器、节奏和过门监督信号。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e小规模流程验证\u003c/strong\u003e：少量音频收集与下载 → 保存完整录音 → 分离 → 质量与对齐核验 → 按戏曲结构同步分段 → 保存配对唱段 → 训练输入兼容性核验。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e通过后规模化建集\u003c/strong\u003e：扩大音频收集与下载 → 对每份完整录音执行已验证的分离、核验、同步分段和配对流程 → 按训练输入规则组织并复核全部样本 → 数据划分与交付。小规模录音只是试流程的材料，不是本实验预定的最终数据规模。\u003c/p\u003e\n\u003cp\u003e只有小规模链路的分离质量、时间对齐、结构分段、配对关系与训练输入兼容性均通过，并由用户确认后，才按确定的来源清单和处理规模开展批量数据构建。听音大模型不是必需前置。完整录音和戏曲结构性长唱段始终保留；论文报告的训练片段范围不作为本实验的硬性分段上限。能否直接训练长片段，要由实际训练实现验证。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e实验边界\u003c/strong\u003e：本实验包括伴奏目标能否被训练流程读取、对齐并用于计算损失的兼容性验证，必要时进行一个批次/一步的临时冒烟测试；这只是数据可用性的证据，不作为模型训练成果。正式微调策略、长时间训练、生成效果评价和训练报告另开实验，不在本文中宣称完成。\u003c/p\u003e\n\u003ch3 id=\"11\"\u003e1.1 固定交付项与完成条件（包含规模化建集）\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e交付项\u003c/th\u003e\n\u003cth\u003e929 的完成条件\u003c/th\u003e\n\u003cth\u003e当前状态\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e小规模流程验收\u003c/td\u003e\n\u003ctd\u003e汇总同一批录音的分离听验、结构分段、完整覆盖、配对与约定训练输入证据；明确限制并经用户确认可复用\u003c/td\u003e\n\u003ctd\u003e用户已确认有限验收通过；范围为实验 FM 主损失接口及已测解码，不是完整作者训练配方\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e建集范围\u003c/td\u003e\n\u003ctd\u003e明确来源清单、目标录音数量或合格配对总时长、质量门槛与必要资源；数量/时长以最终合格数据统计为准\u003c/td\u003e\n\u003ctd\u003e尚待确定；不把“越多越好”作为终点\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e规模化配对音频\u003c/td\u003e\n\u003ctd\u003e按确定范围收集、完整保存、分离、审核和同步分段；合格数据达到约定规模，异常样本剔除或标记可用范围\u003c/td\u003e\n\u003ctd\u003e尚未开始\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可追溯清单与审核\u003c/td\u003e\n\u003ctd\u003e每对能回溯原录音、来源、分离版本、共同边界、文件哈希和审核状态；保留不通过样本的原因\u003c/td\u003e\n\u003ctd\u003e三份录音已有清单，规模化部分待执行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e训练输入规格与验证\u003c/td\u003e\n\u003ctd\u003e固定采样率/声道、旋律条件、目标尺度与网格、变长补齐/掩码等规则，记录约定兼容性检查；未复现的作者配方明确列为限制\u003c/td\u003e\n\u003ctd\u003e当前主损失等局部核验通过，整体规则与验收待汇总\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数据划分与最终交付\u003c/td\u003e\n\u003ctd\u003e按原始录音/演出等分组划分训练、验证、测试，避免同源片段跨集合泄漏；交付清单、数量/时长统计、处理证据、输入说明及实验结论\u003c/td\u003e\n\u003ctd\u003e尚未执行\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e停止条件\u003c/strong\u003e：以上已确认交付项完成并经用户验收，即结束 929；后续新增来源、扩大数量、改变处理方法、实现完整论文配方或正式训练另立任务。不以模型生成效果好坏作为本次数据实验的完成标准。为完成固定验收所需的补充检查，应先说明具体缺口、输入输出与完成条件，不无限追加试验。\u003c/p\u003e\n\u003cp\u003e本阶段的优先目标是\u003cstrong\u003e内部数据与训练输入技术试验\u003c/strong\u003e。来源与权利状态仍逐件记录为“待核实”，但不作为当前小规模数据准备的阻塞项；不把这些文件标为已授权、可公开发布或可用于论文交付。若进入论文发表或数据共享阶段，使用范围和权利由用户与老师核实，并对正式数据重做来源、质量、划分和实验记录。\u003c/p\u003e\n\u003ch2 id=\"2\"\u003e2. 工作区与责任\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e工作区\u003c/th\u003e\n\u003cth\u003e路径\u003c/th\u003e\n\u003cth\u003e责任\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e本地 Codex\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e$PROJECT_ROOT\\anyaccomp_gezi_finetune\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e来源筛选、授权状态记录、听音/边界清单、配置与报告整理；只保留必要试听样本，不重复存放大型权重。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e云服务器上的 Codex\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT\u003c/code\u003e（\u003ccode\u003elab-4090\u003c/code\u003e）\u003c/td\u003e\n\u003ctd\u003e经确认的完整录音、分离轨、配对片段、训练输入核验及其临时冒烟日志；准备耗时 GPU 分离的启动与监控命令。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e用户\u003c/td\u003e\n\u003ctd\u003e两端结果的判断者\u003c/td\u003e\n\u003ctd\u003e确认收录范围、亲自听验分离结果和分段边界、确认训练输入可用性的验收证据，；本次云端耗时 GPU 任务由 Codex 执行，开始与结束均告知用户。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e两端目录\u003cstrong\u003e不自动同步\u003c/strong\u003e。同步时先检查目标文件是否已存在，明确传输清单与方向，再核对 SHA-256；不覆盖未核对的记录。本文两端使用同名副本，任何实质决策更新均写明日期和来源，避免分叉。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e进度更新规则\u003c/strong\u003e：阶段结束后在第 4 节更新状态与验收证据，在第 7 节记录实际产物、与你的判断及遗留问题，再核对两端文档哈希。未完成的阶段保留“待执行/待核验”；“三份试验录音下载成功”“小规模流程跑通”和“规模化训练数据完成”是三个不同状态。数据实验的最终验收是“经过规模化处理的可追溯配对数据 + 质量/对齐审核 + 训练输入兼容性证据 + 数据交付清单”，不是正式模型效果。\u003c/p\u003e\n\u003ch2 id=\"3\"\u003e3. 数据目录、编号与命名\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e内容\u003c/th\u003e\n\u003cth\u003e路径或命名\u003c/th\u003e\n\u003cth\u003e说明\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e原始录音\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edata/raw/R0001/原始文件名.wav\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e保留下载文件原名及内容；格式可不是 WAV，按真实后缀保存。现有 \u003ccode\u003edata/raw/qizi_demo_21.wav\u003c/code\u003e 是旧路径，不因本文而移动或改名。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完整分离轨\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edata/separated/R0001/SEP01_vocal.wav\u003c/code\u003e、\u003ccode\u003eSEP01_accompaniment.wav\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eSEP01\u003c/code\u003e 对应一次固定模型、权重和配置的分离结果；不同试验用新编号。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e配对唱段\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edata/clips/R0001/SEP01/SEG0001_vocal.wav\u003c/code\u003e、\u003ccode\u003eSEG0001_accompaniment.wav\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e两轨来自同一次分离、相同的原录音起止位置；时间以清单为准，不靠文件名猜测。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数据清单\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edata/manifests/recordings.csv\u003c/code\u003e、\u003ccode\u003eseparations.csv\u003c/code\u003e、\u003ccode\u003esegments.csv\u003c/code\u003e、\u003ccode\u003epairs.csv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003erecordings.csv\u003c/code\u003e 已记录本轮三份原音；其余清单分别用于后续分离版本、边界/歌词/审核状态和最终配对关系。未产生实际数据时不填造记录。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e其他产物\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emodels/\u003c/code\u003e、\u003ccode\u003eenvironments/\u003c/code\u003e、\u003ccode\u003econfigs/\u003c/code\u003e、\u003ccode\u003escripts/\u003c/code\u003e、\u003ccode\u003eruns/\u003c/code\u003e、\u003ccode\u003ereports/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e模型、环境信息、配置、脚本、运行记录和阶段报告分别归档，不混入原项目。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003ccode\u003eR0001\u003c/code\u003e 是正式收录录音编号，\u003ccode\u003eSEP01\u003c/code\u003e 是该录音的一次分离编号，\u003ccode\u003eSEG0001\u003c/code\u003e 是确认边界后的唱段编号。编号一经分配不复用；来源、分离版本或边界变更时建立新记录，不静默覆盖旧产物。候选来源另用 \u003ccode\u003eC001\u003c/code\u003e 等编号，\u003cstrong\u003e候选编号不代表已收录、已授权或已分段\u003c/strong\u003e。歌词只记录有依据且经过核对的内容；无法辨识处标记“听不清/待核”，不猜填。\u003c/p\u003e\n\u003ch2 id=\"4\"\u003e4. 当前状态与阶段门槛\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e阶段\u003c/th\u003e\n\u003cth\u003e当前状态（2026-10-01）\u003c/th\u003e\n\u003cth\u003e进入下一阶段的证据与用户关口\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e小规模音频来源与下载\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e仅下载检查通过\u003c/strong\u003e：\u003ccode\u003eR0001–R0003\u003c/code\u003e 已下载，详情见第 5 节及 \u003ccode\u003erecordings.csv\u003c/code\u003e；\u003cstrong\u003e全流程尚未跑通\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e三条官方直链、文件格式、大小、时长、完整解码与 SHA-256 已记录；权利状态保持“待核实”，不阻塞本次内部技术试验，也不视为论文/共享授权。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e小规模完整录音保存\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e仅保存检查通过\u003c/strong\u003e：三份完整录音保存在云端 \u003ccode\u003edata/raw/R0001–R0003/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e原有旧文件未移动或覆盖；\u003ccode\u003eR0001\u003c/code\u003e 与旧示范录音哈希一致；三份录音互不重复。长录音不为分离而预先按固定秒数切段。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分离模型小规模比较\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eR0001 两方案比较已完成；R0002/R0003 的 \u003ccode\u003ehtdemucs_ft\u003c/code\u003e 完整分离已完成\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eR0001 用户认为 Demucs 更好；R0002/R0003 沿用相同模型与参数，保存版本、权重来源、日志和完整双轨；三份 Demucs 双轨均经用户听验通过，作为后续小规模流程验证输入。GPU 任务按本次授权由云端 Codex 执行并通知用户。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分离质量与时间对齐\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e三份 Demucs 双轨均经用户听验通过；基础技术检查通过，细部对齐仍待核验\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eR0001 已明确报告伪影但唱腔主体完整；R0002/R0003 用户按要求的质量标准答复“都通过”，没有单独的伪影时间点记录。检查起点、采样率、帧数、整体延迟和局部漂移；已有近似检查不等于细部对齐证明。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e按戏曲结构同步分段\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e三份录音共 13 个片段边界均经用户确认\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eR0001 四段、R0002 五段、R0003 四段；片头伴奏、内部过门与尾奏保留。片段未按固定 30 秒上限截断。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e保存配对唱段\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e三份录音的 13 对 WAV 已保存并登记；实验 FM 主损失输入接口有限验收通过\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e每对同源同样本边界，回溯至原音及分离版本；每份录音的分段连续覆盖完整双轨，重新拼接后逐样本一致。原音和完整分离轨保留。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e训练样本兼容性\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e有限验收通过：实验 z-score FM 主损失、逐条有效长度提示及七种混合补齐检查；三段声码器时间/长度技术核验与听验通过；完整作者配方、优化器及恢复训练未验证\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e核实实际训练入口、采样率/声道、伴奏目标特征、变长批处理/补齐/有效长度掩码；短、中、长样本及混合长度批次须成功加载并与对应人声对齐。使用真实训练接口核验前向损失和反向传播；必要时仅做一个批次/一步的临时参数更新及检查点重载，验证输入确实可用于训练，产物不作为正式训练模型。不得出现未记录的静默截断。若缺少训练入口或需修改实验代码，先单独说明逻辑、展示核心 diff 并按用户确认流程实施。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e小规模全流程验收\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e用户已确认有限验收通过；可进入来源与规模规划\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e汇总同一批试验录音的分离听验、时间对齐、结构分段、配对可追溯性和训练输入兼容性证据；由用户确认流程可复用。若正式来源的录音明显长于试验录音，批量处理前还要补验代表性长录音的分离稳定性。任一关键环节未通过，先修正并重验，不直接批量下载或处理。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e规模化音频收集与处理\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e待执行，属于本数据实验主要工作\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e流程验收后，由用户确认扩大收集的来源清单和规模；批量保存完整录音，并逐批执行已验证的分离、对齐核验、同步分段、配对和训练输入检查。逐件留存来源/哈希/处理版本/时间戳，每批记录通过、局部可用、剔除数量与原因；异常录音不混入训练集。耗时 GPU 批量任务按当次授权由云端 Codex 执行并通知用户。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数据划分与交付\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e待执行，属于本数据实验终点\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e对规模化产出的合格配对样本按原始录音/演出等分组准备训练、验证、测试清单，避免同源泄漏；核对样本数、总时长、人声/伴奏文件、时间戳、审核状态和输入规格，交付可复现的数据清单及本进度文档。不能只交付 \u003ccode\u003eR0001–R0003\u003c/code\u003e 的试验结果。\u003cstrong\u003e正式微调与效果评价由另一实验承担\u003c/strong\u003e。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e没有真实独立人声/伴奏轨作为参照时，不宣称有可靠的参考型分离质量分数。两轨长度相同也不等于已经证明时间对齐。一个批次的兼容性冒烟成功只证明数据与该训练接口可衔接，不证明模型已学到合适的歌仔戏伴奏。\u003c/p\u003e\n\u003ch2 id=\"5\"\u003e5. 首轮流程验证录音（尚非规模化训练数据）\u003c/h2\u003e\n\u003cp\u003e优先少量、官方、直接提供下载的录音。以下页面和直链于 2026-09-30 核查，并已将三份完整 WAV 小规模下载到云端。基金会虽然公开表示曲调音档可免费下载，但其\u003ca href=\"https://twoperapf.org.tw/copyright\"\u003e著作权声明\u003c/a\u003e并未给出本实验所需训练使用范围的明确许可；本轮只把它们作为\u003cstrong\u003e权利状态待核实的内部技术试验材料\u003c/strong\u003e，不将其称为已授权的正式论文数据。没有进行批量抓取，也未绕过访问限制。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e候选\u003c/th\u003e\n\u003cth\u003e内容与来源\u003c/th\u003e\n\u003cth\u003e官方页面 / 直接下载\u003c/th\u003e\n\u003cth\u003e核查结果与下一步\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eC001 → R0001\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e七字調示範音檔；旧文件 \u003ccode\u003edata/raw/qizi_demo_21.wav\u003c/code\u003e 仍保留\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/21\"\u003e资源页\u003c/a\u003e / \u003ca href=\"https://twoperapf.org.tw/resource/download/21\"\u003eWAV 直链\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e新下载的 \u003ccode\u003edata/raw/R0001/2.七字調-示範音檔.wav\u003c/code\u003e 与旧示范录音 SHA-256 相同；92.586667 秒。旧 21 秒裁切不是本路线的正式分段样本。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eC002 → R0002\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e雜唸調示範音檔；官网列作詞/編腔劉秀庭/周以謙、編曲周以謙、演唱龔俊杰，并提供歌词\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/24\"\u003e资源页\u003c/a\u003e / \u003ca href=\"https://twoperapf.org.tw/resource/download/24\"\u003eWAV 直链\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e已下载到 \u003ccode\u003edata/raw/R0002/5.雜唸調-示範音檔.wav\u003c/code\u003e；108.837125 秒，完整解码通过；尚未听验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eC003 → R0003\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e江湖調示範音檔；官网列編曲周以謙、演唱龔俊杰，并提供歌词\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/25\"\u003e资源页\u003c/a\u003e / \u003ca href=\"https://twoperapf.org.tw/resource/download/25\"\u003eWAV 直链\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e已下载到 \u003ccode\u003edata/raw/R0003/6.江湖調-示範音檔.wav\u003c/code\u003e；80.804854 秒，完整解码通过；尚未听验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e三份音频均经 \u003ccode\u003effprobe\u003c/code\u003e 检查为 48 kHz、双声道、24-bit PCM WAV，\u003ccode\u003effmpeg\u003c/code\u003e 全文件解码通过；大小与 SHA-256 详见 \u003ccode\u003edata/manifests/recordings.csv\u003c/code\u003e。\u003ccode\u003eR0002/R0003\u003c/code\u003e 来自同一来源与演唱者，适合验证流程，但不能代表歌仔戏风格、演员与录音条件的充分多样性；也不能因为官网另有同曲名伴奏音档，就假定它与示范唱段已严格对齐。\u003cstrong\u003e下一步必须用这些录音跑完整条数据链路；通过后才扩大下载和处理，形成训练数据\u003c/strong\u003e。\u003c/p\u003e\n\u003ch2 id=\"6\"\u003e6. 分离模型与训练入口：只读核查\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e论文关联事实\u003c/strong\u003e：\u003ca href=\"https://arxiv.org/html/2509.14052v1\"\u003eAnyAccomp 论文\u003c/a\u003e描述从歌曲构建配对训练数据；其所关联的\u003ca href=\"https://arxiv.org/html/2505.09325v1#S3.SS1.SSS1\"\u003eSingNet 论文 §3.1.1\u003c/a\u003e写明使用 Solovyev 等人的开源分离库和引用 Fabbro 等人的 MDX23 预训练模型。\u003ca href=\"https://github.com/ZFTurbo/MVSEP-MDX23-music-separation-model\"\u003eSolovyev 维护的 MVSEP-MDX23 仓库\u003c/a\u003e是可核查的实现候选，但\u003cstrong\u003e尚未证明 SingNet 使用了该仓库的哪个提交、精确权重和配置\u003c/strong\u003e，不能把某个同名检查点冒充作者原版。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e比较候选\u003c/strong\u003e：\u003ca href=\"https://github.com/facebookresearch/demucs\"\u003eDemucs 官方仓库\u003c/a\u003e提供 \u003ccode\u003ehtdemucs_ft\u003c/code\u003e；它可接收整段录音并在内部处理窗口，不要求先按戏曲唱句切段。它只是比较对象，最终选择要看同源试听和对齐核验。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e云端只读环境快照（2026-09-30）\u003c/strong\u003e：服务器有 8 张 RTX 4090（单卡报告 24564 MiB 显存），实验目录位于 \u003ccode\u003e$CLOUD_HOME\u003c/code\u003e，\u003ccode\u003e/data\u003c/code\u003e 当时剩余约 864 GiB、使用率约 97%。当前命令路径未找到 \u003ccode\u003edemucs\u003c/code\u003e，本实验 \u003ccode\u003emodels/\u003c/code\u003e 中未见分离模型权重；现有 \u003ccode\u003eqwen_audio\u003c/code\u003e 环境不作为本次分离环境复用。后续应在本实验目录准备隔离环境并先检查模型来源、版本、空间与输出路径，当时计划交由用户启动 GPU 分离；本轮授权已变更，实际由云端 Codex 执行。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e训练输入核验的现实条件\u003c/strong\u003e：2026-09-30 只读查看 \u003ca href=\"https://github.com/AmphionTeam/AnyAccomp\"\u003eAnyAccomp 官方仓库\u003c/a\u003e当前文件树和 README，可见推理脚本、配置和模型定义，但\u003cstrong\u003e未见完整公开的训练入口与数据加载器\u003c/strong\u003e。推理可运行不等于数据能被训练流程接受。本数据实验必须解决或明确这一接口；若需补建最小训练数据加载/冒烟链路，先解释拟修改的实验逻辑与核心 diff，按用户确认流程实施。正式训练系统和长任务仍属下一实验。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"7\"\u003e7. 本轮完成项、下一步与变更记录\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e本轮已完成\u003c/strong\u003e：三份完整录音的来源和下载核验；R0001 两方案比较后选择 Demucs；三份 Demucs 完整双轨和全部 13 个片段边界均经用户听音通过。配对 WAV、来源/分离/边界/哈希清单已保存；三份录音各自的分段重拼与完整分离轨逐样本一致。\u003cstrong\u003e实验 FM 主损失输入接口及小规模流程有限验收已由用户确认；未启动正式训练，未扩大下载；这 13 对仍是小规模流程验证材料\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e下一步关口\u003c/strong\u003e：用户已确认本文末尾的小规模流程有限验收范围。采用已核验的实验输入规则，CFG 条件丢弃概率保留 0.2；REPA/MERT 辅助损失不纳入本轮，完整作者训练配方、优化器及恢复训练保持未验证。13 对配对清单已登记为 \u003ccode\u003epassed_experimental_fm_main_loss_interface\u003c/code\u003e，不能解释为完整训练器或微调效果通过。下一步提出明确的规模化来源清单、数量或合格配对时长、质量门槛及资源预算；目标明确后开展批量处理。本轮先交付本地记录同步材料，没有扩大下载或启动 GPU。正式微调与生成效果评价另开实验，规模化数据核验、划分和交付完成并验收后结束 929。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e决策/变更\u003c/th\u003e\n\u003cth\u003e证据与状态\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e2026-09-30\u003c/td\u003e\n\u003ctd\u003e确认从收集与下载开始、完整录音先分离、用户核验通过后再同步分段；两端同名实验文档；长唱段不预设固定 30 秒上限\u003c/td\u003e\n\u003ctd\u003e已确认的路线；后续分离、核验、分段和训练输入兼容性核验仍待执行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2026-09-30\u003c/td\u003e\n\u003ctd\u003e用户确认授权问题暂不阻塞当前微调技术试验；论文阶段另行寻求可授权数据源\u003c/td\u003e\n\u003ctd\u003e三份录音已小规模下载并登记，权利状态仍为 \u003ccode\u003eunverified\u003c/code\u003e；不据此认定公开使用许可。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2026-09-30\u003c/td\u003e\n\u003ctd\u003e用户明确本文是数据实验的阶段进度文档；“伴奏能否进入训练流程”仍在本实验，正式模型训练另开实验\u003c/td\u003e\n\u003ctd\u003e训练输入兼容性属于本实验的前置验收，不把最小冒烟测试误写为正式训练。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2026-09-30\u003c/td\u003e\n\u003ctd\u003e用户明确 \u003ccode\u003eR0001–R0003\u003c/code\u003e 仅用于验证完整数据流程；通过后还需扩大下载与处理规模，产出训练数据\u003c/td\u003e\n\u003ctd\u003e增加“小规模全流程验收 → 规模化收集与处理 → 数据划分交付”的阶段门槛；当前仅完成三份录音的下载与保存，不能宣称数据实验结束。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2026-10-01\u003c/td\u003e\n\u003ctd\u003e用户要求限定 929 边界，并重申原计划已包含规模化建集\u003c/td\u003e\n\u003ctd\u003e固定终点为达到约定规模的合格配对数据、输入核验、划分和交付；完成并验收后停止。具体规模与来源待确定，正式微调和生成效果评价另开实验。本轮只更新文档，没有启动新任务。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3 id=\"2026-09-30\"\u003e2026-09-30 云端分离候选准备（尚未执行分离）\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e已在本实验目录建立独立 \u003ccode\u003eenvironments/separation_929\u003c/code\u003e，未复用 Qwen 环境；Python 3.10、PyTorch/torchaudio \u003ccode\u003e2.3.1+cu121\u003c/code\u003e、Demucs \u003ccode\u003e4.0.1\u003c/code\u003e、ONNX Runtime GPU \u003ccode\u003e1.18.0\u003c/code\u003e CUDA12/cuDNN8 构建。包版本、安装日志、CPU 检查和系统快照在 \u003ccode\u003eruns/separation_prepare/\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003eMDX23 公开候选固定为 \u003ccode\u003eZFTurbo/MVSEP-MDX23-music-separation-model@765bd312ff0b4213d4ad48ab554a0fc11389633d\u003c/code\u003e；Demucs 固定为 \u003ccode\u003efacebookresearch/demucs@ef66d254cd6d558e207eeff2c4b8d053db2e77dd\u003c/code\u003e（\u003ccode\u003ev4.0.1\u003c/code\u003e）。\u003cstrong\u003e未确定 SingNet 的精确仓库提交、权重或配置，不把本候选称为作者精确版本。\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e9 个权重文件已下载并逐个记录来源 URL、大小、完整 SHA-256，Demucs 文件还核对了上游文件名中的哈希前缀；记录见 \u003ccode\u003econfigs/separation/weights_verified.csv\u003c/code\u003e。MDX 人声候选采用 \u003ccode\u003eKim_Vocal_2.onnx\u003c/code\u003e、\u003ccode\u003eKim_Inst.onnx\u003c/code\u003e 与 Demucs \u003ccode\u003e04573f0d\u003c/code\u003e 融合；初始化还会加载其他 Demucs 模型，均记录在清单。参数见 \u003ccode\u003econfigs/separation/mdx23_R0001.json\u003c/code\u003e 与 \u003ccode\u003eprovenance.json\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epip check\u003c/code\u003e、Demucs CPU 权重加载、两个 ONNX schema/CPU 会话加载及 CUDA 动态库依赖解析通过；\u003cstrong\u003e没有执行 GPU 推理或任何音频分离\u003c/strong\u003e。启动前实际 CUDA provider 加载检查由用户启动块执行。上游源码和已有实验代码未修改；通过 import API 避开 MDX 主入口强制 GPU 0，使用能正确实现 \u003ccode\u003eonly_vocals\u003c/code\u003e 的 \u003ccode\u003elarge_gpu\u003c/code\u003e 分支。\u003c/li\u003e\n\u003cli\u003eR0001–R0003 原音哈希再次与清单一致，R0001 完整解码通过。为同一 R0001 完整录音准备 \u003ccode\u003eSEP01_mdx23\u003c/code\u003e / \u003ccode\u003eSEP02_htdemucs_ft\u003c/code\u003e 两个全新输出目录与防覆盖命令，见 \u003ccode\u003eruns/separation_prepare/launch_commands.txt\u003c/code\u003e；目录中尚无分离结果，不写造 \u003ccode\u003eseparations.csv\u003c/code\u003e 记录。输出预计为 44.1 kHz 双声道 FLOAT，原始 48 kHz 文件保留。Demucs CLI 的伴奏求和及可能的独立防削波缩放与 MDX 残差伴奏有差异，后续核验记录，不假定严格重构或已对齐。\u003c/li\u003e\n\u003cli\u003e资源仅作预算、未实测：MDX 单卡显存预留 12–20 GiB、主存 6–12 GiB、1–10 分钟；Demucs 4–10 GiB、2–6 GiB、1–5 分钟。双方案输出合计约 125 MiB；缓存/环境/权重准备峰值预留 15 GiB。准备后 \u003ccode\u003e/data\u003c/code\u003e 约剩 850 GiB；GPU 0、1、3 有占用，2、4–7 当时近乎空闲，\u003cstrong\u003e启动前重新检查，不视为预留\u003c/strong\u003e。\u003c/li\u003e\n\u003cli\u003e当时下一关口为用户亲自启动分离，再做技术核验与同时间听验；未经用户听验通过不开始分段。本次仅更新云端副本；Windows 本地副本未访问，\u003cstrong\u003e两端同步与哈希核对待进行\u003c/strong\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2026-09-30-r0001\"\u003e2026-09-30 R0001 完整录音双方案试分离（已比较，质量验收待定）\u003c/h3\u003e\n\u003cp\u003e用户本轮明确授权云端 Codex 在 SSH 工作区直接执行，并要求开始、结束时告知；已分别告知启动和阶段结果。此前“用户亲自启动 GPU”的约定由本次授权更新。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSEP01\u003c/code\u003e：公开 MDX23 集成候选；GPU 4，退出码 0，耗时 41.84 秒。完整人声/伴奏在 \u003ccode\u003edata/separated/R0001/SEP01_mdx23/\u003c/code\u003e；日志和资源记录在 \u003ccode\u003eruns/separation_R0001_SEP01/\u003c/code\u003e。这不是已证实的 SingNet 精确版本。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSEP02\u003c/code\u003e：Demucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e；同一 GPU，退出码 0，耗时 12.38 秒。完整双轨在 \u003ccode\u003edata/separated/R0001/SEP02_htdemucs_ft/htdemucs_ft/\u003c/code\u003e；日志在 \u003ccode\u003eruns/separation_R0001_SEP02/\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e四轨均全文件解码通过；44.1 kHz、双声道、FLOAT，各 4,083,072 帧、92.586667 秒。输入原音 SHA-256 未改变。产物路径、SHA-256、模型提交与审核状态见 \u003ccode\u003edata/manifests/separations.csv\u003c/code\u003e。近似窗口相关检查未见整体时间偏移，但不能证明细部严格对齐。\u003c/li\u003e\n\u003cli\u003e与另行重采样原音比较，SEP01 双轨和相对 RMS 误差 -60.86 dB，SEP02 为 -15.35 dB；两方案的伴奏定义及 Demucs CLI 的防削波缩放不同，不能据此直接排序听感质量。统计见 \u003ccode\u003eruns/separation_prepare/R0001_pair_technical_check.json\u003c/code\u003e；GPU 峰值显存未采样。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e下一步由用户听验\u003c/strong\u003e：检查人声残留、拖腔损伤、弦乐/锣鼓丢失与失真，必要时标记局部可用范围；听验前状态为 \u003ccode\u003epending_user_listening\u003c/code\u003e，不分段、不宣称可训练配对样本。R0002/R0003 尚未分离。云端文档已更新；Windows 本地副本同步和两端哈希核对待进行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2026-09-30_1\"\u003e2026-09-30 用户比较意见与下一关口\u003c/h3\u003e\n\u003cp\u003e用户听后反馈“Demucs 给出的结果更好”。据此记录 \u003ccode\u003ehtdemucs_ft\u003c/code\u003e 优先于本轮 MDX23 候选；这是一项相对比较，\u003cstrong\u003e尚未明确判定 Demucs 是否整体通过质量验收、仅局部可用或不通过\u003c/strong\u003e。\u003ccode\u003eseparations.csv\u003c/code\u003e 已将两方案更新为已听比较、质量结论待定，未标记合格配对样本。\u003c/p\u003e\n\u003cp\u003e下一步先由用户给出 Demucs 的质量结论，重点是伴奏残留人声、人声拖腔损伤、弦乐/锣鼓丢失与失真。若 R0001 通过，则云端 Codex 按同一固定模型和配置试分离 R0002/R0003，执行解码与时间初查并供用户逐份听验；这两份通过后才讨论结构分段和配对。若仅局部可用，先记录可用范围并评估是否值得调整分离；不把整个录音标为通过。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30_2\"\u003e2026-09-30 人声伪影反馈与临时质量门槛\u003c/h3\u003e\n\u003cp\u003e用户反馈：Demucs 分离的人声仍有可闻伪影，但比本轮 MDX23 候选好。伪影的位置、持续范围与严重程度尚未记录；\u003ccode\u003eseparations.csv\u003c/code\u003e 保持质量待定，不能仅因“相对更好”标为通过。本轮没有独立干净轨作为真值，不设置凭空推算的 SDR 合格线。Demucs 官方以听众对自然度/伪影和串音的分别评分评价分离质量；AnyAccomp 论文指出分离伪影可造成训练与推理输入不匹配，并用旋律瓶颈缓解输入侧影响，但并未给出本实验的固定合格阈值。\u003c/p\u003e\n\u003cp\u003e本实验试用以下\u003cstrong\u003e人工审核门槛\u003c/strong\u003e，不是论文或模型官方标准：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e将原音、人声和伴奏在相同时间位置、相近播放响度下对照。人声应保住唱词/旋律、起音和拖腔主体；偶发轻微金属声或水声可记录，但持续破音、音高断裂或乐器大面积混入属于明显缺陷。\u003c/li\u003e\n\u003cli\u003e伴奏应保住主要弦乐、锣鼓、节奏和过门，不出现持续清晰可辨的主唱唱词或大段配器被挖空。由于它是训练目标，明显人声泄漏或主要配器缺损不能仅凭人声轨较好而放行。\u003c/li\u003e\n\u003cli\u003e同时查看两轨是否有明显错位、突跳、削波或局部漂移。已有帧数/解码/近似窗口相关通过只是初查，不证明每处听觉对齐。\u003c/li\u003e\n\u003cli\u003e若问题轻微且不妨碍上述核心信息，可暂记“试流程可用”，后续仍须通过结构分段、配对和训练输入兼容性检查；若明显缺陷只在少数位置，记“局部可用”并记录时间范围，整段不标通过；若缺陷跨多数唱句或关键乐器/拖腔，记“不通过”，先比较改进分离方案。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e用户不必凭“有没有任何伪影”二选一；下一步先定位最让人担心的约一两处时间点，并说明是人声唱腔损伤、伴奏残留人声，还是乐器损失。云端 Codex可据此判断当前是否只是轻微伪影，或先试调整同一模型配置。未经用户确认质量门槛，不开始正式结构分段或把它列为合格训练配对数据。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30-anyaccomp\"\u003e2026-09-30 伴奏听验反馈与 AnyAccomp 旋律瓶颈核查\u003c/h3\u003e\n\u003cp\u003e用户听验 \u003ccode\u003eR0001/SEP02\u003c/code\u003e 伴奏后报告“伴奏很好，一点唱词都没有”；\u003ccode\u003eseparations.csv\u003c/code\u003e 已单独记录伴奏侧这一积极判断。人声仍有伪影，整体质量状态继续待定，不把整对直接列为合格训练样本。\u003c/p\u003e\n\u003cp\u003e附图中的概括方向正确，但技术位置需要说清：AnyAccomp 在\u003cstrong\u003e分离得到人声之后、Flow Matching 伴奏生成之前\u003c/strong\u003e，先将输入人声提取为 chromagram，再用预训练 VQ-VAE/量化器映射成离散旋律编码。生成模型以这些编码为条件学习/生成伴奏 mel，随后由 vocoder 合成音频。论文使用 24-bin chromagram、50 Hz 编码序列、512 项码本，音频预处理为 24 kHz。这个瓶颈降低条件表示对音色和部分分离伪影的敏感性；它\u003cstrong\u003e不修复人声 WAV 本身，也不自动清理伴奏目标轨\u003c/strong\u003e，若伪影已破坏旋律或拖腔音高，不能假定编码仍正确。\u003c/p\u003e\n\u003cp\u003e云端只读核查：\u003ccode\u003e$CLOUD_PROJECT_ROOT/source/AnyAccomp/\u003c/code\u003e 的关键推理、配置、Coco 量化器文件与官方 \u003ccode\u003eAmphionTeam/AnyAccomp@82604b5e3107944ad4c49fc64900b86118ae2c62\u003c/code\u003e 内容一致；已有 VQ、Flow Matching、vocoder 权重与独立 \u003ccode\u003eanyaccomp\u003c/code\u003e 环境。VQ 权重 SHA-256 \u003ccode\u003e9d7f48cefea30602b2148c057faf14ecad168184e8063c8377dd57f208dc65fc\u003c/code\u003e。公开仓库可见推理调用 \u003ccode\u003echroma_stft → coco_model.quantize → reverse_diffusion → vocoder\u003c/code\u003e，未见完整公开训练入口/数据加载器。因此本实验\u003cstrong\u003e可以用现有预训练 VQ 做只读条件编码验证\u003c/strong\u003e，但不能据此宣称配对数据已经通过真实训练接口或已可微调；训练输入核验仍需解决入口问题。\u003c/p\u003e\n\u003cp\u003e可行的后续核验路径：保留 R0001 两条完整分离 WAV；在用户确认唱腔主体可用后，用与模型一致的方式将人声重采样为 24 kHz 单声道，得到离散旋律编码，并核对时间长度及明显拖腔处编码是否稳定；伴奏仍作为对应训练目标，不能只交编码。随后核查实际 Flow Matching 训练接口能否读取成对样本并计算损失。若需要新增/修改实验训练代码，按用户约定先解释逻辑、展示核心 diff，等确认后实施；本轮未改代码、未启动训练。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30-r0001-r0002r0003-demucs\"\u003e2026-09-30 R0001 听验结论与 R0002/R0003 Demucs 完整分离\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e用户进一步确认 R0001/SEP02 的人声虽有伪影，但\u003cstrong\u003e没有损坏主要旋律和拖腔，人声部分完整\u003c/strong\u003e；结合先前“伴奏很好，一点唱词都没有”的反馈，标记为\u003cstrong\u003e小规模流程验证可用\u003c/strong\u003e。此结论不等于无伪影、正式训练数据通过或时间对齐全面证明；若后续局部核验发现问题仍需重新记录。\u003ccode\u003edata/manifests/separations.csv\u003c/code\u003e 已更新。\u003c/li\u003e\n\u003cli\u003e2026-09-30 18:38–18:39（Asia/Shanghai）在 GPU 4 依次对 R0002、R0003 完整录音运行 Demucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e。与 R0001/SEP02 相同的仓库提交、权重和参数（\u003ccode\u003e--two-stems vocals --segment 7 --shifts 1 --overlap 0.25 --float32 --clip-mode rescale\u003c/code\u003e）；原音及权重 SHA-256 启动前复核通过，独立输出目录，未覆盖原音。任务开始和结束均已告知用户；两项退出码 0，耗时分别 12.36 秒、12.67 秒。\u003c/li\u003e\n\u003cli\u003eR0002 双轨在 \u003ccode\u003edata/separated/R0002/SEP01_htdemucs_ft/htdemucs_ft/\u003c/code\u003e，各 4,799,718 帧、108.837143 秒；R0003 双轨在 \u003ccode\u003edata/separated/R0003/SEP01_htdemucs_ft/htdemucs_ft/\u003c/code\u003e，各 3,563,495 帧、80.804875 秒。均为 44.1 kHz、双声道、FLOAT，完整解码和有限值检查通过，峰值未超 1；原音哈希未变。近似窗口相关检查均未见整体偏移，但细部对齐仍待核验。重采样原音与双轨和的相对 RMS 误差分别为 -19.83 dB、-17.68 dB；因 Demucs 分离轨和 CLI 缩放定义，不能将该数值当作听感或干净程度评分。\u003c/li\u003e\n\u003cli\u003e产物 SHA-256、模型版本和待听验状态见 \u003ccode\u003edata/manifests/separations.csv\u003c/code\u003e；运行命令、日志、资源和检查结果分别见 \u003ccode\u003eruns/separation_R0002_SEP01/\u003c/code\u003e、\u003ccode\u003eruns/separation_R0003_SEP01/\u003c/code\u003e。\u003cstrong\u003eR0002/R0003 均待用户听验；未分段、未训练、未扩大下载。\u003c/strong\u003e本次仅更新云端副本，Windows 本地副本和哈希同步仍待进行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2026-09-30_3\"\u003e2026-09-30 三份分离轨听验通过，进入结构分段边界准备\u003c/h3\u003e\n\u003cp\u003e用户在查看 R0002/R0003 原音与 Demucs 双轨、被明确请按人声旋律/拖腔完整性和伴奏唱词/配器标准判定后，回复“都通过”。结合 R0001 的单独反馈，三份 Demucs 双轨均标为\u003cstrong\u003e小规模流程验证可用\u003c/strong\u003e；R0002/R0003 没有逐处伪影时间点或细项说明，不能据此宣称“无伪影”。\u003ccode\u003edata/manifests/separations.csv\u003c/code\u003e 已记录用户听验结果。\u003c/p\u003e\n\u003cp\u003e下一步先提出 R0001 的\u003cstrong\u003e候选结构边界\u003c/strong\u003e：原音、人声、伴奏同时间对照；声学低人声活动窗口仅用于帮助定位，不自动等同于唱句或过门边界。未经用户听验候选边界，不写入正式 \u003ccode\u003esegments.csv\u003c/code\u003e 或输出配对唱段。原始完整录音与完整分离轨继续保留；正式训练仍未开始。\u003c/p\u003e\n\u003cp\u003e已生成 R0001 的只用于试听定位的 \u003ccode\u003eruns/segmentation_prepare/R0001/candidate_windows.csv\u003c/code\u003e 和每窗口同时间的原音／人声／伴奏预览（共 6 个窗口、18 个预览 WAV）。方法为人声单声道 10 ms RMS、110 ms 中值平滑，选低于 -40 dBFS 且持续至少 1.5 秒的窗口；该阈值是定位工具，不是戏曲结构判定。窗口为 0.00–2.33、19.09–21.45、33.35–43.54、47.37–50.74、60.79–64.76、83.50–92.58 秒；这些位置的伴奏 RMS 仍为约 -24 至 -17.5 dBFS，不能称为整段静音。预览含前后约 2 秒上下文，\u003cstrong\u003e没有生成正式分段、\u003ccode\u003esegments.csv\u003c/code\u003e 或配对样本\u003c/strong\u003e。先请用户核对这些位置的实际唱句、拖腔与过门关系，再决定长唱段的结构边界。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30_4\"\u003e2026-09-30 伴奏区间反馈与首轮完整候选片段\u003c/h3\u003e\n\u003cp\u003e用户描述 W02、W03 两个预览均为“开始一点人声，中间一直伴奏，末尾又一小段人声”。此反馈确认预览含两次人声之间的伴奏区间，但没有确认其戏曲结构名称或精确切点。已写入 \u003ccode\u003ecandidate_windows.csv\u003c/code\u003e；不能将该描述直接记为分段边界通过。W03 曾在客户端显示不可用；文件完整解码正常，另生成 MP3 和 PCM16 WAV 试听副本，原文件保留。\u003c/p\u003e\n\u003cp\u003e为让下一轮听验覆盖完整唱腔与伴奏过程，建立 \u003ccode\u003eruns/segmentation_prepare/R0001/paired_candidates_v1/\u003c/code\u003e：\u003ccode\u003eCAND01\u003c/code\u003e 为 0.00–21.20 秒（21.20 秒），\u003ccode\u003eCAND02\u003c/code\u003e 为 21.20–43.25 秒（22.05 秒）。暂把每次人声结束后的伴奏区间保留在前一候选片段，切点落在下一次人声活动之前约 0.25–0.29 秒的低人声窗口中；这些切点来自声学定位，尚未证明是自然音乐落点。保留片头伴奏，不设置统一片长上限。\u003c/p\u003e\n\u003cp\u003e每个候选均有同时间原音、人声和伴奏 WAV，以及仅供播放的 MP3 副本。人声/伴奏按同一 44.1 kHz 样本边界裁切，帧数分别为 934,920、972,405；解码后样本与对应完整分离轨片段逐样本一致，未淡化、归一化或重采样。路径、样本索引、SHA-256 和待审核状态见 \u003ccode\u003epaired_candidates_v1/candidate_pairs.csv\u003c/code\u003e。\u003cstrong\u003e仅为候选试听材料，未创建正式 \u003ccode\u003esegments.csv\u003c/code\u003e/\u003ccode\u003epairs.csv\u003c/code\u003e，未启动训练，未修改实验源代码。\u003c/strong\u003e下一关口由用户听验两个候选的起止是否完整、是否切断唱腔/伴奏，以及伴奏区间归属是否合适；必要时调整切点后再复核。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30-r0001_1\"\u003e2026-09-30 R0001 前两个片段边界确认与配对保存\u003c/h3\u003e\n\u003cp\u003e用户明确反馈首轮两个候选“没有截断、自然、完整”（此前“没有阶段”为随即更正的输入，不作独立判断）。据此将 CAND01/CAND02 边界记为通过，分别保存为 \u003ccode\u003edata/clips/R0001/SEP02/SEG0001_{vocal,accompaniment}.wav\u003c/code\u003e 和 \u003ccode\u003eSEG0002_{vocal,accompaniment}.wav\u003c/code\u003e；范围为 0.00–21.20 秒、21.20–43.25 秒。建立 \u003ccode\u003edata/manifests/segments.csv\u003c/code\u003e 和 \u003ccode\u003epairs.csv\u003c/code\u003e，记录同源分离版本、同一开始/结束样本索引、SHA-256 与用户审核依据；两对的训练输入状态保持 \u003ccode\u003epending_compatibility_check\u003c/code\u003e，细部源对齐仍为初查状态，数据划分未分配。\u003c/p\u003e\n\u003cp\u003e保存文件与已审核候选 WAV 哈希一致；解码后与完整分离轨对应范围逐样本一致，人声与伴奏帧数分别为 934,920 和 972,405。完整原音和完整分离轨保留；未修改实验源代码、未运行训练。本轮仅更新云端记录，Windows 本地同步仍待进行。\u003c/p\u003e\n\u003cp\u003eR0001 剩余内容在 \u003ccode\u003eruns/segmentation_prepare/R0001/paired_candidates_v2/\u003c/code\u003e 准备为 CAND03（43.25–64.51 秒，21.26 秒）、CAND04（64.51–92.586667 秒，28.076667 秒）。暂切于低人声活动窗口内、下一次人声进入前约 0.25 秒；CAND03 保留内部短伴奏间隔，CAND04 保留完整录音尾部。两者只是候选；当前并未确认 64.51 秒为自然结构边界。双轨样本边界一致，帧数分别为 937,566、1,238,181，候选 WAV 解码后与完整分离轨对应范围逐样本一致，MP3 仅作播放副本。经审核的前两段与这两候选在样本索引上连续覆盖 R0001 全长，没有空隙或重叠；候选尚未写入正式分段和配对清单。\u003c/p\u003e\n\u003ch3 id=\"2026-09-30-r0001-r0002r0003\"\u003e2026-09-30 R0001 分段全部确认与 R0002/R0003 候选准备\u003c/h3\u003e\n\u003cp\u003e用户对 R0001 CAND03/CAND04 再次明确反馈“没有截断、自然、完整”；据此保存为 SEG0003/SEG0004，并更新 \u003ccode\u003esegments.csv\u003c/code\u003e、\u003ccode\u003epairs.csv\u003c/code\u003e 和候选审核记录。R0001 共四对已确认片段，边界为 0、21.20、43.25、64.51、92.586667 秒；同一人声／伴奏轨的四段重新拼接后，分别与完整分离轨逐样本一致。总计 4,083,072 帧，没有遗漏或重叠。训练输入兼容性仍保持待检查，未训练。\u003c/p\u003e\n\u003cp\u003e使用同样的低人声活动定位办法为后两份准备完整候选，精确音乐边界均待用户审核。R0002 在 \u003ccode\u003eruns/segmentation_prepare/R0002/paired_candidates_v1/\u003c/code\u003e 有五个候选：0–26.80、26.80–49.44、49.44–63.98、63.98–78.73、78.73–108.837143 秒。R0003 在 \u003ccode\u003eruns/segmentation_prepare/R0003/paired_candidates_v1/\u003c/code\u003e 有四个候选：0–13.62、13.62–39.68、39.68–69.73、69.73–80.804875 秒。切点处 ±0.10 秒的人声双声道 RMS 均低于 -35 dBFS，且位于已定位的人声低活动窗口内；这一检查只支持声学定位，不能代替自然音乐边界听验。R0003 的较短唱腔和其后伴奏间隔保留在较长候选内；片头伴奏与尾奏均保留。\u003c/p\u003e\n\u003cp\u003e各候选具备同时间原音、人声、伴奏 WAV 和独立 MP3 试听副本；按原采样率样本索引裁切，不做淡化、归一化或重采样。各录音的候选人声／伴奏连续拼接后分别与其完整分离轨逐样本一致。范围、索引、哈希、待听验状态与定位依据见各目录 \u003ccode\u003ecandidate_pairs.csv\u003c/code\u003e 和 \u003ccode\u003eproposal.json\u003c/code\u003e。R0002 末段约 30.107 秒、R0003 第三段约 30.050 秒，按当前不设统一时长上限的约定保留，没有静默截至 30 秒；实际训练对较长片段的支持仍须核验。R0002/R0003 候选未写入正式配对清单，未修改实验源代码，未启动训练；仅更新云端记录，本地同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-13\"\u003e2026-10-01 全部候选边界通过与 13 对片段保存\u003c/h3\u003e\n\u003cp\u003e用户对 R0002 和 R0003 全部候选回复“两个全都通过”。据此前提出的“没有截断、起止自然、内容完整”审核要求，将九个候选边界记为通过，R0002 保存为 \u003ccode\u003edata/clips/R0002/SEP01/SEG0001–SEG0005\u003c/code\u003e 的人声／伴奏 WAV，R0003 保存为 \u003ccode\u003edata/clips/R0003/SEP01/SEG0001–SEG0004\u003c/code\u003e 的人声／伴奏 WAV。更新 \u003ccode\u003esegments.csv\u003c/code\u003e、\u003ccode\u003epairs.csv\u003c/code\u003e 与候选审核记录；源文件和原候选均保留，旧清单备份在 \u003ccode\u003eruns/segmentation_finalize_20261001/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e合计 R0001 四对、R0002 五对、R0003 四对，共 \u003cstrong\u003e13 对、12,446,285 帧、282.228685 秒（4 分 42.23 秒）\u003c/strong\u003e，单段 11.074875–30.107143 秒。每对人声／伴奏帧数与样本边界一致，保存文件 SHA-256 与候选一致；各原录音分段在开始/结束样本索引上连续、无遗漏无重叠，分段双轨重拼后分别与完整分离轨逐样本一致。详细核验报告见 \u003ccode\u003eruns/segmentation_finalize_20261001/report.json\u003c/code\u003e。源录音细部对齐仍为初查状态，不能把精确裁切和重拼检查误写为独立分轨真值对齐证明。\u003c/p\u003e\n\u003cp\u003e全部 \u003ccode\u003etraining_input_status\u003c/code\u003e 保持 \u003ccode\u003epending_compatibility_check\u003c/code\u003e，数据划分保持 \u003ccode\u003eunassigned\u003c/code\u003e。尚未核验实际训练输入、未执行正式或临时训练，也未扩大下载；13 对并非最终规模化训练集。仅更新云端记录，Windows 本地副本及哈希同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-anyaccomp\"\u003e2026-10-01 AnyAccomp 特征核验代码提案（未落地、未执行）\u003c/h3\u003e\n\u003cp\u003e读取实际公开实现发现：输入 chroma 调用 \u003ccode\u003echroma_stft\u003c/code\u003e 的居中窗口，伴奏 \u003ccode\u003eMelSpectrogram\u003c/code\u003e 默认 \u003ccode\u003ecenter=False\u003c/code\u003e 且反射补齐 \u003ccode\u003e(n_fft-hop_size)/2\u003c/code\u003e；按当前 24 kHz、480 hop 的定义，二者帧数和帧中心可能不一致。配置另列 \u003ccode\u003emel_mean/mel_var\u003c/code\u003e，但公开训练加载器缺失，不能仅凭字段名选定目标归一化方式。这些问题需要先核验，不能用静默裁切或插值掩盖。\u003c/p\u003e\n\u003cp\u003e首轮拟新增 \u003ccode\u003escripts/validate_anyaccomp_features.py\u003c/code\u003e：读取全部已审核 \u003ccode\u003epairs.csv\u003c/code\u003e，先检查哈希、元信息和全长；按官方推理方式转 24 kHz 单声道、提取 24-bin chroma 并调用冻结的现有 VQ（CUDA 使用 bfloat16 autocast），同时调用公开 \u003ccode\u003eMelSpectrogram\u003c/code\u003e 提取伴奏原始 log-mel。保留全长特征、码本范围、帧数差、帧中心定义与来源/权重/环境记录；不自动统一长度、不选定未经证实的训练归一化、不修改权重、不更新数据合格状态。若提取成功也只称“特征核验完成”，完整训练兼容性仍需解决对齐与归一化后接真实 FM 前向/反向和变长批次；REPA/MERT 的完整训练链路亦尚未实现。\u003c/p\u003e\n\u003cp\u003e审阅稿在 \u003ccode\u003eruns/training_input_prepare/validate_anyaccomp_features.py.proposed\u003c/code\u003e，完整新增 diff 在 \u003ccode\u003eruns/training_input_prepare/proposed_feature_audit.patch\u003c/code\u003e。已做 AST 语法检查和 \u003ccode\u003egit apply --check\u003c/code\u003e，尚未把 patch 应用到 \u003ccode\u003escripts/\u003c/code\u003e，未执行 GPU。用户最初明确要求“实验代码如需修改，先解释逻辑、展示核心 diff，等我确认”，因此当前等待本提案确认。确认后在本实验目录建立独立 AnyAccomp 核验环境，现有项目源码/预训练权重只读使用，不复用 Qwen 环境；任务开始与结束通知用户。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01\"\u003e2026-10-01 特征核验提案确认与环境准备\u003c/h3\u003e\n\u003cp\u003e用户回复“确认”，授权实施上述特征核验提案。已按审阅稿原样新增 \u003ccode\u003escripts/validate_anyaccomp_features.py\u003c/code\u003e，内容与 \u003ccode\u003e.proposed\u003c/code\u003e 逐字一致，AST 语法检查通过；确认记录写入 \u003ccode\u003eruns/training_input_prepare/review_status.json\u003c/code\u003e。正在以现有独立 AnyAccomp 环境为依赖来源，克隆到本实验的 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e；不使用 Qwen 环境，原项目源码与权重只读引用。环境与执行日志保存在 \u003ccode\u003eruns/anyaccomp_feature_audit_20261001/\u003c/code\u003e，本阶段只核验特征，不修改模型参数。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-13-anyaccomp\"\u003e2026-10-01 13 对 AnyAccomp 特征核验完成\u003c/h3\u003e\n\u003cp\u003e独立环境 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e 已建立（约 6.3 GB），从现有独立 AnyAccomp 环境克隆，不使用 Qwen。Python 3.9.19、torch 2.3.1+cu121、librosa 0.11.0、accelerate 1.6.0；依赖冻结清单见 \u003ccode\u003eruns/anyaccomp_feature_audit_20261001/pip_freeze.txt\u003c/code\u003e，克隆日志与执行记录在同目录。使用物理 GPU 4（UUID \u003ccode\u003eGPU-f37d634b-c2bd-b66f-44a2-6608ae61b06e\u003c/code\u003e，进程内 \u003ccode\u003ecuda:0\u003c/code\u003e）按已批准脚本执行，退出码为 0，已分别通知用户开始与结束，GPU 已释放。PyTorch 最大已分配显存 240,420,352 字节（约 229.3 MiB）；这不包含全部 CUDA 上下文/驱动占用，也不是后续 FM 训练的显存估计。\u003c/p\u003e\n\u003cp\u003e全部 13 对通过输入哈希、解码与元信息检查，按完整片段转 24 kHz 单声道并生成 24-bin chroma、冻结 VQ 整数 token 和 128-bin 伴奏原始 log-mel。输出 13 份 \u003ccode\u003e.npz\u003c/code\u003e（合计目录约 7.3 MB），见 \u003ccode\u003eruns/anyaccomp_feature_audit_20261001/features/\u003c/code\u003e。全部 token ID 在 0–511 范围内，特征有限、保存形状与报告一致；没有裁切、插值或长度统一，原音与正式配对 WAV 保留。结果报告 \u003ccode\u003efeatures/report.json\u003c/code\u003e，逐对执行日志 \u003ccode\u003efeature_audit.log\u003c/code\u003e，保存产物哈希与后验核验 \u003ccode\u003epost_validation.json\u003c/code\u003e。仅构建量化器时，检查点中的解码器和 chroma 重建输出层未使用属于预期；所需张量均存在且形状一致。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e确认的接口问题\u003c/strong\u003e：13 对均为 \u003ccode\u003etoken_frames = target_mel_frames + 1\u003c/code\u003e。当前 chroma 的窗口中心为 \u003ccode\u003e0 + k*480\u003c/code\u003e，目标 mel 为 \u003ccode\u003e240 + k*480\u003c/code\u003e，两者中心定义相差 240 个样本（24 kHz 下 10 ms）；只删一个 token 能统一数量，不能据此证明时间起点已对齐。这是特征定义差异，不能写成 WAV 分离轨本身错位。目标训练归一化仍未确定，公开完整训练加载器缺失。本轮未调用 FM 前向/反向，未修改权重，REPA/MERT 链路亦未实现；所有配对训练输入状态仍为 \u003ccode\u003epending_compatibility_check\u003c/code\u003e，报告为 \u003ccode\u003enot_verified\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e下一步先只读核查实际 FM 对条件序列/目标的长度处理和归一化线索，明确可追溯的实验适配方案，再展示核心代码或 diff 并解释输入输出、关键逻辑、用途和必要限制，等待用户确认后实施真实前向/反向及混合长度批次验证。不扩大下载或宣称全流程通过。云端文档已更新，Windows 本地同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm\"\u003e2026-10-01 真实 FM 输入适配核查与代码提案（待确认）\u003c/h3\u003e\n\u003cp\u003e用户要求“开始下一步”，并再次明确询问当前是否仍在数据处理部分。此阶段仍属数据处理与训练输入兼容性验证；前向、计算损失、反向仅检查输入能否用于训练，正式微调和效果评价尚未开始。本轮仅只读检查实际源码、官方论文/推理及 CPU 上的检查点参数合同，没有执行 GPU 或模型前向/反向。\u003c/p\u003e\n\u003cp\u003eFM 源码 \u003ccode\u003eDiffLlamaConcat\u003c/code\u003e 将条件表示与目标 mel 表示按时间索引直接相加，没有自动时间插值；因此长度相同和共同时间网格是适配要求。官方 \u003ccode\u003einfer_from_folder.py\u003c/code\u003e 将 \u003ccode\u003ereverse_diffusion\u003c/code\u003e 输出直接交给 vocoder，Vocos 的公开 forward 只有 backbone/head，没有 \u003ccode\u003emel_mean/mel_var\u003c/code\u003e 的反归一化。公开 Python 文件未找到该两字段的操作；据此选择原始自然对数 mel 做本实验接口验证，但这是从公开推理作出的推断，不能证明缺失的作者训练加载器使用了什么归一化。原始样本 log-mel 均值约 -4.56 至 -3.03、标准差约 1.43 至 2.54，仅作为诊断记录，不据此判断参数 \u003ccode\u003emel_var\u003c/code\u003e 的语义。\u003c/p\u003e\n\u003cp\u003eFM 检查点 SHA-256 \u003ccode\u003ee6802bd1123935a54e990cb8d3897a18190df6c53f73db021baa28c420721129\u003c/code\u003e。完整严格加载发现公开模型没有对应的三个张量：\u003ccode\u003etag_infilling_emb\u003c/code\u003e、\u003ccode\u003etag_emb.weight\u003c/code\u003e、\u003ccode\u003etag_emb.bias\u003c/code\u003e；其来源用途尚不明确，不冒称代码与完整检查点精确匹配。拟只明确排除这三个张量，再对公开模型实际需要的全部参数严格核对键名、形状和加载；不得使用不加约束的 \u003ccode\u003estrict=False\u003c/code\u003e 掩盖额外差异。只读 CPU 核验结果见 \u003ccode\u003eruns/training_input_prepare/fm_adapter_v1/checkpoint_inspection.json\u003c/code\u003e，分析记录见 \u003ccode\u003einspection.json\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e拟新增 \u003ccode\u003escripts/validate_fm_inputs.py\u003c/code\u003e：人声 chroma/VQ 编码原样保留；针对完整伴奏 WAV 重提原始 log-mel，显式使用 960 样本两侧反射补齐、非居中 STFT，使帧中心为 \u003ccode\u003e0+k*480\u003c/code\u003e，与官方人声 chroma 网格一致。保留音频全长和末尾帧，不截 token、不插值离散 ID；此前默认目标使用 720 样本补齐、中心为 \u003ccode\u003e240+k*480\u003c/code\u003e。这是本实验选择的目标网格适配，尚未证明作者训练使用了该规则，也未验证此目标网格对预训练 vocoder 的边界/输出时间含义，不能直接当作最终训练配方。\u003c/p\u003e\n\u003cp\u003e对 13 对完整片段逐对调用现有 220M FM 训练 forward，按论文速度目标 \u003ccode\u003ex-(1-sigma)*noise\u003c/code\u003e 计算有效非 prompt 帧的 MSE，并做反向检查非零、有限梯度；另对最短+最长混合长度批次补齐，核验 attention/loss 有效长度掩码，使用相同随机抽样扰动 padding 内容，确认有效帧预测和损失不受影响。超过 30 秒的完整段也包含在核验中。没有优化器和参数更新。保持公开原生 CFG 掉条件概率 0.2 和随机 prompt 逻辑；其 prompt 随机长度依赖 padded T 而非逐条有效长度，且配置 \u003ccode\u003eprompt_prob=0\u003c/code\u003e 没有阻止该分支，均记录为原训练配方待核验问题。REPA 投影保留但冻结，尚不计算 MERT/REPA 损失；本轮只能验证 FM 主损失接口。\u003c/p\u003e\n\u003cp\u003e完整审阅稿 \u003ccode\u003eruns/training_input_prepare/fm_adapter_v1/validate_fm_inputs.py.proposed\u003c/code\u003e 和新增 diff \u003ccode\u003eproposed_fm_adapter.patch\u003c/code\u003e 已准备，AST 与 patch 应用预检查通过。脚本未落地到 \u003ccode\u003escripts/\u003c/code\u003e、未执行；用户确认核心改动后才落地和启动，继续使用本实验独立环境，并通知任务开始和结束。预计单 GPU 4090、数分钟，显存预算约 8–18 GiB，仅为估计；若 OOM 则停止记录，不静默截断或改批次。所有数据合格状态仍待兼容性与配方核验；Windows 同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm_1\"\u003e2026-10-01 用户确认 FM 提案与真实输入核验完成\u003c/h3\u003e\n\u003cp\u003e用户回复“确认当前提案”，并要求之后各步骤均讲解使用的工具/模型是什么、用途、输入输出及验收含义。该表达要求已追加到云端 Codex 全局个性化文件 \u003ccode\u003e$CLOUD_HOME/codex/home/AGENTS.md\u003c/code\u003e，当前会话也已加载；尚未同步到 Windows。批准稿原样新增为 \u003ccode\u003escripts/validate_fm_inputs.py\u003c/code\u003e（SHA-256 \u003ccode\u003e1ffe3b4ca7c3ffcbdeb5bd1a222cb22a00cc91cc4704e75330ef60f20d5a4d02\u003c/code\u003e），内容与审阅稿一致，语法检查通过。\u003c/p\u003e\n\u003cp\u003e执行在本实验独立 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e 中，使用 GPU 4。已向用户通知开始、日志与查询命令，并在任务结束时通知释放 GPU。实际 \u003ccode\u003e/usr/bin/time\u003c/code\u003e 壁钟耗时 \u003cstrong\u003e10.86 秒\u003c/strong\u003e，退出码 0，最大常驻内存 1,832,292 KiB（约 1.75 GiB）；PyTorch 最大已分配显存 \u003cstrong\u003e8,407,889,408 字节（约 7.83 GiB）\u003c/strong\u003e，不包含全部驱动/上下文占用。此前“数分钟、8–18 GiB”为执行前预算，实测替代该预算，不将它用于估算正式微调资源。\u003c/p\u003e\n\u003cp\u003e在批准的实验目标网格下，13 对完整片段均成功提取目标并经过真实预训练 FM forward、有效非 prompt 帧 MSE 和 backward；均得到有限损失与非零有限梯度，没有缺失的应训练 FM 参数梯度。单样本损失约 2.98–9.29，这些数值仅作接口诊断，未作训练收敛、分离质量或生成效果阈值。包含两个超过 30 秒的完整片段，没有缩短。最短 \u003ccode\u003eR0003_SEP01_SEG0004\u003c/code\u003e（554 帧）与最长 \u003ccode\u003eR0002_SEP01_SEG0005\u003c/code\u003e（1,506 帧）组成混合批次，最短补齐 952 帧；反向与掩码检查通过，补齐位置的目标值改为 100、条件 token 改为 511 后，使用相同随机抽样，有效帧预测与损失在规定容差内保持一致。该结果支持当前批次的补齐不会污染有效位置，不能证明任意 prompt/长度组合都安全。\u003c/p\u003e\n\u003cp\u003e共完成 14 个前向/反向批次（13 个单样本 + 1 个混合长度批次），另有一次无梯度的 padding 扰动前向。没有优化器、没有参数更新或新训练检查点。全部 13 份人声 token 与上一轮核验产物完全一致；目标 mel 在新网格上帧数匹配、数值有限并全长保存。三份原音 SHA-256 与下载记录一致，四份原清单内容不变。源 FM 检查点前后哈希一致。正式 \u003ccode\u003epairs.csv\u003c/code\u003e 的 \u003ccode\u003epending_compatibility_check\u003c/code\u003e 保留，细分进展由报告记录为 \u003ccode\u003efm_forward_backward_status=passed_under_experimental_adapter\u003c/code\u003e 和 \u003ccode\u003etraining_input_status=pending_recipe_validation\u003c/code\u003e，不将部分通过写成完整可训练验收。\u003c/p\u003e\n\u003cp\u003e日志和产物根目录：\u003ccode\u003eruns/anyaccomp_fm_input_smoke_20261001/\u003c/code\u003e。结果 \u003ccode\u003eresults/report.json\u003c/code\u003e、13 份 \u003ccode\u003eresults/*.npz\u003c/code\u003e、执行配置 \u003ccode\u003eexecution.json\u003c/code\u003e、执行日志 \u003ccode\u003efm_input_smoke.log\u003c/code\u003e、资源记录 \u003ccode\u003eresources.txt\u003c/code\u003e 与后验哈希检查 \u003ccode\u003epost_validation.json\u003c/code\u003e 均保存。批准/完成记录见 \u003ccode\u003eruns/training_input_prepare/fm_adapter_v1/review_status.json\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e待核验限制沿用批准提案：目标时间网格是实验适配；原始 log-mel 的选择依据公开推理作出，原作者训练归一化未确认；三份 tag 张量不在公开模型定义中且明确排除，其余 137 个实际需要的张量按名字/形状严格加载；公开随机 prompt 以补齐后的最大长度取样，配置 \u003ccode\u003eprompt_prob=0\u003c/code\u003e 未控制该分支；公开 CFG 掉条件概率 0.2 与论文 0.1 不同；MERT/REPA 主链路未实现，REPA 投影只保留并冻结。本轮通过不能消除这些配方差异，未完成小规模全流程验收，未扩大收集、未正式微调。仅云端更新，Windows 同步待进行。\u003c/p\u003e\n\u003ch3 id=\"_1\"\u003e当前流程中工具与模型的作用（逐步讲解依据）\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e步骤\u003c/th\u003e\n\u003cth\u003e使用的东西与作用\u003c/th\u003e\n\u003cth\u003e输入 → 输出\u003c/th\u003e\n\u003cth\u003e当前结果能证明什么\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e下载和文件检查\u003c/td\u003e\n\u003ctd\u003e完整 WAV、SHA-256 哈希、解码检查；哈希是文件内容指纹，解码检查验证音频能完整读取\u003c/td\u003e\n\u003ctd\u003e来源文件 → 有记录的完整录音\u003c/td\u003e\n\u003ctd\u003e三份录音完整可读、内容可追溯；这些检查不评价音乐质量。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分离\u003c/td\u003e\n\u003ctd\u003eDemucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e 从混合音频中估计人声和其余伴奏；两轨用于建立监督配对\u003c/td\u003e\n\u003ctd\u003e完整混合录音 → \u003ccode\u003evocals.wav\u003c/code\u003e / \u003ccode\u003eno_vocals.wav\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e已由用户听验接受小规模流程使用；有伪影，未取得独立干净真值。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分段和配对\u003c/td\u003e\n\u003ctd\u003e按用户听验过的边界，用同一采样索引切两轨；CSV 清单记录来源、时间和哈希\u003c/td\u003e\n\u003ctd\u003e两条完整分离轨 → 13 对 WAV + 清单\u003c/td\u003e\n\u003ctd\u003e边界通过听验、双轨一一对应、拼回完整轨逐样本一致；不等于已证明独立真值对齐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e模型输入预处理\u003c/td\u003e\n\u003ctd\u003eSoundFile 读取，NumPy 合并声道，librosa 重采样；统一为模型所用的 24 kHz 单声道\u003c/td\u003e\n\u003ctd\u003e已保存的 44.1 kHz 双声道片段 → 临时 24 kHz 单声道数组\u003c/td\u003e\n\u003ctd\u003e模型输入格式统一，原始 WAV 不改写。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e人声旋律表示\u003c/td\u003e\n\u003ctd\u003elibrosa 24-bin chromagram 表示随时间变化的音级能量，再用冻结预训练 VQ 映射到 512 项码本 ID；离散瓶颈压缩音色/部分伪影信息\u003c/td\u003e\n\u003ctd\u003e人声音频 → chroma → 旋律 token 序列\u003c/td\u003e\n\u003ctd\u003e编码可提取、范围与长度合同通过；不能保证已受损的旋律被修复，也不清理伴奏目标。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伴奏目标表示\u003c/td\u003e\n\u003ctd\u003eSTFT 将波形转成时频表示，128-band mel 滤波与自然对数压缩，得到训练目标；本实验将其帧中心与旋律编码对齐\u003c/td\u003e\n\u003ctd\u003e完整伴奏片段 → 原始 log-mel\u003c/td\u003e\n\u003ctd\u003e13 对目标帧数、定义的时间网格和有限值检查通过；作者原预处理和 vocoder 时间含义仍待核验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFM 输入兼容性\u003c/td\u003e\n\u003ctd\u003eFM（Flow Matching）以旋律 token 为条件预测噪声通向伴奏 mel 的变化方向。训练前向为随机中间状态预测方向，MSE 衡量与目标方向的差异；backward 计算参数梯度，当前没有执行参数更新\u003c/td\u003e\n\u003ctd\u003etoken、目标 mel、有效长度掩码 → 预测、损失、梯度\u003c/td\u003e\n\u003ctd\u003e13 对全长及混合长度批次通过主损失接口；有限损失/梯度不证明模型已学会歌仔戏或生成效果好。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e声音输出检查\u003c/td\u003e\n\u003ctd\u003evocoder（声码器）把 FM 生成的 mel 转成可播放的音频；本次先从真实伴奏 mel 重建音频，检查目标表示与声码器衔接\u003c/td\u003e\n\u003ctd\u003e伴奏 mel → 合成 WAV\u003c/td\u003e\n\u003ctd\u003e三段、两种网格的 raw/z-score 对照已执行；z-score 改善幅度尺度，质量听验与时间规则仍待完成。未运行 FM 生成。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e后续完整训练配方\u003c/td\u003e\n\u003ctd\u003eMERT 提供预训练音乐表征，REPA 是让 FM 中间表示与该表征对齐的辅助训练损失；CFG 训练时随机丢条件，推理时加强条件约束\u003c/td\u003e\n\u003ctd\u003e音乐目标/中间表示 → 辅助损失与条件引导\u003c/td\u003e\n\u003ctd\u003e这些配方仍待明确；正式微调和效果评价属于后续模型实验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eFM 的作用可串起来理解：人声 WAV → chroma/VQ 旋律 token → \u003cstrong\u003eFM 根据旋律从噪声生成伴奏 mel\u003c/strong\u003e → vocoder 生成伴奏 WAV。训练时已知对应伴奏 mel，用来教 FM 学习变化方向；推理时只有输入旋律和随机噪声，逐步积分得到新的伴奏。当前数据实验只是验证训练数据能够正确进入这条链路，没有完成模型训练。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_1\"\u003e2026-10-01 声码器目标重建核验提案（具体代码待确认）\u003c/h3\u003e\n\u003cp\u003e用户对“先准备核验核心 diff，讲解后确认运行”的下一步回复“确认”。本轮据此准备代码和核验清单；仍按此前明确约定，在展示具体核心 diff 后取得代码确认，再落地到 \u003ccode\u003escripts/\u003c/code\u003e 并启动 GPU。未运行声码器 forward 或生成试听音频。\u003c/p\u003e\n\u003cp\u003e使用既有 Vocos 声码器，作用是把 128-band mel 频谱转换成 24 kHz 单声道波形。公开配置为 30 层、dim 1024、hop 480、ISTFT \u003ccode\u003epadding=same\u003c/code\u003e。只读 CPU 检查确认 255,042,434 个参数、279 个所需张量与下载检查点名称及形状完全一致，严格加载通过，未发现缺失或额外张量。检查点 \u003ccode\u003epretrained/anyaccomp/pretrained/vocoder/model.safetensors\u003c/code\u003e（位于原项目权重目录，只读使用）SHA-256 \u003ccode\u003e1b7efd04c71c058cd00b4e9a91c761b31da745f878b7d7ee839e157104d3a7da\u003c/code\u003e。来源/config 哈希与 CPU 加载记录见 \u003ccode\u003eruns/training_input_prepare/vocoder_audit_v1/inspection.json\u003c/code\u003e；源定义对应此前检查的 AnyAccomp 公共快照，不改源码或权重。\u003c/p\u003e\n\u003cp\u003e计划选短 \u003ccode\u003eR0003_SEP01_SEG0004\u003c/code\u003e（11.074875 秒）、中 \u003ccode\u003eR0001_SEP02_SEG0001\u003c/code\u003e（21.20 秒）、长 \u003ccode\u003eR0002_SEP01_SEG0005\u003c/code\u003e（30.107143 秒），每段从真实伴奏目标的原网格 mel 和实验对齐网格 mel 各重建一次，共六次推理。不运行 FM 生成、不训练或修改参数。独立环境沿用本实验 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e，计划用 GPU 4，运行前复查空闲状态并通知开始/结束。声码器使用 float32、eval、inference_mode，保持公开推理传入 float mel 的方式，不加入额外标准化。\u003c/p\u003e\n\u003cp\u003e每段保存同一 24 kHz 单声道参考 WAV、两种未经裁切/补齐/移位/淡化的原生重建 FLOAT WAV，各附 MP3 试听副本，共九份 WAV 和九份 MP3。试听预览如需避免幅度过载，三份共享同一个只衰减不增益的系数；该系数只用于 MP3，诊断使用原生 FLOAT WAV，不单独均衡响度。源录音、正式配对 WAV 和清单保留。检查输入哈希及来源、输出形状/有限值/峰值/RMS/超过幅度 1 的数量，记录头尾 0.5 秒统计；不把峰值统计或相关性当作自动听觉验收阈值。\u003c/p\u003e\n\u003cp\u003eISTFT 合成源码给出的原生长度为 \u003ccode\u003emel_frames * 480\u003c/code\u003e；原网格与实验对齐网格相差一帧，因此两类重建长度预计相差 480 个样本（20 ms）。它们分别相对完整参考的预计长度差：短段 -14.9167 / +5.0833 ms，中段 -0.0417 / +19.9583 ms，长段 -7.1667 / +12.8333 ms。这些是输入帧数和源码公式的推算，尚非 GPU 实测。合成窗口中心为 \u003ccode\u003e240+k*480\u003c/code\u003e，实验对齐目标中心为 \u003ccode\u003e0+k*480\u003c/code\u003e；由此可提出 10 ms 偏移的待验证假设，不能把结构推算冒充实际音频对齐结果。\u003c/p\u003e\n\u003cp\u003e拟用归一化波形相关搜索 ±50 ms（采样点精度）及 10 ms RMS 平滑包络搜索 ±100 ms（1 ms 精度），另外分别检查开头、中间和末尾的 2 秒窗口。正估计偏移表示重建滞后参考，弱相关或峰值在搜索边界需要进一步审查；不自动移位，也不认为有相关峰就已证明每个乐器/位置对齐。CPU 合成信号验证了 +240/-240 样本偏移、反相与退化输入的算法处理，结果见 \u003ccode\u003etiming_algorithm_checks.json\u003c/code\u003e；这不是声码器实际输出测试。最终仍由用户比较三个完整参考及两种重建，判断配器、节奏、过门、边界和新增失真。\u003c/p\u003e\n\u003cp\u003e完整审阅稿 \u003ccode\u003eruns/training_input_prepare/vocoder_audit_v1/validate_vocoder_targets.py.proposed\u003c/code\u003e，新增 diff \u003ccode\u003eproposed_vocoder_audit.patch\u003c/code\u003e。AST 语法与 \u003ccode\u003egit apply --check\u003c/code\u003e 通过，未应用到 \u003ccode\u003escripts/\u003c/code\u003e、未执行 GPU；审核状态见同目录 \u003ccode\u003ereview_status.json\u003c/code\u003e。预计单 4090 float32 前向数十秒到数分钟、显存预算约 2–6 GiB，仅是预算，实际运行会记录。输出与监听状态将在执行后记录为技术生成完成、用户听验待定；不提前判定完整训练输入兼容性通过，不开始规模化采集。本地 Windows 同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-mel\"\u003e2026-10-01 声码器核验执行完成，原始 mel 重建存在尺度异常\u003c/h3\u003e\n\u003cp\u003e用户对展示后的具体代码回复“确认”。已按批准稿原样新增 \u003ccode\u003escripts/validate_vocoder_targets.py\u003c/code\u003e，SHA-256 \u003ccode\u003e70c68b290f1b15608cc4db1591ee05fb6eb7375e90d2cc3266db2866f049fad9\u003c/code\u003e；沿用实验独立环境，在 GPU 4 执行六次 float32 Vocos 重建。开始、监控路径及结束释放 GPU 均已通知用户。退出码 0，实际壁钟耗时 \u003cstrong\u003e10.90 秒\u003c/strong\u003e，最大常驻内存 1,590,320 KiB（约 1.52 GiB），PyTorch 最大已分配显存约 \u003cstrong\u003e1.046 GiB\u003c/strong\u003e。无 FM 调用、无参数更新，全部原音与正式清单哈希保持不变。\u003c/p\u003e\n\u003cp\u003e产物位于 \u003ccode\u003eruns/anyaccomp_vocoder_audit_20261001/results/\u003c/code\u003e：三个片段各有 \u003ccode\u003ereference_24k\u003c/code\u003e、\u003ccode\u003eoriginal_grid\u003c/code\u003e、\u003ccode\u003ealigned_grid\u003c/code\u003e 的 FLOAT WAV 和 MP3，合计九份 WAV、九份 MP3。全部 WAV 有限、24 kHz 单声道、原生帧数符合 \u003ccode\u003emel_frames*480\u003c/code\u003e；九份 MP3 均通过完整解码，试听共享增益均为 1，没有掩盖输出幅度变化。资源/执行记录、逐段诊断和后验检查分别见同目录上层 \u003ccode\u003eresources.txt\u003c/code\u003e、\u003ccode\u003eexecution.json\u003c/code\u003e、\u003ccode\u003evocoder_audit.log\u003c/code\u003e、\u003ccode\u003epost_validation.json\u003c/code\u003e；结果报告为 \u003ccode\u003eresults/report.json\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e技术生成完成不等于重建质量通过\u003c/strong\u003e：六份重建 RMS 比参考低约 37.97–38.81 dB，输出峰值约 0.0083–0.0132，参考峰值约 0.718–0.860。整体波形相关绝对值仅约 0.12–0.21，波形相关的局部峰不稳定，不能用其给出可靠采样点级对齐结论。RMS 包络相关约 0.895–0.963，原网格滞后约 1–2 ms，对齐网格约 9–12 ms；此结果支持网格改变带来约 10 ms 时间差异的线索，不证明所有音符/乐器/边界精确对齐。原生输出长度实测与提案推算一致，均未裁切、补齐或移位。\u003c/p\u003e\n\u003cp\u003e下表每格顺序均为“原网格 / 对齐网格”。正时间偏移表示重建滞后参考。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e片段\u003c/th\u003e\n\u003cth\u003e输出相对参考的长度差（ms）\u003c/th\u003e\n\u003cth\u003eRMS 包络估计滞后（ms）\u003c/th\u003e\n\u003cth\u003e输出相对参考 RMS 差（dB）\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0003_SEP01_SEG0004\u003c/td\u003e\n\u003ctd\u003e-14.9167 / 5.0833\u003c/td\u003e\n\u003ctd\u003e1 / 9\u003c/td\u003e\n\u003ctd\u003e-38.57 / -38.59\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0001_SEP02_SEG0001\u003c/td\u003e\n\u003ctd\u003e-0.0417 / 19.9583\u003c/td\u003e\n\u003ctd\u003e1 / 11\u003c/td\u003e\n\u003ctd\u003e-38.80 / -38.81\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0002_SEP01_SEG0005\u003c/td\u003e\n\u003ctd\u003e-7.1667 / 12.8333\u003c/td\u003e\n\u003ctd\u003e2 / 12\u003c/td\u003e\n\u003ctd\u003e-38.00 / -37.97\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e当前诊断结论为 \u003ccode\u003ereconstruction_amplitude_anomaly_requires_preprocessing_review\u003c/code\u003e；重建验收与用户听验保持待定，完整训练输入配方仍为 \u003ccode\u003epending_recipe_validation\u003c/code\u003e。不能只调大播放器音量或在输出端增益后把本轮写成输入兼容性通过；应先核查频谱尺度、标准化和实现合同。ISTFT 的保存窗幅度为正常 Hann（min 0、max 1、mean 0.5、平方和 720），未发现该 buffer 损坏证据；权重张量合同完整不能代替输入尺度核验。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-z-score\"\u003e2026-10-01 归一化推断修正与 z-score 对照提案（未执行）\u003c/h3\u003e\n\u003cp\u003e进一步查阅上游 \u003ca href=\"https://github.com/open-mmlab/Amphion/blob/58d8b48945281efdfe539151d01ee98010acc425/models/vc/vevo/vevo_utils.py\"\u003eVevo 官方源码\u003c/a\u003e发现：\u003ccode\u003eextract_mel_feature\u003c/code\u003e 明确使用 \u003ccode\u003e(mel - mel_mean) / sqrt(mel_var)\u003c/code\u003e，而预测的 mel 直接送入 vocoder。该文件对应 \u003ccode\u003eopen-mmlab/Amphion@58d8b48945281efdfe539151d01ee98010acc425\u003c/code\u003e；证据副本与 SHA-256 \u003ccode\u003e38b7f2a927600b15dc76eea3a07733c1db2d67bd094df9a8a9deacf50389cdd3\u003c/code\u003e 保存在 \u003ccode\u003eruns/training_input_prepare/vocoder_normalization_v1/normalization_evidence.json\u003c/code\u003e 和 \u003ccode\u003eupstream_vevo_utils.reference.py.txt\u003c/code\u003e。这说明“没有反归一化”也可能表示整个生成链在标准化 mel 空间工作；此前以公开 AnyAccomp 直接送入 vocoder 的代码支持原始 log-mel 的推断不充分，必须修正。先前 FM 检查仅证明原始尺度输入可计算有限损失/梯度，不证明尺度符合预训练合同。\u003c/p\u003e\n\u003cp\u003e这是上游 Vevo 的明确实现线索，\u003cstrong\u003e尚不等于证明 AnyAccomp 原训练采 \n\u003cp\u003ez-score 对齐网格重建\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"reader-missing\" title=\"$CLOUD_FINETUNE_ROOT/runs/anyaccomp_vocoder_zscore_20261001/results/R0002_SEP01_SEG0005/aligned_grid.mp3\"\u003eR0002_SEP01_SEG0005 z-score 对齐网格重建（本地素材未同步）\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_2\"\u003e2026-10-01 标准化重建听验反馈与时间网格说明\u003c/h3\u003e\n\u003cp\u003e用户反馈：“我听起来感觉和原版参照都差不多。”记录为标准化对照的整体听感未发现明显差异，不扩展为用户已逐项确认六份重建的边界或采样级对齐。反馈原文与范围见 \u003ccode\u003eruns/anyaccomp_vocoder_zscore_20261001/user_listening_feedback.json\u003c/code\u003e。完整训练输入兼容性与最终时间规则仍待验证，本轮没有新 GPU 任务或实验代码修改。\u003c/p\u003e\n\u003cp\u003e时间网格指特征帧在音频上取窗口的时间位置。本实验采样率 24 kHz，hop=480 即每 20 ms 一帧，mel 窗长 1920 即 80 ms，窗口彼此重叠。公开 chroma/VQ 条件中心为 0、20、40…ms；原网格 mel 采用两端反射补齐 720 个样本，中心为 10、30、50…ms；实验对齐网格 mel 补齐 960 个样本，中心为 0、20、40…ms。两者的 mel 定义与标准化相同，但窗口位置不同。对齐网格比原网格多一帧是边界窗口数量变化，不是在原始录音中插入声音，也没有修改已有旋律 token。\u003c/p\u003e\n\u003cp\u003e对齐网格解决条件与目标特征的帧中心定义差异；声码器原生合成约定仍对应 10、30、50…ms，因此直接解码对齐 mel 时观察到约 9–10 ms 的包络滞后。这两种“对齐”须分开核验，不能只因特征数量相同或听感相近就确定完整训练/解码合同。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm-diff\"\u003e2026-10-01 标准化 FM 输入复核提案（具体 diff 待确认）\u003c/h3\u003e\n\u003cp\u003e用户询问下一步。鉴于标准化声码器重建已得到整体听感接近参考的反馈，拟保留现有实验对齐网格和全部旋律 token，仅将实际送入 FM 的目标改为 \u003ccode\u003e(raw_logmel - mel_mean) / sqrt(mel_var)\u003c/code\u003e。两份本地配置的采样率、FFT/窗长、hop、mel 数量、频率范围、均值与方差逐项一致；新增 z-score 模式时检查一致性以及均值有限、方差有限且为正。默认 raw 用于保留基线模式，并修正旧报告中对原始尺度的过度推断。\u003c/p\u003e\n\u003cp\u003e拟重新检查 13 对完整片段的原生 FM 前向、有效非 prompt 帧主损失、反向梯度，以及最短/最长混合批次的补齐与补齐扰动不变性。保存同一份原始 mel、实际输入 mel、未改动 token、特征范围和归一化来源；没有优化器步骤，不修改预训练参数。使用相同独立环境，预计 PyTorch 峰值约 8 GiB（前次 7.83 GiB），运行及核对预计几十秒至数分钟，选卡仍须执行前检查。仅 FM 主损失接口范围内验收；REPA/MERT、原生随机 prompt/CFG、检查点额外 tag 张量及缺失公开完整训练加载器的限制沿用，不宣称完整训练配方复现。\u003c/p\u003e\n\u003cp\u003e本轮不自动修正解码波形或改变时间网格。条件/目标中心仍为 0+k\u003cem\u003e480，声码器原生合成中心为 240+k\u003c/em\u003e480；约 10 ms 解码偏移及边界长度规则继续显式标为待验证。标准化 FM 复核通过后，还需单独制定并验证解码时间/边界处理，不能把这一轮结果写成整条训练输入链路已通过。\u003c/p\u003e\n\u003cp\u003e审阅稿为 \u003ccode\u003eruns/training_input_prepare/fm_normalization_v1/validate_fm_inputs.py.proposed\u003c/code\u003e，完整 diff 为 \u003ccode\u003eproposed_fm_normalization.patch\u003c/code\u003e，状态为 \u003ccode\u003epending_user_confirmation_of_core_diff\u003c/code\u003e。AST 与 \u003ccode\u003egit apply --check\u003c/code\u003e 通过；CPU 检查 13 份既有数组，标准化结果有限、帧数不变，与声码器候选公式一致，反变换误差最大约 9.54e-7，详见 \u003ccode\u003ecpu_normalization_checks.json\u003c/code\u003e。尚未修改 \u003ccode\u003escripts/validate_fm_inputs.py\u003c/code\u003e，未启动 GPU 或 FM 前向/反向，需按用户约定展示核心 diff 并讲解后确认。当前仅云端保存提案。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm_2\"\u003e2026-10-01 标准化 FM 输入复核执行完成\u003c/h3\u003e\n\u003cp\u003e用户回复“确认”批准标准化 FM 的具体 diff。审阅稿原样应用到 \u003ccode\u003escripts/validate_fm_inputs.py\u003c/code\u003e，SHA-256 \u003ccode\u003e5a65d86b39aff24699918f648f574ac98f08e944e73e6a0afdc038452a8e6c2a\u003c/code\u003e。沿用本实验独立环境 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e；执行前 GPU 4 为 1 MiB / 0% 空闲，磁盘剩余约 817 GiB，三份原音及 13 对双轨片段哈希复查通过。运行以 \u003ccode\u003e--mel-normalization zscore\u003c/code\u003e 开始与结束均已告知用户，退出码 0，结束后 GPU 4 为 1 MiB / 0%，已释放。\u003c/p\u003e\n\u003cp\u003eFM 的输入是保留的旋律 token、实验对齐网格上的标准化伴奏目标、有效帧掩码和原生随机扩散/提示条件。主损失衡量预测变化方向与目标方向的差异，反向传播检查参数能否获得梯度；本次没有优化器步骤，未更新参数，也没有执行 FM 生成或重新合成音频。先前声码器听验的音频继续有效。\u003c/p\u003e\n\u003cp\u003e13 对全长片段的前向、有效非 prompt 帧损失及反向全部通过；包含两个超过 30 秒的片段，没有裁短。13 个单样本损失为 0.155664–0.261474，14 个批次的梯度 L2 范数为 0.602593–3.090335，均有限且非零。原始尺度与标准化尺度的目标不同，不能将损失数值下降解释为微调进步或生成效果提升。\u003c/p\u003e\n\u003cp\u003e最短/最长片段组成的混合批次长度为 554 / 1,506 帧，短样本补齐 952 帧，前向与反向通过；补齐目标改为 100、token 改为 511 后，保持同一随机抽样，有效位置预测和损失的扰动不变性检查通过。结论限于本次抽样与批次，不代表原生随机 prompt 对任意变长批次都安全：公开实现按补齐后的 T 选择左右提示长度，该配方问题仍保留。\u003c/p\u003e\n\u003cp\u003e实际耗时 13.44 秒，PyTorch 峰值分配显存 8,407,889,408 字节（约 7.83 GiB），最大 CPU RSS 1,832,868 KiB（约 1.75 GiB）。输出位于 \u003ccode\u003eruns/anyaccomp_fm_zscore_smoke_20261001/results/\u003c/code\u003e，每对保存 \u003ccode\u003etokens\u003c/code\u003e、\u003ccode\u003etarget_raw_logmel\u003c/code\u003e 和实际输入 \u003ccode\u003etarget_mel\u003c/code\u003e；与 raw 基线逐数组比较，旋律 token 和原始对齐 mel 均完全一致，标准化变换验证通过，帧数与全长合同不变。四份 CSV 清单、三份原始录音、13 对片段、先前特征及相关基线报告保持不变，源文件及 FM 预训练权重哈希亦复核通过。\u003c/p\u003e\n\u003cp\u003e运行与复核证据：\u003ccode\u003eexecution.json\u003c/code\u003e、\u003ccode\u003efm_smoke.log\u003c/code\u003e、\u003ccode\u003eresources.txt\u003c/code\u003e、\u003ccode\u003eresults/report.json\u003c/code\u003e、\u003ccode\u003epost_validation.json\u003c/code\u003e。审核状态见 \u003ccode\u003eruns/training_input_prepare/fm_normalization_v1/review_status.json\u003c/code\u003e，已标记标准化 FM 运行及后核验通过。状态为 \u003ccode\u003epassed_under_experimental_adapter\u003c/code\u003e；配对清单仍保留 \u003ccode\u003epending_compatibility_check\u003c/code\u003e，完整训练输入配方为 \u003ccode\u003epending_recipe_validation\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e下一步需提出并核验声码器解码的时间起点和边界长度处理，解释对齐网格与合成中心相差 240 个采样点（10 ms）时如何保留头尾，展示核心 diff 后确认再实施。此轮没有自动移位、裁切或补齐输出声音。完整训练加载器缺失、三个额外 tag 张量、REPA/MERT 未实现、CFG 配方差异等限制继续保留；不得宣称整条训练链路或作者训练配方已经通过。云端记录更新完成，Windows 本地同步仍待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_3\"\u003e2026-10-01 声码器时间与边界适配提案（具体核心代码待确认）\u003c/h3\u003e\n\u003cp\u003e用户要求“下一步”。本轮只读复核 Vocos 的 ISTFT 与已通过的 z-score FM/声码器报告，准备新的实验审阅稿；没有修改现有执行脚本或公开源码，没有运行 GPU、神经声码器或训练。\u003c/p\u003e\n\u003cp\u003e时间问题定位在公开 ISTFT 的最终裁剪约定：1920 点窗、480 hop 的 \u003ccode\u003epadding=same\u003c/code\u003e 对未裁剪 overlap-add（将各窗口波形重叠相加的合成结果）左右各裁 720 点，因此第 0 帧中心在输出第 240 点（10 ms）。实验目标与旋律 token 的第 0 帧中心是 0；对应的合成结果应从完整 overlap-add 第 960 点开始，取参考 24 kHz 音频的 N 个采样点。这个 240 点差来自明确的窗口约定，不按相关峰逐段选择移位。\u003c/p\u003e\n\u003cp\u003e不直接在已保存的原生 WAV 上删去 240 点后补零：13 个实际长度中有 4 个会出现尾部采样缺口，分别为 R0001_SEG0004 的 161 点、R0002_SEG0004 的 1 点、R0003_SEG0003 的 1 点和 R0003_SEG0004 的 118 点。完整 overlap-add 的长度为 \u003ccode\u003e(T-1)*480+1920\u003c/code\u003e，这些参考长度均可在 \u003ccode\u003e[960:960+N]\u003c/code\u003e 范围内覆盖，无需新增 mel 帧或插入波形零值。该覆盖结论来自数学范围检查，不等于真实模型已经重建出正确的末尾乐器。\u003c/p\u003e\n\u003cp\u003e拟新增独立的 \u003ccode\u003escripts/validate_vocoder_timing.py\u003c/code\u003e。每个短/中/长片段只调用一次原生声码器，临时的 forward pre-hook（只读取模块输入的回调）捕获 817 GiB。任务沿用独立环境 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e，开始/结束均已通知用户，退出码 0，实际耗时 12.01 秒，PyTorch 峰值分配显存约 1.046 GiB，最大 CPU RSS 约 1.516 GiB。结束后 GPU 4 为 1 MiB / 0%，已释放。\u003c/p\u003e\n\u003cp\u003e三段各调用一次原生声码器，捕获预测的复数频谱，按公开定义重建完整窗口叠加结果及窗口平方和；保留 \u003ccode\u003e[720:720+T*480]\u003c/code\u003e 原生输出，并输出 \u003ccode\u003e[960:960+N]\u003c/code\u003e 起点修正版。N 为参考 24 kHz 音频采样数；模型参数、标准化频谱目标和旋律 token 均未修改。没有 FM 调用或参数更新。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e样本\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003e参考/修正后采样数\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003e原生 → 修正包络估计滞后（ms）\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003e从原生裁剪范围外取回的尾部采样\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0003_SEP01_SEG0004\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e265798 / 265798\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e9 → -1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e118\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0001_SEP02_SEG0001\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e508801 / 508801\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e10 → 0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eR0002_SEP01_SEG0005\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e722572 / 722572\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e10 → 0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e包络估计分辨率为 1 ms；修正后三段约为 −1/0/0 ms，包络相关约 0.968–0.979。三份修正版长度均与参考完全一致，幅度绝对值超过 1 的采样数量均为 0，与参考的 RMS 差约 −0.23/−0.27/−0.49 dB。数学起点修正固定为 240 点，没有按每段相关峰调参。波形相关仍较弱，不能据此宣称每个乐器的采样级精确对齐。\u003c/p\u003e\n\u003cp\u003e原生神经输出与上一轮 z-score 基线逐样本一致；完整窗口合成的原生裁剪与原生 ISTFT 逐样本一致；修正版和原生输出在同物理时间的重叠区 1/results/R0002_SEP01_SEG0005/aligned_centered.mp3\"\u003eR0002_SEP01_SEG0005 起点与长度修正版（本地素材未同步）\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_5\"\u003e2026-10-01 声码器时间/边界适配听验通过\u003c/h3\u003e\n\u003cp\u003e用户对展示的短、中、长三份修正版明确反馈：“都自然完整，没有新增失真”。据此将三份修正版的头尾完整性、自然程度及新增失真听验记录为通过；与已通过的长度、同源频谱、重叠采样一致性和文件完整性检查共同构成本轮解码适配验收。证据见 \u003ccode\u003eruns/anyaccomp_vocoder_timing_20261001/acceptance.json\u003c/code\u003e；后核验和审核状态已更新为听验通过，\u003ccode\u003eresults/report.json\u003c/code\u003e 保留执行时的诊断快照，后续验收以 \u003ccode\u003eacceptance.json\u003c/code\u003e 为准。\u003c/p\u003e\n\u003cp\u003e已验证的实验输入规则为：24 kHz 单声道音频，冻结 chroma/VQ 旋律条件，目标 mel 与 token 使用 0+k*480 帧中心，目标按配置均值 −4.92、方差 8.14 做 z-score 标准化；解码使用同一预测复数频谱的完整窗口合成结果，从 960 点开始取参考长度。该规则有 13 对 FM 主损失/反向和一次混合补齐抽样检查、三段声码器技术核验及用户听验、19 个 CPU 数学案例支持，范围不扩展为作者完整配方复现或全部 13 段神经解码都已听验。\u003c/p\u003e\n\u003cp\u003e下一步汇总训练输入规范与剩余问题，先核查并提出变长批次随机 prompt 的逐条有效长度处理方案。prompt 是提供给模型的已知伴奏区域；其选择须遵守每个样本的真实长度并为训练目标保留有效位置，当前公开实现以补齐后 T 取样，单次混合测试通过不能覆盖任意抽样。CFG 是随机丢条件的训练/推理引导机制；本地配置与论文的概率差异需要明确实验选择。REPA/MERT 是音乐表征辅助损失，现有主损失冒烟未实现该链路，须与完整作者配方分开记录。公开完整训练加载器缺失和额外 tag 张量的限制继续保留。任何新增或修改实验代码仍先展示核心 diff、讲解并等待确认。\u003c/p\u003e\n\u003cp\u003e本轮仅记录听验并更新云端进度，没有新增 GPU 任务、模型参数更新、批量下载或正式训练。CSV 清单保持不变，训练兼容性整体仍待配方收口；Windows 同步待进行。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm_3\"\u003e2026-10-01 变长 FM 随机提示适配提案（具体核心代码待确认）\u003c/h3\u003e\n\u003cp\u003e用户在前轮文档同步确认后要求“下一步”。本轮只读核对公开 \u003ccode\u003eanyaccomp/fmt_model.py\u003c/code\u003e、条件模型、当前主损失核验及配置，准备实验目录内的独立适配模块与新核验脚本，尚未落地到 \u003ccode\u003escripts/\u003c/code\u003e 或启动 GPU。\u003c/p\u003e\n\u003cp\u003eprompt（提示区域）是训练时直接提供给模型的真实伴奏频谱区域，模型学习生成剩余位置。公开实现以补齐后最大 T 选择提示总长度，并用 T 定位右侧提示；同批短样本的右提示可能全部在补齐区，左提示可能遮住其所有有效位置。以有效长度 554/1,506 为例，原始规则允许 600 帧左提示，使短样本的损失帧为零；100 帧右提示位于 1,406–1,505，短样本看不到任何有效右提示。前轮单次混合抽样通过不能排除此类情况。配置 \u003ccode\u003eprompt_prob=0\u003c/code\u003e 不被该原生分支读取，实际仍以每批共享的约 30% 概率启用提示。\u003c/p\u003e\n\u003cp\u003e拟新增 \u003ccode\u003escripts/fm_length_aware_prompt.py\u003c/code\u003e，继承同一公开 FM 模型且不新增学习参数；按有效长度 L 选提示总长，左右提示只位于该段有效前缀的两端，满足 \u003ccode\u003eleft+right \u0026lt; L\u003c/code\u003e，至少保留一帧损失。正常长度沿用约 40% 的提示长度上界，短到原生 randint 区间失效的案例显式安全处理。损失掩码为有效位置减去提示位置，估计器输入的补齐位置显式归零。保留公开时间采样/调度、噪声插值、旋律条件投影、估计器和返回接口；默认提示出现概率显式设为 0.3，沿用原生每批共享启用门；\u003ccode\u003e--prompt-probability 0\u003c/code\u003e 在本实验中明确禁用提示。CFG 仍为当前配置 0.2（随机关闭旋律条件的训练机制），不在本轮处理与论文概率不同的问题。原项目源文件和预训练权重只读使用。\u003c/p\u003e\n\u003cp\u003e拟新增 \u003ccode\u003escripts/validate_fm_prompts.py\u003c/code\u003e，直接读取上一轮已核验且未修改的 z-score \u003ccode\u003etarget_mel\u003c/code\u003e 和旋律 token，不重新提取特征。13 对全长单样本真实前向/反向，加最短/最长混合批次的七种检查：无提示、仅左、仅右、左右都有提示、默认概率下三个随机种子，共 20 个损失/反向批次；七个混合批次另做相同随机抽样下的补齐目标/token 扰动前向，核查有效预测、损失和提示计划不被补齐内容影响。保存每批有效长度、左右提示长度、提示总长、实际损失帧数、损失和梯度。没有优化器步骤、参数更新、MERT/REPA 辅助损失或音频生成。\u003c/p\u003e\n\u003cp\u003e准备检查通过：两个文件的 AST；\u003ccode\u003egit apply --check\u003c/code\u003e；768 个 CPU 提示方案（每案 24 个长度，覆盖 1–100 的短长度及 13 对实际帧数、三种概率、四种位置模式、64 个种子），提示均在有效区，保留损失帧，增加 71 帧补齐不改变提示计划；四个无效掩码/提示案例被拒绝。已知合成 CPU 张量的 FM 插值、提示保留和补齐归零公式通过，没有执行估计器前向/反向。meta 模型状态字典的 137 个参数/缓冲张量名字和形状与公开模型一致，未新增学习参数。CPU 结果不能替代真实预训练模型的 GPU 前向/反向与扰动验证。\u003c/p\u003e\n\u003cp\u003e提案目录 \u003ccode\u003eruns/training_input_prepare/fm_prompt_v1/\u003c/code\u003e 包含审阅稿、\u003ccode\u003eproposed_fm_prompt.patch\u003c/code\u003e、\u003ccode\u003ecpu_prompt_checks.json\u003c/code\u003e、\u003ccode\u003einspection.json\u003c/code\u003e 和 \u003ccode\u003ereview_status.json\u003c/code\u003e。适配稿 SHA-256 \u003ccode\u003e62baf9dc873aa91dc320ddbab0fd6f2b258baa0183f509e11871c9bcf37aa9f0\u003c/code\u003e，核验稿 SHA-256 \u003ccode\u003ecd7a03414fe760e0fef326b6d0ad09a0c625f160de14064f69c26d2637264963\u003c/code\u003e。状态为 \u003ccode\u003epending_user_confirmation_of_core_diff\u003c/code\u003e，两份新执行文件尚不存在。预计峰值分配显存约 8 GiB（同结构前轮实测 7.83 GiB），运行及检查几十秒至数分钟，执行前仍复查 GPU；输出使用新目录 \u003ccode\u003eruns/anyaccomp_fm_prompt_smoke_20261001/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e这些是本实验的提示/变长处理候选，不宣称作者原始训练规则。公开完整训练加载器缺失、额外 tag 张量、CFG 配方差异、REPA/MERT 未实现等限制继续保留，完整配方为 \u003ccode\u003epending_recipe_validation\u003c/code\u003e。用户此前明确要求实验代码先展示核心 diff 并讲解后确认，故本轮准备到具体可审阅产物后等待确认，不自动执行。\u003c/p\u003e\n\u003cp\u003e同步状态：用户提供的终端截图已确认前轮记录同步成功，云端与本地哈希均为 \u003ccode\u003eaca3cf454e5bb13cab6f4ad876558b304c4c6e8d60b28368805e6ecda39e63f2\u003c/code\u003e；同步登记见 \u003ccode\u003eruns/record_sync_20261001T070911Z/sync_confirmation.json\u003c/code\u003e。本节属于该同步之后的新云端变更，Windows 本地仍是上一次同步版本，后续阶段同步时需再次传输并核对。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01-fm_4\"\u003e2026-10-01 变长 FM 提示适配执行与后核验通过\u003c/h3\u003e\n\u003cp\u003e用户回复“确认”批准前节具体核心 diff。两个审阅稿原样落地为 \u003ccode\u003escripts/fm_length_aware_prompt.py\u003c/code\u003e（SHA-256 \u003ccode\u003e62baf9dc873aa91dc320ddbab0fd6f2b258baa0183f509e11871c9bcf37aa9f0\u003c/code\u003e）和 \u003ccode\u003escripts/validate_fm_prompts.py\u003c/code\u003e（SHA-256 \u003ccode\u003ecd7a03414fe760e0fef326b6d0ad09a0c625f160de14064f69c26d2637264963\u003c/code\u003e）。沿用独立环境 \u003ccode\u003eenvironments/anyaccomp_input_929\u003c/code\u003e 和同一预训练 FM，读取上一轮已有 z-score \u003ccode\u003etarget_mel\u003c/code\u003e 与旋律 token，没有重新提取或改写输入特征。适配类不新增学习参数，137 个公开模型所需张量加载一致；三个公开定义未包含的检查点 tag 张量继续显式排除。\u003c/p\u003e\n\u003cp\u003eFM 在本轮的作用是核查“已知旋律条件、部分真实伴奏提示、带噪目标 → 剩余位置的生成训练损失”能否在不同长度输入上计算并反向传播。按每段真实有效长度选择左右提示，损失只计算有效且未被提示的位置，补齐位置在估计器输入中归零。提示默认以每批共享的 0.3 概率启用；强制左/右/双侧与关闭提示仅用作压力核验。CFG 随机关闭旋律条件的概率继续使用本地配置 0.2，REPA/MERT 辅助损失未引入。本轮没有优化器、模型参数更新、音频生成或新增听验。\u003c/p\u003e\n\u003cp\u003e执行开始与结束均已通知用户；使用空闲 GPU 4（RTX 4090，UUID \u003ccode\u003eGPU-f37d634b-c2bd-b66f-44a2-6608ae61b06e\u003c/code\u003e），退出码 0。实际 GPU 核验进程耗时 10.07 秒，PyTorch 峰值分配显存 8,410,742,272 字节（约 7.83 GiB），最大 CPU RSS 1,694,340 KiB（约 1.62 GiB）；结束后 GPU 4 为 1 MiB / 0%，已释放。\u003c/p\u003e\n\u003cp\u003e13 个全长单样本与七个混合长度批次全部完成真实前向/反向。混合输入是最短 R0003_SEP01_SEG0004（554 帧）和最长 R0002_SEP01_SEG0005（1,506 帧），短样本补齐 952 帧。下表提示长度与损失帧数按“短 / 长”记录；随机模式同时覆盖提示启用与未启用分支。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e混合模式\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003e左提示帧\u003c/th\u003e\n\u003cth 003ctd style=\"text-align: right;\"\u003e415 / 1333\u003c/td\u003e\n\u003ctd\u003e通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e默认概率 0.3，seed 931，未启用\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0 / 0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0 / 0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e554 / 1506\u003c/td\u003e\n\u003ctd\u003e通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e所有样本的提示帧与损失帧构成有效长度的完整分区，没有提示落在补齐区，也没有有效位置全部被提示遮住；本轮实际最少保留 415 个损失帧。20 个批次损失均有限，范围约 0.14934–0.30834；梯度有限且非零，L2 范围约 0.16950–2.25612。七次补齐扰动在保持随机状态一致时，将补齐 mel 改为 100、补齐 token 改为 511，有效预测、损失和提示计划均通过一致性检查。损失数值仅作为接口诊断，不能据此评价微调提升或生成质量。\u003c/p\u003e\n\u003cp\u003e输出目录 \u003ccode\u003eruns/anyaccomp_fm_prompt_smoke_20261001/\u003c/code\u003e，包含 \u003ccode\u003eexecution.json\u003c/code\u003e、\u003ccode\u003efm_prompt.log\u003c/code\u003e、\u003ccode\u003eresources.txt\u003c/code\u003e、\u003ccode\u003eresults/report.json\u003c/code\u003e、\u003ccode\u003epost_validation.json\u003c/code\u003e。后核验复查批次数、提示分区、有效损失帧、补齐扰动、代码与审阅稿哈希、输入及源文件完整性，状态为 \u003ccode\u003epassed\u003c/code\u003e。原音、13 对片段、四份 CSV 清单、既有特征和报告、公开源文件、预训练权重及上一轮 \u003ccode\u003escripts/validate_fm_inputs.py\u003c/code\u003e 均保持不变。提案审核记录 \u003ccode\u003eruns/training_input_prepare/fm_prompt_v1/review_status.json\u003c/code\u003e 已更新为用户确认、执行及后核验通过。\u003c/p\u003e\n\u003cp\u003e此结果证明当前实验适配在已测输入和提示方案下可以安全计算 FM 主损失及梯度，与此前 CPU 提示检查共同支持逐条有效长度处理；不代表任意批次或完整作者训练配方已验证，也不代表分离伪影已经被清除。配对清单继续保持原兼容性状态，整体训练输入配方为 \u003ccode\u003epending_recipe_validation\u003c/code\u003e。未解决事项包括公开完整训练加载器缺失、三个额外 tag 张量、CFG 0.2 与论文 0.1 的差异、REPA/MERT 辅助损失未实现，以及实验时间网格、标准化与解码规则不能直接称为作者原始预处理。\u003c/p\u003e\n\u003cp\u003e下一步整理已通过的输入规范与小规模流程验收清单，明确 CFG 及 REPA/MERT 的实验取舍，再展示可审阅的训练入口方案与核心 diff。是否执行临时参数更新、保存与重载检查点，以及之后的生成对照/正式微调，均属于后续具体提案范围；本轮没有自动推进这些任务。仍需先解释代码并得到确认。云端记录已更新；Windows 本地仍为前轮同步快照，本轮新增记录尚未同步。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_6\"\u003e2026-10-01 小规模流程有限验收提案（待用户确认）\u003c/h3\u003e\n\u003cp\u003e用户问“下一步做什么”。按已经重申的 929 范围，下一步先完成当前三份录音的小规模验收，再确定规模化来源和数量/合格时长。本轮只核对已有报告和清单、整理输入规范及提案，没有修改实验代码、清单状态或启动 GPU、优化器更新、批量下载。以下是可审阅的有限验收范围，尚未替用户作整体通过判断。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e验收对象\u003c/strong\u003e：R0001–R0003 经用户接受的三份 Demucs 双轨及 13 对结构片段；总长 282.228684807 秒（约 4 分 42 秒）。最长片段约 30.107 秒，R0002_SEG0005 和 R0003_SEG0003 两段超过 30 秒，保留全长并纳入已有特征/FM 核验。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e固定验收项\u003c/th\u003e\n\u003cth\u003e已有证据\u003c/th\u003e\n\u003cth\u003e建议如何记录\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e原音与分离版本可追溯\u003c/td\u003e\n\u003ctd\u003e三份原音下载/哈希/解码；模型提交、权重、参数与日志登记；三份 Demucs 双轨听验通过\u003c/td\u003e\n\u003ctd\u003e通过本次流程门槛；保留人声伪影及无独立干净轨的限制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e结构分段与配对覆盖\u003c/td\u003e\n\u003ctd\u003e13 个共同边界经用户确认；片段重拼与各完整分离轨逐样本一致\u003c/td\u003e\n\u003ctd\u003e同源裁切和完整覆盖通过；不宣称独立真值下的细部对齐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e旋律/伴奏特征接口\u003c/td\u003e\n\u003ctd\u003e全部 13 对冻结 Chroma/VQ 提取与范围检查；全长 token 与实验目标时间网格/尺度核验\u003c/td\u003e\n\u003ctd\u003e按已验证的实验输入规则接受；不称为作者原始预处理\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFM 主损失与变长输入\u003c/td\u003e\n\u003ctd\u003e13 个单样本、七个混合提示批次前向/反向；七次补齐扰动通过\u003c/td\u003e\n\u003ctd\u003e主损失、梯度、真实长度/提示/损失掩码接口通过；不扩展为完整训练器通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e频谱到声音的转换\u003c/td\u003e\n\u003ctd\u003e三段声码器技术核验及用户“自然完整、没有新增失真”的听验；19 个 CPU 数学案例\u003c/td\u003e\n\u003ctd\u003e接受本实验解码起点/长度规则在已测范围内的证据；不声称全部片段解码已听验\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e输入规范与限制交付\u003c/td\u003e\n\u003ctd\u003e本提案及模型与技术说明，相关报告路径见下\u003c/td\u003e\n\u003ctd\u003e待用户确认有限验收范围；确认后登记整体结论和后续建集要求\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e建议固定的实验输入规则\u003c/strong\u003e：分离沿用已比较的 Demucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e；保持原音、完整双轨及共同边界的配对 WAV；处理输入转为 24 kHz 单声道。旋律条件使用冻结的 24 通道 Chroma/VQ、每秒约 50 帧、512 条目码本；伴奏目标使用 128 通道 Mel、hop 480、帧中心 \u003ccode\u003e0+k*480\u003c/code\u003e，按均值 −4.92、方差 8.14 做 z-score。变长批次使用真实有效长度掩码及已确认的逐条提示适配，提示概率 0.3；解码从完整合成结果第 960 点取参考长度，不补波形零值。这些是已核验的实验规则，不新增算法。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCFG 的有限取舍\u003c/strong\u003e：CFG 的训练条件丢弃机制让 FM 同时学习“看旋律”和“不看旋律”的预测。建议保留已核验代码中的丢条件概率 0.2，不在 929 为调整成论文的 0.1 再跑一轮主损失核验；该值不是推理时的引导强度，差异写入限制。正式微调采用何值另行设计。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eREPA/MERT 的有限取舍\u003c/strong\u003e：MERT 是提取音乐特征的教师模型，REPA 是约束 FM 中间特征接近教师表征的辅助损失。当前没有这项计算，建议本次验收明确仅覆盖 FM 主损失输入，不新增 MERT 下载或 REPA 实现，不把未实现写成通过。完整论文配方不是本次数据实验的默认门槛。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e训练入口的声明范围\u003c/strong\u003e：当前有真实预训练模型的前向、主损失和反向证据，但没有优化器步骤、参数更新或训练恢复测试；三个检查点 tag 张量不在公开模型定义中，已明确排除。本次建议以“实验 FM 主损失输入接口已核验”作为可复用范围，完整作者训练器及精确配方保持未验证。无需为了消除这些限制自动追加临时更新；如后续所选实际训练入口提出新的数据接口要求，先说明具体缺口与有限检查，再按代码确认规则处理。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e确认后的固定下一步\u003c/strong\u003e：登记有限验收结论并对应更新清单，不覆盖历史执行报告；提出规模化来源清单与可计量的建集目标（录音数量或最终合格配对时长），以及资源预算和质量门槛。达到约定规模、完成配对/输入核验、按原录音或演出分组划分及数据交付后，结束 929。若候选来源明显更长或录音条件不同，只按实际差异提出必要的代表样本检查，不重新比较所有模型或不断追加技术研究。\u003c/p\u003e\n\u003cp\u003e证据：\u003ca href=\"report-1f253104ba23.html\"\u003e分段覆盖报告\u003c/a\u003e、\u003ca href=\"report-e3e4920b0859.html\"\u003e特征报告\u003c/a\u003e、\u003ca href=\"report-105333cff344.html\"\u003ez-score FM 报告\u003c/a\u003e、\u003ca href=\"post_validation-f02c7a8be6b7.html\"\u003e提示/补齐后核验\u003c/a\u003e、\u003ca href=\"acceptance-0560a658edc2.html\"\u003e声码器听验记录\u003c/a\u003e。早期报告中的待办状态保留为执行时快照，后续验收须按较新阶段证据解释。\u003c/p\u003e\n\u003cp\u003e当前整体训练输入状态仍未升级，四份 CSV 清单不变；这是提案，不是整体验收完成记录。云端文档已更新，本地仍待同步。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_7\"\u003e2026-10-01 用户确认小规模有限验收，准备本地记录同步\u003c/h3\u003e\n\u003cp\u003e用户答复“可以的”，确认前节具体有限验收范围，并询问是否有音频或文件需下载到本地；随后要求提供提示词，由本地 Codex 对话执行同步。已登记三份录音、13 对片段的有限流程验收，通过范围是当前实验 FM 主损失输入及已测声码器解码规则；CFG 条件丢弃概率保留 0.2，REPA/MERT 辅助损失不纳入本轮，完整作者配方与完整训练器保持未验证。\u003c/p\u003e\n\u003cp\u003e验收记录：\u003ccode\u003eruns/small_scale_acceptance_20261001T085524Z/acceptance.json\u003c/code\u003e。登记前再次核对三份原音和 26 份配对 WAV 哈希，全都与清单一致。\u003ccode\u003epairs.csv\u003c/code\u003e 的 13 条 \u003ccode\u003etraining_input_status\u003c/code\u003e 从 \u003ccode\u003epending_compatibility_check\u003c/code\u003e 改为 \u003ccode\u003epassed_experimental_fm_main_loss_interface\u003c/code\u003e；其余列和数据划分不变。变更前清单备份为同目录 \u003ccode\u003epairs.before_acceptance.csv\u003c/code\u003e，验收 JSON 记录前后哈希与证据哈希。其他三份 CSV、音频、源代码和权重未修改；历史报告及提案段落保留原时点状态，最新结论以本节和验收 JSON 为准。\u003c/p\u003e\n\u003cp\u003e现有音频已经完成本轮所需听验，没有新试听待办，不要求再次下载。为本地回看和交接，准备同步两份说明/进度文档、README、四份 CSV 清单、验收记录及关键小型 JSON 报告；不包含音频、权重、运行环境或大型 NPZ。云端准备不可变同步包和逐文件 SHA-256 清单，本地 Codex 经 \u003ccode\u003elab-4090\u003c/code\u003e 下载到临时目录，校验后备份不同的旧版再写入项目路径，并生成本地同步回执。\u003c/p\u003e\n\u003cp\u003e本轮没有 GPU 任务、参数更新或规模化下载，929 尚未完成，下一步是明确规模化来源及可计量目标。同步包准备完成不等于本地已更新；本地下载与哈希核验成功后才登记同步完成。\u003c/p\u003e\n\u003ch3 id=\"2026-10-01_8\"\u003e2026-10-01 规模化首批来源只读核查与具体提案（待确认）\u003c/h3\u003e\n\u003cp\u003e用户问“下一步做什么”。已完成小规模有限验收，进入规模化来源与可计量目标规划。本轮核对基金会示范音档目录、九份详情页和现有录音清单，目录列出九项，其中三项已收录，另外六项为新候选。新候选 C004–C009：古早七字仔、都馬調、西樂都馬、崁仔腳調、臺東調（平埔調）、思想起（恆春調）。\u003c/p\u003e\n\u003cp\u003e六项 HTTP Range 文件头读取均返回 206，每份最多 65,536 字节，没有保存完整音频或执行 GPU。RIFF 文件头声明 48 kHz、双声道、24-bit PCM，新增录音合计约 8 分 21 秒，预计下载约 138 MiB；连同现有三份，目录全部九项合计约 13 分 03 秒。这是原始录音的元数据线索，不是合格配对时长，完整下载、哈希、解码与听验尚未进行。演唱署名中的角色与演员信息完整保存，候选状态不等于正式收录。\u003c/p\u003e\n\u003cp\u003e具体首批方案：\u003ca href=\"first_batch_proposal-8f4e785e90cc.html\"\u003e首批来源与资源提案\u003c/a\u003e，元数据见同目录 \u003ccode\u003esource_inventory.json\u003c/code\u003e，候选清单见 \u003ccode\u003esource_candidates.csv\u003c/code\u003e。建议确认首批六项后，完整下载并核验，先对最长 C005 都馬調做同参数完整分离并听验，通过后处理其余五项，然后逐份结构分段、配对与输入核验。本批保留原音/完整双轨/片段预计预留 2 GiB，GPU 分离沿用既有预算并记录实测；没有为提案修改实验代码。\u003c/p\u003e\n\u003cp\u003e最终规模仍待明确。六项候选只是首批，不将约 13 分钟自动作为整个 929 的结束目标；如需要小时级合格数据，必须补充来源。已向用户询问最终合格配对时长或先审阅首批方案的偏好。来源与目标明确前不直接批量执行；不重启完整作者配方研究或正式训练。\u003c/p\u003e\n\u003cp\u003e本地同步状态未改变。前轮 \u003ccode\u003erecord_handoff_20
