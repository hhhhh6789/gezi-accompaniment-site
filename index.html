003c/dt\u003e\u003cdd\u003einternal_finetune_experiment\u003c/dd\u003e\u003cdt\u003e重复来源（duplicate_of）\u003c/dt\u003e\u003cdd\u003e（空值）\u003c/dd\u003e\u003cdt\u003e听验状态（review_status）\u003c/dt\u003e\u003cdd\u003epending_listening\u003c/dd\u003e\u003c/dl\u003e\u003c/details\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e三份原音均为 48 kHz、双声道、24-bit PCM WAV，完整文件保留。R0001 比较公开 MDX23 候选与 Demucs 后，用户认为 Demucs 更好，后两份沿用相同分离方案。公开 MDX23 候选的仓库、提交、权重和配置已留存，但未证明它是 SingNet 的精确版本。\u003c/p\u003e\n\u003cp\u003e用户确认三份 Demucs 双轨符合本轮听验门槛。人声仍有分离伪影，但唱腔主体完整；保留这一限制，不将听验通过解释为获得了完全干净的独立轨。\u003c/p\u003e\n\u003ch3 id=\"validation-segmentation\"\u003e3.2 结构分段与配对完整性通过\u003cspan id=\"stage-alignment\"\u003e\u003c/span\u003e\u003cspan id=\"stage-segmentation\"\u003e\u003c/span\u003e\u003cspan id=\"stage-pairs\"\u003e\u003c/span\u003e\u003c/h3\u003e\n\u003cp\u003e13 个片段的共同边界均经用户确认，保留片头伴奏、过门和尾奏。每对来自同一次分离、同一采样边界；各录音的片段重新拼接后与完整分离轨逐样本一致，说明分段没有遗漏内容。\u003c/p\u003e\n\u003cp\u003e两段超过 30 秒的片段完整保留，没有按固定时长截断。同源裁切和完整覆盖已验证，但缺少独立干净双轨，不能宣称所有分离细节都达到真值意义上的精确对齐。\u003c/p\u003e\n\u003ch3 id=\"validation-input\"\u003e3.3 训练输入与频谱解码的有限验收通过\u003cspan id=\"stage-input-check\"\u003e\u003c/span\u003e\u003cspan id=\"stage-pilot-review\"\u003e\u003c/span\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e旋律与目标特征\u003c/strong\u003e：13 对片段完成冻结 Chroma/VQ 特征核验，以及实验伴奏目标的尺度、时间网格和全长检查。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFM 主损失接口\u003c/strong\u003e：13 个全长单样本、7 个混合长度批次的前向与反向检查通过；损失和梯度有限，梯度非零。前向是计算预测，反向是计算参数变化方向，本轮没有真正更新参数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e变长提示与补齐\u003c/strong\u003e：按每段真实长度选取已知伴奏提示，保留学习位置；7 次补齐内容扰动检查通过，有效预测和损失不受补齐内容影响。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e声码器解码\u003c/strong\u003e：短、中、长三段完成频谱到声音的转换及时间/长度核验，用户反馈“都自然完整，没有新增失真”；19 个 CPU 窗口/长度数学案例也通过。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这证明已测数据可以进入当前实验的 FM 主损失接口，且三段参考伴奏频谱可以按实验规则重建成声音。声码器重建使用真实伴奏目标频谱，不是 FM 生成的新伴奏，不作为微调效果证据。\u003c/p\u003e\n\u003ch2 id=\"models\"\u003e4. 本次采用的模型与输入规则\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e部件或机制\u003c/th\u003e\n\u003cth\u003e具体作用\u003c/th\u003e\n\u003cth\u003e本次采用方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eDemucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e将完整录音拆成人声和伴奏，准备配对材料\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e沿用已比较并听验的模型、权重和参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eChroma + 冻结 VQ\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e将人声中的音级信息转换为旋律编号，减少直接传入音色与分离细节\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e24 通道 Chroma、约每秒 50 帧、512 条目码本；不更新 VQ 参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eMel 伴奏目标\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e将伴奏波形转换为 FM 学习的频谱矩阵\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e24 kHz 单声道输入、128 通道 Mel；按均值 −4.92、方差 8.14 做 z-score 标准化\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003e时间网格与解码\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e让旋律和目标帧对应同一时间中心，并保持输出头尾长度\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e使用已核验的共同帧中心及解码起点/长度适配，保留参考长度，不补波形零值\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eFM（流匹配生成模型）\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e学习如何根据旋律条件，从噪声逐步生成伴奏频谱\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e本轮核验主损失和梯度，没有优化器更新\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003ePrompt（伴奏提示）\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e给模型部分真实伴奏，让它学习剩余位置\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e按真实有效长度选左右提示，默认启用概率 0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eCFG（条件丢弃与生成引导机制）\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e训练时让模型学习有旋律/无旋律两种预测\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e本轮保留训练条件丢弃概率 0.2；它不是生成时的引导强度\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eVocos（声码器）\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e将伴奏频谱转换为可播放波形\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e使用已有权重；已完成三段重建与用户听验\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd data-label=\"部件或机制\"\u003eREPA/MERT\u003c/td\u003e\n\u003ctd data-label=\"具体作用\"\u003e用预训练音乐特征约束 FM 中间表示的辅助训练链路\u003c/td\u003e\n\u003ctd data-label=\"本次采用方式\"\u003e本轮未实现辅助损失，用户已接受将其列为限制，不追加实现任务\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这些输入规则已按有限范围验收，是本实验的处理合同，不宣称作者完整预处理已精确复现。模型职责、输入输出与必要限制详见\u003ca href=\"files/929%E9%A1%B9%E7%9B%AE%E6%A8%A1%E5%9E%8B%E4%B8%8E%E6%8A%80%E6%9C%AF%E8%AF%B4%E6%98%8E-528d3187045a.html\"\u003e项目模型与技术说明\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e配对清单的 13 条训练输入状态已登记为 \u003ccode\u003epassed_experimental_fm_main_loss_interface\u003c/code\u003e，含义是“实验 FM 主损失输入接口通过”，不是完整训练器通过。原音、完整双轨、旧运行产物和模型权重保持保留；实验使用独立环境，不复用 Qwen 环境。Qwen2-Audio 的早期听音试验不作为当前训练标注依据。\u003c/p\u003e\n\u003ch2 id=\"scale\"\u003e5. 规模化建集：首批候选与计划\u003cspan id=\"stage-scale-up\"\u003e\u003c/span\u003e\u003cspan id=\"next-step\"\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e目前核查的\u003ca href=\"https://twoperapf.org.tw/resource/category/demo-audio\" target=\"_blank\" rel=\"noopener\"\u003e基金会示范音档目录\u003c/a\u003e列出 9 项，已有 3 项，新增 6 个候选如下。以下时长来自文件头声明，还未通过完整下载、哈希、解码或听验。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e候选\u003c/th\u003e\n\u003cth\u003e内容与来源\u003c/th\u003e\n\u003cth\u003e文件头时长\u003c/th\u003e\n\u003cth\u003e当前状态\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr id=\"candidate-c004\"\u003e\n\u003ctd data-label=\"候选\"\u003eC004\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/20\" target=\"_blank\" rel=\"noopener\"\u003e古早七字仔\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e1:06.90\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr id=\"candidate-c005\"\u003e\n\u003ctd data-label=\"候选\"\u003eC005\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/22\" target=\"_blank\" rel=\"noopener\"\u003e都馬調\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e2:44.99\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr id=\"candidate-c006\"\u003e\n\u003ctd data-label=\"候选\"\u003eC006\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/23\" target=\"_blank\" rel=\"noopener\"\u003e西樂都馬\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e1:14.44\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr id=\"candidate-c007\"\u003e\n\u003ctd data-label=\"候选\"\u003eC007\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/26\" target=\"_blank\" rel=\"noopener\"\u003e崁仔腳調\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e0:51.39\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr id=\"candidate-c008\"\u003e\n\u003ctd data-label=\"候选\"\u003eC008\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/27\" target=\"_blank\" rel=\"noopener\"\u003e臺東調（平埔調）\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e1:14.05\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr id=\"candidate-c009\"\u003e\n\u003ctd data-label=\"候选\"\u003eC009\u003c/td\u003e\n\u003ctd data-label=\"内容与来源\"\u003e\u003ca href=\"https://twoperapf.org.tw/resource/demo-audio/28\" target=\"_blank\" rel=\"noopener\"\u003e思想起（恆春調)\u003c/a\u003e\u003c/td\u003e\n\u003ctd data-label=\"文件头时长\"\u003e1:09.30\u003c/td\u003e\n\u003ctd data-label=\"当前状态\"\u003e页面及文件头已核查；未完整下载\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e新增候选合计约 \u003cstrong\u003e8 分 21 秒\u003c/strong\u003e，完整原音预计约 \u003cstrong\u003e138 MiB\u003c/strong\u003e；连同已有三份，该目录全部九项的录音总长约 \u003cstrong\u003e13 分 03 秒\u003c/strong\u003e。这些是原始录音时长，不是最终合格配对时长，也不足以承诺小时级数据目标。\u003c/p\u003e\n\u003cp\u003e首批方案建议按以下顺序推进：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e确认首批六项范围和最终建集数量或合格时长，明确可计量的结束目标。\u003c/li\u003e\n\u003cli\u003e完整下载并做去重、哈希、格式和全文件解码检查，再登记正式录音编号。\u003c/li\u003e\n\u003cli\u003e先分离最长的「都馬調」（约 2 分 45 秒）并听验；通过后处理其余五项。\u003c/li\u003e\n\u003cli\u003e逐份审核分离结果、确认结构边界、保存配对，再按已接受的输入规则核验。\u003c/li\u003e\n\u003cli\u003e汇总新增合格数量/时长、剔除原因和资源实测；如目标仍有缺口，补充明确来源。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e本批原音、完整双轨、配对片段和小型产物建议预留 \u003cstrong\u003e2 GiB\u003c/strong\u003e。分离使用已选 Demucs 和独立环境，GPU 开始前检查空闲卡与磁盘，开始/结束告知用户并保存日志。预算不等于实测；候选分段长度尚未确定，不把既有显存数值当作任意长段的保证。详细来源、署名与预算见\u003ca href=\"files/first_batch_proposal-8f4e785e90cc.html\"\u003e首批建集提案\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本节是待确认计划，尚未执行完整下载或 GPU 分离。最终建集规模仍待确定。\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"limits\"\u003e6. 已接受的限制与待验证范围\u003cspan id=\"rights\"\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e分离人声仍可能有伪影；Chroma/VQ 改变模型接收旋律信息的方式，不会直接修复已有 WAV，也不能消除伴奏目标中的缺陷。\u003c/li\u003e\n\u003cli\u003e没有独立干净双轨真值；共同边界、完整覆盖和特征中心检查不能替代所有细部对齐证明。\u003c/li\u003e\n\u003cli\u003e公开完整训练加载器缺失，源码与检查点存在已记录差异；当前只验证实验主损失接口，没有验证优化器更新、恢复训练或完整作者配方。\u003c/li\u003e\n\u003cli\u003eCFG 训练丢条件概率与论文不同，REPA/MERT 辅助损失未实现；用户已接受按本轮有限范围验收，不为消除这些差异自动追加研究。\u003c/li\u003e\n\u003cli\u003e声码器听验覆盖三段代表样本，不能写成全部 13 段神经解码或新生成伴奏均已验收。\u003c/li\u003e\n\u003cli\u003e来源与权利状态仍为待核实；当前按内部技术试验记录，不将文件标为已授权发表或共享。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e以上限制随数据交付保留。新来源出现具体质量或接口问题时，先说明实际缺口和有限检查方案；新增或修改实验代码仍先展示核心 diff、解释输入输出及逻辑，再等待确认。\u003c/p\u003e\n\u003ch2 id=\"delivery\"\u003e7. 数据交付与结   <script>(function(){

  function esc(value){return String(value==null?"":value).replace(/[&<>\"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function badgeClass(status){
    if(/通过|完成/.test(status) && !/未完成|待核实|未验证|待验证|有限|尚未/.test(status)) return "good";
    if(/进行中|正在|待核实|待确认|有限/.test(status)) return "warn";
    if(/未开始|待执行|尚未/.test(status)) return "future";
    return "info";
  }
  function evidenceLinks(items){
    return (items||[]).map(function(item){
      var url = esc(item.url);
      if(item.audio) return '<div class="audio-box"><div class="audio-label">'+esc(item.label)+'</div><audio controls preload="none" src="'+url+'"></audio></div>';
      return '<a class="evidence-link" href="'+url+'" target="_blank" rel="noopener">'+esc(item.label)+' ↗</a>';
    }).join("");
  }
  function milestoneCard(item){
    return '<article class="milestone-card"><div class="milestone-top"><span class="milestone-phase">'+esc(item.phase)+'</span><span class="badge '+badgeClass(item.status)+'">'+esc(item.status)+'</span></div><h3>'+esc(item.title)+'</h3><p>'+esc(item.summary)+'</p><div class="evidence-list">'+evidenceLinks(item.evidence)+'</div></article>';
  }
  function pageHead(kicker,title,description){
    return '<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></div><div class="head-date">进度源 '+esc(progress.updated_at)+'</div></div>';
  }
  function renderMilestones(section){
    var rows=data.milestones.filter(function(m){return !section || m.section===section;});
    if(!rows.length) return '<div class="empty-note">此区域尚无登记的项目证据。</div>';
    return '<div class="milestone-grid">'+rows.map(milestoneCard).join("")+'</div>';
  }
  function renderOverview(){
    var activeTitle=progress.stages.some(function(s){return s.kind==="active";})?current.name:"暂无阶段标为进行中";
    var nextTitle=current?current.name:"下一步待确认";
    var gate=progress.next_gate || "请在进度文档中补充下一步关口。";
    if(gate.length>150) gate=gate.slice(0,150)+"…";
    return '<section class="editorial-hero" aria-labelledby="editorial-title">'+
        '<figure class="editorial-photo editorial-photo-one"><img src="assets/gezi-color-closeup-user.png" alt="彩色戏曲演员侧面肖像" width="1280" height="853" loading="eager"></figure>'+
        '<figure class="editorial-photo editorial-photo-two"><img src="assets/gezi-archive-user.png" alt="黑白戏曲双人肖像" width="434" height="641" loading="eager"></figure>'+
        '<figure class="editorial-photo editorial-photo-three"><img src="assets/gezi-archive-stage-user.png" alt="黑白戏曲露天舞台与观众" width="853" height="1280" loading="eager"></figure>'+
        '<figure class="editorial-photo editorial-photo-four"><img src="assets/gezi-performance-user.png" alt="彩色戏曲舞台上两位演员" width="795" height="1135" loading="eager"></figure>'+
        '<div class="editorial-copy"><div class="editorial-kicker">GEZI OPERA / RESEARCH WORKSPACE</div><h1 id="editorial-title">歌仔戏<br>伴奏生成研究</h1><p>让戏曲的声音，继续生长。</p></div>'+
        '<div class="editorial-panel">'+window.GeziMusician.markup()+'<div class="editorial-panel-kicker">当前研究进度</div><h2>从一段唱腔，<br>走向可验证的伴奏。</h2><p>'+esc(progress.current_conclusion)+' '+progress.facts.recording_count+' 份完整录音、'+progress.facts.pair_count+' 对片段，共 '+esc(progress.facts.paired_seconds)+' 秒。下一步：'+esc(progress.next_gate)+'。</p><div class="editorial-actions"><button class="editorial-action-primary" data-goto="data">查看数据进度 ↗</button><button class="editorial-action-secondary" data-goto="documents">浏览项目资料</button></div></div>'+
        '<div class="editorial-scroll">向下探索 <span aria-hidden="true">↓</span></div>'+
      '</section>'+
      window.GeziOverview.render(data.overview_progress, esc, '<details class="editorial-credit"><summary>首屏照片说明</summary><p>四张照片由页面使用者提供，按原比例展示，未裁切或改色；原始出处与公开使用授权待核对。照片仅作视觉展示，不代表本项目的数据来源或实验结果。</p></details>');
  }
  function renderData(){
    return data.data_page_html;
  }
  function renderExperiments(){
    return window.GeziExperiments.render(data,esc);
  }
  function renderDocuments(){
    return window.GeziLibrary.render(data,esc);
  }
  function renderHistory(){
    return window.GeziHistory.render(data,esc);
  }
  var renderers={overview:renderOverview,data:renderData,experiments:renderExperiments,documents:renderDocuments,history:renderHistory};
  var currentPage=null, renderRevision=0;
  history.scrollRestoration="manual";
  function rememberPage(){
    if(!currentPage || window.GeziReaderPanel.isOpen()) return;
    var state=Object.assign({},history.state||{});
    state.geziDashboard={page:currentPage,y:window.scrollY,details:Array.from(main.querySelectorAll('details')).map(function(node){return node.open;})};
    history.replaceState(state,"",location.href);
  }
  function showPage(name,saved){
    name=window.GeziRoute.resolve(name);
    window.GeziReaderPanel.beforeNavigate();
    var ticket=++renderRevision;
    releaseArchive();
    releaseMusician();
    window.GeziRoute.apply(name);
    currentPage=name;
    main.innerHTML=renderers[name]();
    window.GeziFiles.rewrite(main,data.file_readers);
    window.GeziReaderPanel.prepareLinks(main);
    document.getElementById("crumb-current").textContent=pageNames[name];
    document.querySelectorAll(".nav-item").forEach(function(button){button.classList.toggle("active",button.dataset.page===name); if(button.dataset.page===name)button.setAttribute("aria-current","page");else button.removeAttribute("aria-current");});
    main.focus({preventScroll:true});
    if(saved && saved.details)main.querySelectorAll('details').forEach(function(node,i){node.open=!!saved.details[i];});
    window.scrollTo({top:saved?saved.y:0,behavior:"instant"});
    releaseMusician = window.GeziMusician.mount(main);
    releaseArchive = name==="history"?window.GeziHistory.mount(main):function(){};
    window.GeziRoute.reveal();
    if(saved)document.fonts.ready.then(function(){requestAnimationFrame(function(){requestAnimationFrame(function(){if(ticket===renderRevision&&!window.GeziReaderPanel.isOpen())window.scrollTo({top:saved.y,behavior:"instant"});});});});
  }
  function navigate(name){
    if(!renderers[name]) name="overview";
    window.GeziReaderPanel.beforeNavigate();
    rememberPage();
    if(name===currentPage){window.scrollTo({top:0,behavior:"instant"});rememberPage();return;}
    history.pushState({geziDashboard:{page:name,y:0}},"","#"+name);
    showPage(name);
  }
  document.querySelectorAll(".nav-item").forEach(function(button){button.addEventListener("click",function(){navigate(button.dataset.page);});});
  document.addEventListener("click",function(event){var jump=event.target.closest("[data-ft-scroll]");if(jump){window.GeziExperiments.scrollTo(jump.dataset.ftScroll);return;}var target=event.target.closest("[data-goto]");if(target)navigate(target.dataset.goto);});
  function restoreRoute(){
    var name=window.GeziRoute.resolve(window.location.hash.slice(1)||"overview");
    if(name===currentPage){window.GeziReaderPanel.beforeNavigate();return;}
    var saved=history.state&&history.state.geziDashboard;
    showPage(name,saved&&saved.page===name?saved:null);
  }
  window.addEventListener("popstate",restoreRoute);
  window.addEventListener("hashchange",restoreRoute);
  window.addEventListener("scroll",rememberPage,{passive:true});
  window.addEventListener("pagehide",rememberPage);
  window.addEventListener("pageshow",function(event){if(event.persisted){var saved=history.state&&history.state.geziDashboard;showPage(window.GeziRoute.resolve(location.hash.slice(1)),saved);}});
  var initial=history.state&&history.state.geziDashboard;
  var route=window.GeziRoute.resolve(window.location.hash.slice(1)||"overview");
  showPage(route,initial&&initial.page===route?initial:null);
  rememberPage();
})();
</script>
</body>
</html>
