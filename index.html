<!doctype html>
<html lang="zh-Hans">
<head>
<link rel="icon" type="image/svg+xml" href="assets/opera-musician-dark.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>歌仔戏伴奏生成研究 · 数据与微调工作台</title>
  <style>@font-face {
  font-family: "Gezi Editorial";
  src: url("assets/noto-serif-sc-heading.woff2") format("woff2");
  font-style: normal;
  font-weight: 900;
  font-display: swap;
}
:root {
  --ink: #292520;
  --muted: #716858;
  --line: #ddd2bc;
  --paper: #fbf7ee;
  --canvas: #f2ebdd;
  --navy: #293b59;
  --teal: #55796d;
  --teal-soft: #e8eee5;
  --info: #8b7046;
  --info-soft: #f1e7d0;
  --amber: #b28a46;
  --amber-soft: #f1e7d0;
  --green: #55796d;
  --green-soft: #e8eee5;
  --cinnabar: #a94336;
  --shadow: 0 10px 30px rgba(41, 37, 32, .07);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
}
.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 5;
  display: flex; flex-direction: column;
  width: 244px; padding: 24px 16px 18px;
  color: #fbf7ee; background: var(--navy);
}
.sidebar::after { position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: linear-gradient(transparent, #b28a4699 20%, #b28a4640 80%, transparent); content: ""; }
.brand { display: flex; align-items: center; gap: 12px; padding: 3px 9px 29px; }
.brand-mark {
  display: grid; place-items: center; flex: 0 0 auto;
  width: 39px; height: 39px; border-radius: 12px;
  color: #fbf7ee; font-size: 13px; font-weight: 800; letter-spacing: .04em;
  background: linear-gradient(140deg, #b28a46 0%, #a94336 48%, #293b59 49%, #293b59 100%);
  box-shadow: 0 7px 20px #101a1655;
}
.brand-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.brand-caption { margin-top: 2px; color: #c8d6ca; font-size: 9px; letter-spacing: .16em; }
.side-label { padding: 0 11px 9px; color: #b8aa8c; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
.side-nav { display: grid; gap: 5px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 12px; border: 0; border-radius: 9px;
  color: #ddd2bc; background: transparent; cursor: pointer;
  font: inherit; font-size: 14px; text-align: left; transition: .16s;
}
.nav-item:hover { color: #fbf7ee; background: #f2ebdd0d; }
.nav-item.active { color: #fbf7ee; background: #f2ebdd16; box-shadow: inset 3px 0 var(--cinnabar); outline: 1px solid #b28a4666; outline-offset: -1px; }
.nav-icon { width: 18px; color: #c8d6ca; font-size: 17px; text-align: center; }
.nav-item.active .nav-icon { color: #a9c0aa; }
.nav-count { margin-left: auto; padding: 1px 7px; border-radius: 20px; color: #e6e8dc; background: #f2ebdd1a; font-size: 11px; }
.sidebar-bottom { margin-top: auto; padding: 15px 10px 4px; border-top: 1px solid #f2ebdd16; }
.private-indicator { display: flex; align-items: center; gap: 8px; color: #e6e8dc; font-size: 12px; }
.private-dot, .local-badge span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6b8b78; box-shadow: 0 0 0 3px #6b8b7822; }
.sidebar-note { margin-top: 9px; color: #b8aa8c; font-size: 11px; line-height: 1.55; }
.workspace { display: flex; flex-direction: column; min-height: 100vh; margin-left: 244px; }
.topbar {
  position: sticky; top: 0; z-index: 4;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; padding: 0 36px; border-bottom: 1px solid var(--line);
  background: #fbf7eeed; backdrop-filter: blur(12px);
}
.crumb { display: flex; align-items: center; gap: 10px; color: #7f7563; font-size: 13px; }
.crumb strong { color: #292520; font-weight: 600; }
.crumb-sep { color: #ddd2bc; }
.topbar-meta { display: flex; align-items: center; gap: 17px; }
.local-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid #e2e9df; border-radius: 20px; color: #55796d; background: #f6f0e3; font-size: 11px; }
.local-badge span { width: 6px; height: 6px; box-shadow: none; }
.build-time { color: #7f7563; font-size: 11px; }
.main-content { flex: 1; width: min(1440px, 100%); margin: 0 auto; padding: 31px 36px 24px; outline: none; }
.footer { display: flex; justify-content: space-between; padding: 13px 36px 16px; border-top: 1px solid var(--line); color: #a09581; font-size: 11px; }
.footer span:last-child { text-align: right; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin: 0 0 22px; }
.eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; color: var(--teal); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
.eyebrow::before { width: 17px; height: 2px; background: var(--cinnabar); box-shadow: 5px 3px 0 -1px var(--amber); content: ""; }
.page-head h1 { margin: 0; color: var(--ink); font-size: 28px; line-height: 1.25; letter-spacing: -.025em; }
.page-head h1::after { display: block; width: 42px; height: 2px; margin-top: 8px; background: linear-gradient(90deg, var(--cinnabar) 0 68%, var(--amber) 68% 100%); content: ""; }
.page-head p { max-width: 790px; margin: 8px 0 0; color: #716858; font-size: 14px; }
.head-date { color: #7f7563; font-size: 11px; white-space: nowrap; }
.hero {
  position: relative; overflow: hidden; margin-bottom: 17px; padding: 29px 34px;
  border: 1px solid #b28a4680; border-radius: 8px 8px 18px 18px; color: #fbf7ee;
  background: linear-gradient(112deg, #293b59 0%, #354a68 72%, #3d536b 100%);
  box-shadow: 0 12px 26px #293b591d;
}
.hero::before { position: absolute; z-index: 0; inset: 8px; border: 1px solid #b28a4655; border-radius: 5px 5px 13px 13px; content: ""; pointer-events: none; }
.hero::after { position: absolute; top: 0; right: 0; width: 28%; height: 100%; border: 0; border-radius: 0; background: linear-gradient(90deg, transparent, #a9433618), repeating-linear-gradient(90deg, #a9433600 0 19px, #b28a4616 19px 21px); clip-path: polygon(24% 0,100% 0,100% 100%,0 100%); content: ""; pointer-events: none; }
.hero-kicker { position: relative; z-index: 1; color: #e5d3a8; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

.hero-tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
.hero-tag { padding: 4px 9px; border: 1px solid #b28a4670; border-radius: 4px 12px 4px 12px; color: #f2ebdd; background: #f2ebdd0d; font-size: 11px; }
.editorial-hero { position: relative; min-height: 1450px; overflow: hidden; color: #fff; background: #090909; }
.editorial-hero::before { position: absolute; inset: 0; content: ""; pointer-events: none; }
.editorial-photo { position: absolute; z-index: 1; margin: 0; }
.editorial-photo img { display: block; width: 100%; height: auto; }
.editorial-photo-one { top: 70px; right: 8%; width: min(28vw, 400px); }
.editorial-photo-two { top: 280px; left: 6%; width: min(15vw, 205px); }
.editorial-photo-three { top: 850px; right: 7%; width: min(20vw, 290px); }
.editorial-photo-four { top: 935px; left: 9%; width: min(17vw, 230px); }
.editorial-copy { position: absolute; z-index: 2; top: 425px; left: 0; width: 100%; padding: 0 25px; text-align: center; }
.editorial-kicker { color: #e1dfdc; font-size: 12px; font-weight: 600; letter-spacing: .23em; }
.editorial-copy h1 { margin: 14px 0 12px; color: #fff; font: 900 clamp(68px, 7.5vw, 118px)/1.25 "Gezi Editorial", "Noto Serif SC", "Songti SC", serif; letter-spacing: -.045em; text-shadow: 0 3px 25px #000a; }
.editorial-copy p { margin: 0; color: #e1dfdc; font-size: 17px; letter-spacing: .11em; }
.editorial-panel { position: absolute; z-index: 3; top: 820px; left: 50%; width: min(560px, calc(100% - 40px)); padding: 42px 46px 39px; transform: translateX(-50%); border: 2px solid #111; border-radius: 26px; color: #141414; background: #fff; text-align: center; box-shadow: none; }
.editorial-panel-mark { display: block; width: 80px; height: 80px; margin: 0 auto; }
.musician-video-wrap { position: relative; width: min(240px, 100%); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border-radius: 12px; background: #fff; }
.musician-video-wrap video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.musician-static-poster { position: absolute; inset: 0; display: none; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.musician-show-poster .musician-static-poster { display: block; }
@media (min-width: 1321px) {
  body.overview-page .editorial-hero { min-height: 1510px; }
}
.editorial-panel-kicker { margin-top: 17px; color: #545454; font-size: 11px; letter-spacing: .13em; }
.editorial-panel h2 { margin: 18px 0 16px; font: 600 clamp(33px, 3vw, 46px)/1.3 "Songti SC", "SimSun", serif; }
.editorial-panel p { max-width: 455px; margin: 0 auto; color: #595959; font-size: 13px; line-height: 1.75; }
.editorial-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 11px; margin-top: 25px; }
.editorial-actions button { padding: 10px 21px; border: 1px solid #111; border-radius: 100px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.editorial-action-primary { color: #fff; background: #111; }
.editorial-action-primary:hover { background: #424242; }
.editorial-action-secondary { color: #111; background: #fff; }
.editorial-action-secondary:hover { background: #f0f0f0; }
.editorial-actions button:focus-visible, .editorial-credit summary:focus-visible { outline: 3px solid #b2d78d; outline-offset: 3px; }
.editorial-scroll { position: absolute; bottom: 39px; left: 50%; transform: translateX(-50%); color: #eee; font-size: 12px; letter-spacing: .12em; white-space: nowrap; }
.editorial-scroll span { display: block; font-size: 22px; text-align: center; }
.overview-dashboard { max-width: 1290px; margin: 0 auto; padding: 75px 36px 48px; }
.overview-dashboard-head { margin-bottom: 29px; text-align: center; }
.overview-dashboard-head span { color: #706754; font-size: 11px; letter-spacing: .2em; }
.overview-dashboard-head h2 { margin: 5px 0; font: 600 38px/1.35 "Songti SC", "SimSun", serif; }
.overview-dashboard-head p { margin: 0; color: #706754; font-size: 13px; }
.editorial-credit { margin-top: 18px; color: #716858; font-size: 11px; }
.editorial-credit summary { width: fit-content; cursor: pointer; }
.editorial-credit p { margin: 6px 0 0; line-height: 1.6; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 17px; }
.stat-card, .panel, .milestone-card, .doc-card, .gate-card, .candidate-card, .phase-card { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--shadow); }
.stat-card { min-height: 91px; padding: 14px 16px; }
.stat-card:first-child { border-top: 2px solid var(--cinnabar); }
.stat-card:nth-child(3) { border-top: 2px solid var(--amber); }
.stat-label { color: #7f7563; font-size: 12px; }
.stat-value { margin-top: 3px; color: #292520; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.stat-value-long { font-size: 16px; line-height: 1.35; }
.stat-foot { margin-top: 1px; color: #a09581; font-size: 11px; }
.content-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(260px, .9fr); gap: 15px; margin-bottom: 16px; }
.panel { padding: 17px 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 13px; }
.panel-title { color: #292520; font-size: 15px; font-weight: 700; }
.panel-title::before { display: inline-block; width: 8px; height: 8px; margin: 0 9px 1px 0; border: 1px solid var(--amber); background: var(--cinnabar); content: ""; transform: rotate(45deg); }
.panel-subtitle { color: #7f7563; font-size: 11px; }
.text-link, .evidence-link { padding: 0; border: 0; color: #55796d; background: none; font: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
.text-link:hover, .evidence-link:hover { text-decoration: underline; }
.route-list { display: grid; gap: 0; }
.route-row { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 0 0 14px; }
.route-row:last-child { padding-bottom: 0; }
.route-row:not(:last-child)::before { position: absolute; top: 19px; bottom: -1px; left: 9px; width: 2px; background: linear-gradient(var(--amber) 0 45%, #ddd2bc 45% 100%); content: ""; }
.route-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 19px; height: 19px; border: 1px solid var(--amber); border-radius: 50% 50% 4px 4px; color: var(--info); background: #fbf7ee; font-size: 10px; }
.route-dot.done { border-color: var(--green); border-radius: 50%; outline: 1px solid var(--green); outline-offset: -4px; color: var(--green); background: var(--green-soft); }
.route-dot.active { border-color: var(--cinnabar); border-radius: 50% 50% 4px 4px; color: var(--cinnabar); background: #f4e3dd; box-shadow: 0 0 0 3px #f4e3dd; }
.route-name { color: #292520; font-size: 13px; font-weight: 650; }
.route-detail { margin-top: 2px; color: #7f7563; font-size: 11px; line-height: 1.45; }
.route-state { padding-top: 3px; color: #7f7563; font-size: 10px; white-space: nowrap; }
.route-state.done { color: var(--green); }
.route-state.active { color: var(--cinnabar); font-weight: 700; }
.gate-card { align-self: start; padding: 16px; border-left: 3px solid var(--cinnabar); background: linear-gradient(145deg, #fbf7ee, #f6f0e3); }
.gate-label { color: #8f3b32; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.gate-title { margin: 5px 0; color: #292520; font-size: 15px; font-weight: 700; }
.gate-title::before { display: inline-block; margin-right: 6px; padding: 0 4px; border-radius: 2px; color: #fbf7ee; background: var(--cinnabar); content: "关"; font-size: 10px; font-weight: 600; vertical-align: 1px; }
.gate-text { color: #716858; font-size: 12px; line-height: 1.65; }
.gate-source { margin-top: 11px; }
.milestone-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.milestone-card { padding: 15px 16px; }
.milestone-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.milestone-phase { color: #55796d; font-size: 11px; letter-spacing: .04em; }
.milestone-card h3 { margin: 7px 0 5px; color: #292520; font-size: 14px; line-height: 1.45; }
.milestone-card p { margin: 0; color: #716858; font-size: 12px; line-height: 1.6; }
.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 20px; font-size: 10px; line-height: 1.4; white-space: nowrap; }
.badge.good { color: var(--green); background: var(--green-soft); }
.badge.warn { color: var(--cinnabar); background: #f4e3dd; }
.badge.info { color: var(--info); background: var(--info-soft); }
.badge.future { color: var(--muted); background: #eee6d5; }
.evidence-list { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 10px; }
.evidence-link { font-size: 11px; line-height: 1.5; }
.section-block { margin: 19px 0; }
.phase-card { display: grid; grid-template-columns: minmax(155px, .75fr) minmax(160px, 1.15fr) minmax(0, 1.7fr); gap: 13px; align-items: start; padding: 13px 15px; }
.phase-name { color: #292520; font-size: 13px; font-weight: 700; }
.phase-status { color: #716858; font-size: 12px; line-height: 1.5; }
.phase-gate { color: #716858; font-size: 12px; line-height: 1.55; }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fbf7ee; }
.data-table { width: 100%; min-width: 820px; border-collapse: collapse; table-layout: fixed; }
.data-table th:first-child, .data-table td:first-child { width: 185px; }
.data-table th:nth-child(2), .data-table td:nth-child(2) { width: 350px; }
.data-table th, .data-table td { padding: 10px 12px; border-bottom: 1px solid #e7decd; text-align: left; vertical-align: top; }
.data-table th { color: #fbf7ee; background: #293b59; border-bottom: 2px solid var(--amber); font-size: 11px; font-weight: 650; white-space: nowrap; }
.data-table td { color: #716858; font-size: 12px; line-height: 1.55; }
.data-table tr:nth-child(even) td { background: #f7f2e7; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table td:first-child { color: #292520; font-weight: 650; }
.candidate-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
.candidate-card { padding: 13px 14px; }
.candidate-id { color: var(--cinnabar); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.candidate-card h3 { margin: 5px 0; color: #292520; font-size: 14px; }
.candidate-card p { margin: 0; color: #716858; font-size: 12px; line-height: 1.55; }
.rights-note { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; padding: 12px 14px; border: 1px solid #f1e7d0; border-radius: 10px; color: #8b7046; background: #f1e7d0; font-size: 12px; line-height: 1.6; }
.rights-icon { font-size: 15px; line-height: 1; }
.doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.doc-card { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; }
.doc-icon { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 32px; border-radius: 7px; color: #55796d; background: #eee6d5; font-size: 14px; }
.doc-card h3 { margin: 0 0 3px; color: #292520; font-size: 13px; }
.doc-card p { margin: 0; color: #7f7563; font-size: 11px; line-height: 1.5; }
.doc-meta { margin-top: 6px; color: #a09581; font-size: 10px; }
.audio-box { margin-top: 11px; padding-top: 9px; border-top: 1px solid #e7decd; }

.audio-label { color: #7f7563; font-size: 11px; }
.boundary { padding: 13px 15px; border: 1px solid #e7decd; border-radius: 10px; color: #716858; background: #f2ebdd; font-size: 12px; line-height: 1.65; }
.boundary strong { color: #716858; }
.empty-note { padding: 19px; border: 1px dashed #ddd2bc; border-radius: 10px; color: #7f7563; background: #fbf7ee; font-size: 12px; }
.goal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; margin-bottom: 17px; }
.goal-card { min-height: 190px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px; background: #fbf7ee; box-shadow: var(--shadow); }
.goal-label { color: var(--teal); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.goal-card h2 { margin: 10px 0 8px; color: #292520; font-size: 18px; line-height: 1.45; }
.goal-card p { margin: 0; color: #716858; font-size: 12px; line-height: 1.65; }
.goal-status { border-top: 3px solid var(--amber); }
.goal-status .text-link { margin-top: 15px; }
.prep-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-top: 15px; }
.prep-list > div { padding: 13px; border: 1px solid #e7decd; border-radius: 9px; background: #f6f0e3; }
.prep-list span { display: block; color: #55796d; font-size: 10px; font-weight: 700; }
.prep-list strong { display: block; margin-top: 4px; color: #292520; font-size: 13px; }
.prep-list p { margin: 4px 0 0; color: #7f7563; font-size: 11px; line-height: 1.55; }
.history-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 13px; min-width: 0; }
.history-card { position: relative; min-width: 0; padding: 19px 21px; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 5px 14px 5px 14px; background: #fbf7ee; box-shadow: var(--shadow); }

.history-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

.history-card h2 { margin: 8px 0 4px; color: #292520; font-size: 17px; line-height: 1.4; }

.history-primary { display: inline-flex; margin-top: 12px; padding: 7px 11px; border: 1px solid var(--cinnabar); border-radius: 4px 12px 4px 12px; color: #fbf7ee; background: var(--cinnabar); font-size: 12px; font-weight: 650; text-decoration: none; }

  <style>/* Complete V2 data layout; replaces the former light-page rules. */
body.data-page { background: #090909; color: #fff; --muted: #b5b5b0; --line: rgba(255,255,255,.22); }
body.data-page .main-content { max-width: none; padding: 180px 48px 60px; }
body.data-page .footer { background: #090909; color: #b5b5b0; border-color: var(--line); }
.vd-layout { width: min(1280px,100%); margin: auto; display: grid; grid-template-columns: minmax(0,.82fr) minmax(0,1.6fr); gap: 80px; align-items: start; }
.vd-layout .dp-intro { position: sticky; top: 38px; margin: 0; }
.dp-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; color: #b5b5b0; font-size: 12px; }
.dp-meta span:first-child { letter-spacing: .08em; }
.vd-layout .dp-intro h1 { font-size: 80px; line-height: 1.16; max-width: 2.2em; margin: 25px 0; }
.dp-intro>p { margin: 0 0 12px; font-size: 16px; line-height: 1.85; }
.dp-current { border-left: 2px solid #fff; padding: 5px 0 5px 15px; margin: 24px 0; }
.dp-current strong { display: block; font-size: 16px; font-weight: 400; line-height: 1.85; }
.dp-current p { font-size: 14px; color: #b5b5b0; margin: 6px 0 0; }
.dp-links a { display: block; padding: 5px 0; font-size: 13px; }
.dp-link { color: inherit; font-family: var(--font-ui); font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }
.dp-link:hover { text-decoration-thickness: 2px; }
.dp-link:focus-visible, .dp-button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.vd-summary { padding-top: 22px; margin-top: 35px; border-top: 1px solid var(--line); }
.vd-value { font-size: 60px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.vd-value span { font-size: 22px; color: #b5b5b0; }
.vd-summary>p { font-size: 12px; color: #b5b5b0; margin: 10px 0; }
.vd-source { display: flex; align-items: center; gap: 14px; margin-top: 28px; color: #b5b5b0; font-size: 12px; }
.vd-source img { width: 68px; height: 68px; opacity: .7; object-fit: contain; }
.vd-content .dp-section { margin-top: 0; }
.vd-content .dp-section+.dp-section { margin-top: 54px; }
.dp-section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; margin-bottom: 20px; }
.vd-content .dp-section-head h2 { font-size: 30px; margin: 0; }
.dp-section-head .dp-link { font-size: 13px; }
.dp-section-note { margin: -4px 0 18px; font-size: 14px; color: #b5b5b0; line-height: 1.8; }
.dp-stage-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.dp-stage { display: grid; grid-template-columns: minmax(0,1fr) auto 110px; align-items: center; padding: 16px 0; gap: 14px; min-height: 76px; border-bottom: 1px solid var(--line); }
.dp-stage-name { display: flex; align-items: baseline; gap: 15px; min-width: 0; }
.dp-stage-name h3 { font-size: 18px; line-height: 1.65; font-weight: 400; margin: 0; }
.dp-stage-number { color: #b5b5b0; font-size: 12px; font-variant-numeric: tabular-nums; }
.dp-status { font-size: 11px; line-height: 1.7; border: 1px solid #65665f; border-radius: 14px; padding: 3px 9px; color: #b5b5b0; white-space: normal; width: fit-content; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.dp-status.checked { background: #fff; color: #141510; border-color: #fff; font-weight: 400; }
.dp-stage .dp-link { font-size: 12px; padding: 8px 0; min-height: 40px; display: flex; align-items: center; justify-self: end; white-space: nowrap; }
.vd-comic-panel { background: #fff; color: #141510; border: 1.5px solid #141510; border-radius: 22px 24px 21px 25px; padding: 24px 20px 26px; }
.dp-recordings { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
.dp-record { padding: 19px 14px 16px; border: 1.5px solid #141510; border-radius: 12px 14px 11px 13px; box-shadow: 3px 3px 0 #141510; transition: transform .22s ease,box-shadow .22s ease; min-width: 0; display: flex; flex-direction: column; position: relative; background: #fff; color: #141510; }
.dp-record-id { color: #141510; font-size: 11px; letter-spacing: 0; }
.vd-record-symbol { background: #141510; color: #fff; border-radius: 8px 9px 7px 10px; display: flex; align-items: center; justify-content: center; gap: 4px; height: 68px; margin: 20px 0 8px; }
.vd-record-symbol span { width: 3px; border-radius: 3px; background: currentColor; }
.dp-record h3 { font-size: 27px; line-height: 1.4; margin: 10px 0 12px; font-weight: 400; }
.dp-record .dp-duration { font-size: 14px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
.dp-record .dp-record-status { font-size: 12px; color: #141510; line-height: 1.8; margin: 0 0 16px; }
.dp-button { display: inline-flex; align-items: center; margin-top: auto; border: 0; border-top: 1px solid #141510; border-radius: 0; justify-content: space-between; padding: 10px 0 0; font-family: var(--font-ui); font-size: 13px; font-weight: 500; min-height: 42px; color: #141510; background: #fff; text-decoration: none; }
.dp-button::after { content: '↗'; font-size: 19px; }
.dp-button:hover { background: transparent; text-decoration: underline; text-underline-offset: 4px; }
.dp-conditions { border-top: 1px solid var(--line); padding: 22px 0 0; margin-top: 29px; }
.dp-conditions h2 { font-size: 24px; margin: 0 0 10px; }
.dp-conditions p { color: #b5b5b0; font-size: 14px; line-height: 1.85; margin: 5px 0; }
.dp-conditions .dp-link { font-size: 13px; display: inline-block; margin-top: 10px; }
.dp-rights { padding-top: 17px; margin-top: 19px; border-top: 1px solid var(--line); color: #b5b5b0; }
.dp-rights p,.dp-rights a { font-size: 12px; line-height: 1.8; }
.dp-rights p { display: inline; }
.dp-rights a { margin-left: 10px; }
@media (hover:hover) and (prefers-reduced-motion:no-preference) {
  .dp-record:hover,.dp-record:focus-within { transform: translateY(-9px); box-shadow: 4px 8px 0 #141510; z-index: 2; }
  .dp-record:hover+.dp-record,.dp-record:has(+.dp-record:hover),.dp-record:focus-within+.dp-record,.dp-record:has(+.dp-record:focus-within) { transform: translateY(-3px); }
}
@media (max-width:1120px) {
  body.data-page .main-content { padding: 155px 32px 45px; }
  .vd-layout { gap: 45px; grid-template-columns: minmax(0,.8fr) minmax(0,1.7fr); }
  .vd-layout .dp-intro h1 { font-size: 70px; }
  .dp-stage { grid-template-columns: minmax(0,1fr) auto; gap: 7px 10px; }
  .dp-stage-name { grid-column: 1/-1; }
  .dp-status { margin-left: 29px; max-width: calc(100% - 29px); justify-self: start; }
  .vd-comic-panel { padding: 20px 15px; }
  .dp-recordings { gap: 10px; }
  .dp-record { padding: 17px 12px 14px; }
  .vd-record-symbol { gap: 3px; }
  .vd-record-symbol span { width: 2px; }
}
@media (max-width:900px) {

  .vd-layout .dp-intro h1 { max-width: none; font-size: 64px; }
  .dp-intro>p { max-width: 650px; }
  .dp-links { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .vd-summary { display: grid; grid-template-columns: 150px 1fr; gap: 0 25px; border-top: 0; padding-top: 0; margin-top: 26px; }

  .dp-stage-name { grid-column: auto; }
  .dp-status { margin: 0; max-width: 100%; }
  .dp-record { padding: 21px 18px 16px; }
  .vd-record-symbol span { width: 3px; }
}
@media (max-width:600px) {
  body.data-page .main-content { padding: 150px 20px 35px; }
  .vd-layout .dp-intro h1 { font-size: 58px; margin: 20px 0; }
  .dp-meta { font-size: 10px; gap: 8px; }
  .dp-intro>p,.dp-current strong { font-size: 15px; }
  .dp-current p { font-size: 13px; }
  .dp-links { gap: 4px 18px; }
  .dp-links a { font-size: 12px; }
  .vd-value { font-size: 48px; }
  .vd-value span { font-size: 18px; }

  .vd-source img { width: 49px; height: 49px; }
  .vd-summary { grid-template-columns: 125px 1fr; gap: 0 12px; }
  .vd-summary>p { font-size: 10px; }
  .vd-content .dp-section-head h2 { font-size: 26px; }
  .dp-section-head { gap: 6px 12px; }
  .dp-section-head .dp-link { font-size: 12px; }
  .dp-stage { grid-template-columns: minmax(0,1fr); gap: 6px 10px; padding: 14px 0; }
  .dp-stage-name { grid-column: 1/-1; gap: 12px; }
  .dp-stage-name h3 { font-size: 18px; }
  .dp-status { grid-column: 1; grid-row: 2; margin-left: 27px; max-width: calc(100% - 27px); font-size: 10px; }
  .dp-stage .dp-link { grid-column: 1; grid-row: 3; justify-self: start; margin-left: 27px; font-size: 11px; min-height: 34px; }
  .vd-content .dp-section+.dp-section { margin-top: 38px; }
  .dp-section-note { font-size: 13px; }
  .vd-comic-panel { padding: 19px 15px 23px; }
  .dp-recordings { grid-template-columns: 1fr; gap: 20px; }
  .dp-record { display: grid; grid-template-columns: 1fr 72px; gap: 0 14px; padding: 18px 17px 12px; }
  .dp-record-id { grid-column: 1/-1; font-size: 11px; margin-bottom: 12px; }

  .vd-record-symbol span { width: 2px; max-height: 40px; }
  .dp-record h3 { grid-column: 1; font-size: 28px; margin: 0 0 12px; }

  .dp-conditions p { font-size: 13px; }

@media (prefers-reduced-motion:reduce) {

  <script>
    // Decide the route before the shell can be painted. Share this mapping
    // with later navigation so startup and page switches use identical styles.
    (function () {
      "use strict";
      var root = document.documentElement;
      var pages = ["overview", "data", "experiments", "documents", "history"];
      window.GeziRoute = {
        resolve: function (name) { return pages.indexOf(name) >= 0 ? name : "overview"; },
        apply: function (name) {
          name = this.resolve(name);
          document.body.classList.add("overview-page");
          document.body.classList.toggle("data-page", name === "data");
          document.body.classList.toggle("experiments-page", name === "experiments");
          document.body.classList.toggle("library-page", name === "documents");
          document.body.classList.toggle("archive-page", name === "history");
          return name;
        },
        reveal: function () { root.classList.remove("dashboard-loading"); }
      };
      root.classList.add("dashboard-loading");
      // If a module fails, keep the current theme visible instead of an empty
      // hidden shell. Normal startup reveals after its content is rendered.
      window.addEventListener("load", window.GeziRoute.reveal, {once: true});
    })();
  </script>

u003ch2 id=\"_2\"\u003e云端固定目录\u003c/h2\u003e\n\u003cp\u003e在服务器配置文档指定的数据盘下创建一个 \u003ccode\u003eGezi-Opera-Synthesis-master-clean\u003c/code\u003e 目录，并划分：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003esource/AnyAccomp/\nenvironments/anyaccomp/\npretrained/anyaccomp/\ninputs/\noutputs/accompaniment/\noutputs/mixture/\nlogs/\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e实际绝对路径在服务器配置完成后记录，不把连接凭据写入本目录。\u003c/p\u003e\n\u003ch2 id=\"_3\"\u003e执行顺序\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e只读检查系统、GPU、显存、驱动、CUDA、Conda、磁盘和外网访问。\u003c/li\u003e\n\u003cli\u003e创建独立Python 3.9环境，不复用当前项目 \u003ccode\u003e.venv\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e拉取 \u003ccode\u003ehttps://github.com/AmphionTeam/AnyAccomp.git\u003c/code\u003e 并记录提交号。\u003c/li\u003e\n\u003cli\u003e下载 \u003ccode\u003eamphion/anyaccomp\u003c/code\u003e 模型仓库并记录版本与权重哈希。\u003c/li\u003e\n\u003cli\u003e先运行官方样例；通过后上传本目录的三个输入样例。\u003c/li\u003e\n\u003cli\u003e固定 \u003ccode\u003edevice=cuda\u003c/code\u003e、\u003ccode\u003eseed=1024\u003c/code\u003e、\u003ccode\u003en_timesteps=50\u003c/code\u003e，先short，再medium和long。\u003c/li\u003e\n\u003cli\u003e重复运行short，检查固定种子的可复现性。\u003c/li\u003e\n\u003cli\u003e下载伴奏、混合音频、配置和日志到 \u003ccode\u003eartifacts/pretrained_accompaniment/2026-09-10_AnyAccomp/\u003c/code\u003e。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"_4\"\u003e运行记录要求\u003c/h2\u003e\n\u003cp\u003e每次运行单独保存JSON，至少包含：输入文件与SHA-256、代码提交号、模型版本、参数、GPU、开始和结束时间、运行时长、显存峰值、状态、输出路径和错误摘要。\u003c/p\u003e\n\u003cp\u003e完成前不得把官方演示、计划或空目录写成实际结果。通用伴奏成功只表示预训练链路跑通，不表示已经得到合格的歌仔戏伴奏。\u003c/p\u003e\u003c/article\u003e\n\u003cp class=\"reader-meta\"\u003e公开副本已将机器路径替换为占位符；运行示例前请按实际环境填写路径。来源 SHA-256 对应脱敏前的源文件，公开副本不是逐字原文。\u003c/p\u003e","source":"发布资料：deploy/cloud_anyaccomp/README.md（路径已脱敏）","sha256":"6a5181b4642ae44e5362c171103e055d0fa01df7d990eeb439a4044c68fae312","default_page":"documents"},"docs/files/%E6%AD%8C%E4%BB%94%E6%88%8F%E4%BC%B4%E5%A5%8F%E7%94%9F%E6%88%90%E5%8E%86%E5%8F%B2%E5%AE%9E%E7%8E%B0_backstage_v1 源与版本\u003c/summary\u003e\u003cp\u003e来源：$USER_ARCHIVE_ROOT\\歌仔戏伴奏生成历史实现_backstage_v1.1.1_legato.md\u003c/p\u003e\u003cp\u003eSHA-256：1aa2aeed22866b96e35706cc6a667581c2888b68f84dc63f2ad54990d533cd85\u003c/p\u003e\u003cp\u003e文件更新后，双击“更新看板”刷新此页。\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\n\u003carticle id=\"file-content\" class=\"reader-content file-content\" data-file-type=\"md\"\u003e\u003ch1 id=\"_1\"\u003e歌仔戏伴奏生成历史实现：七字调授权替代音色与程式化规则\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e归档属性：历史实现，不属于当前项目。\u003c/strong\u003e 本文记录仓库中此前实现并改进过的规则式伴奏方案，供技术追溯；不将其作为当前项目的研究目标、阶段成果或待办事项。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"1\"\u003e1. 记录对象与版本\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e方案名称：七字调真实替代音色与程式化伴奏。\u003c/li\u003e\n\u003cli\u003e当前保留版本：\u003ccode\u003ebackstage_v1.1.1_legato\u003c/code\u003e；模板版本：\u003ccode\u003ebackstage_v1.1.1-legato-qizi\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e主要实现：\u003ccode\u003eweb_flask/accompaniment/backstage_v1.py\u003c/code\u003e、\u003ccode\u003eweb_flask/accompaniment/templates/backstage_v1/qizi.json\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e这是一套由唱腔条件驱动的规则与模板系统，不是训练得到的神经网络伴奏模型。\u003c/li\u003e\n\u003cli\u003e本文聚焦最后改进后的版本。初版及中间版本只作为代码演进背景，不分别整理成独立方案。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2\"\u003e2. 要解决的问题\u003c/h2\u003e\n\u003cp\u003e早期原型可以按唱腔音符和时值生成 MIDI、渲染伴奏并混音，但通用 GM 占位音色和较简单的伴奏规则难以形成清楚的后场声部关系。后续路线将音色样本、七字调程式和随腔规则结合，优先解决主弦在唱段中断续、句间过门不足、尾奏落在时间轴外等实现问题。\u003c/p\u003e\n\u003cp\u003e方案目标是生成结构上可控、能跟随七字调唱腔的伴奏原型。它不以专业复原或专家评审通过为目标，也没有证据证明适用于其他曲牌。\u003c/p\u003e\n\u003ch2 id=\"3\"\u003e3. 输入、处理与输出\u003c/h2\u003e\n\u003ch3 id=\"_2\"\u003e输入\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e按时间排序的唱腔事件：音高、起止时间、歌词、乐句编号、句尾标记和休止/过门窗口。\u003c/li\u003e\n\u003cli\u003e曲牌固定为七字调（\u003ccode\u003eqizi\u003c/code\u003e）；编配风格支持 \u003ccode\u003egentle\u003c/code\u003e、\u003ccode\u003echeerful\u003c/code\u003e、\u003ccode\u003eintense\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e唱声文件用于最终混音；机器人示例可复用已有唱声音频，只重新生成伴奏及混音。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"_3\"\u003e处理流程\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e唱腔音符、歌词与时值\n        ↓\n建立带乐句和休止窗口的时间轴\n        ↓\n按句级锚点生成连贯主弦，并稀疏安排弹拨\n        ↓\n在开头、句间休止和唱段末尾选择七字调模板\n        ↓\n导出多轨 MIDI ──→ 按授权清单核验并渲染样本音色\n        ↓                                  ↓\n                伴奏 WAV + 原唱声 → 混音 WAV\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"_4\"\u003e输出\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e伴奏 MIDI、伴奏 WAV 和人声/伴奏混音 WAV。\u003c/li\u003e\n\u003cli\u003e编配版本、实际使用的模板 ID、主弦覆盖率、尾奏窗口、样本库版本和来源等追踪元数据。\u003c/li\u003e\n\u003cli\u003e生成失败时保留纯人声结果；\u003ccode\u003ebackstage_v1\u003c/code\u003e 的样本门禁失败不会静默退回 GM 占位渲染。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4\"\u003e4. 改进后方案的组成\u003c/h2\u003e\n\u003ch3 id=\"41\"\u003e4.1 主弦：句级锚点与连奏\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003e_lead()\u003c/code\u003e 先按乐句分组，再从每句选取锚点：保留句首和句末；与上个锚点间隔较长、当前音较长、处于句尾，或旋律方向发生变化时，也可增加锚点。每个锚点的持续事件连接到下一锚点，减少主弦只在少量唱词上点状出现的断裂感；音高限制在目标音域和五声音阶内，并携带轻微音高曲线。\u003c/p\u003e\n\u003cp\u003e最近版本还针对跨音连接作了连奏处理。固定机器人示例的验收记录标明连接尾音为 65 ms；主弦覆盖率在两套示例中为 1.0。覆盖率是技术性结构指标，不代表主观听感或传统真实性。\u003c/p\u003e\n\u003ch3 id=\"42\"\u003e4.2 弹拨、前奏、过门与尾奏\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e弹拨保持稀疏，主要出现在新乐句开头和较长音符下方。\u003c/li\u003e\n\u003cli\u003e前奏仅在首个发声音符前有足够休止时插入。\u003c/li\u003e\n\u003cli\u003e过门模板只能进入时间轴提供的句间窗口，并根据窗口长度选择可用模板。\u003c/li\u003e\n\u003cli\u003e尾奏放在最后唱句之后的 \u003ccode\u003eoutro_window\u003c/code\u003e 内。这样即使时间轴末尾包含休止，结束式也仍在预期的收束区间出现。\u003c/li\u003e\n\u003cli\u003e伴奏风格主要调整力度比例，不改变核心事件结构。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"43\"\u003e4.3 样本渲染与曲牌限制\u003c/h3\u003e\n\u003cp\u003e编配事件经 MIDI 导出后由样本渲染器按声部、音高和技法取样。样本来源及授权由 manifest 记录；不满足样本或许可门禁时，当前 \u003ccode\u003ebackstage_v1\u003c/code\u003e 不以 GM 音色冒充成功结果。代码将音色状态标为“有许可的免费替代音色”，乐师审核状态为“未请求”。因此，“真实音色”在此处指可追溯的真实录音样本，不代表样本就是歌仔戏专用乐器或已由后场乐师认可。\u003c/p\u003e\n\u003ch2 id=\"5\"\u003e5. 最后一次改进对应的问题\u003c/h2\u003e\n\u003cp\u003e固定唱腔中，最后一个时间轴事件可能是较长的句尾休止。如果直接把尾奏接在整个时间轴之后，会使声音结束过晚或留下不必要的空白。改进后的 \u003ccode\u003e_ending()\u003c/code\u003e 根据末尾休止确定可用尾奏区间，将主弦、弹拨和结束式安排在唱段结束前的窗口内；同时主弦改用句级锚点与跨音连接，保持长句连续性。\u003c/p\u003e\n\u003cp\u003e代码和验收记录能够确认这些工程实现。自动检查与样例试听并不能证明它适用于所有唱腔，也不能代替歌仔戏专业听评。\u003c/p\u003e\n\u003ch2 id=\"6\"\u003e6. 已有验收证据与边界\u003c/h2\u003e\n\u003cp\u003e2026-09-20 的机器人表演最终验收记录包含两套输入，均使用 \u003ccode\u003ebackstage_v1.1.1_legato + qizi + intense\u003c/code\u003e：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e两套输出均为 24 kHz、26.367 秒；伴奏文件非空、无削波。\u003c/li\u003e\n\u003cli\u003e尾奏覆盖 23.608–26.367 秒；记录中的最后有效声音约在 26.30–26.32 秒。\u003c/li\u003e\n\u003cli\u003e42 项相关回归检查通过；检查覆盖结构、输出和尾奏等工程条件。\u003c/li\u003e\n\u003cli\u003e用户曾确认一个 v1.1 legato 对照样例方向合适；这不是专业戏曲评审结论。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这些证据说明指定样例的生成与尾奏修复通过了工程核验。尚不能据此推出：其他唱腔或曲牌同样有效、整体优于所有旧方案、具有专业传统性，或获得后场乐师认可。\u003c/p\u003e\n\u003ch2 id=\"7\"\u003e7. 代码与材料索引\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e用途\u003c/th\u003e\n\u003cth\u003e文件\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e七字调编配与改进版本标识\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eweb_flask/accompaniment/backstage_v1.py\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e前奏、过门和尾奏模板\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eweb_flask/accompaniment/templates/backstage_v1/qizi.json\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMIDI、样本渲染和混音管线\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eweb_flask/accompaniment/pipeline.py\u003c/code\u003e、\u003ccode\u003esampler.py\u003c/code\u003e、\u003ccode\u003etraditional.py\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e原路线逐阶段实施记录\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/accompaniment/A_REAL_BACKSTAGE_PLAN.md\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e最近固定样例与自动验收记录\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eartifacts/robot_performance_audio/2026- cspan class=\"file-line\" id=\"L6\"\u003efrom functools import lru_cache\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L7\"\u003efrom pathlib import Path\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L8\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L9\"\u003efrom .pipeline import AccompanimentError, PENTATONIC, infer_tonic\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L10\"\u003efrom .traditional import PARTS, Arrangement, PerformanceEvent, export_traditional_midi\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L11\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L12\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L13\"\u003eARRANGEMENT_VERSION = \u0026quot;backstage_v1.1.1_legato\u0026quot;\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L14\"\u003eTIMBRE_STATUS = \u0026quot;licensed_free_substitute\u0026quot;\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L15\"\u003eEXPERT_REVIEW_STATUS = \u0026quot;not_requested\u0026quot;\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L16\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L17\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L18\"\u003e@lru_cache(maxsize=1)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L19\"\u003edef load_qizi_template():\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L20\"\u003e    path = Path(__file__).with_name(\u0026quot;templates\u0026quot;) / \u0026quot;backstage_v1\u0026quot; / \u0026quot;qizi.json\u0026quot;\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L21\"\u003e    if not path.is_file():\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L22\"\u003e        raise AccompanimentError(\u0026quot;backstage_v1 qizi template is missing\u0026quot;)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L23\"\u003e    return json.loads(path.read_text(encoding=\u0026quot;utf-8\u0026quot;))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L24\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L25\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L26\"\u003edef _nearest_scale(target, tonic, low, high):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L27\"\u003e    allowed = [pitch for pitch in range(low, high + 1) if (pitch - tonic) % 12 in PENTATONIC]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L28\"\u003e    return min(allowed, key=lambda pitch: (abs(pitch - target), pitch))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L29\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L30\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L31\"\u003edef _fit_range(pitch, low, high):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L32\"\u003e    while pitch \u0026lt; low:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L33\"\u003e        pitch += 12\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L34\"\u003e    while pitch \u0026gt; high:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L35\"\u003e        pitch -= 12\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L36\"\u003e    return max(low, min(high, pitch))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L37\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L38\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L39\"\u003edef _event(start, end, pitch, velocity, technique, pitch_curve=()):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L40\"\u003e    return PerformanceEvent(float(start), max(float(start) + 0.001, float(end)), int(pitch),\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L41\"\u003e                            int(velocity), technique, tuple(pitch_curve))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L42\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L43\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L44\"\u003edef _lead(timeline, tonic, style):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L45\"\u003e    velocity = {\u0026quot;gentle\u0026quot;: 43, \u0026quot;cheerful\u0026quot;: 49, \u0026quot;intense\u0026quot;: 55}[style]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L46\"\u003e    result = []\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L47\"\u003e    phrase_ids = []\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L48\"\u003e    for source in timeline:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L49\"\u003e        if source.midi is not None and source.phrase_id not in phrase_ids:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L50\"\u003e            phrase_ids.append(source.phrase_id)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L51\"\u003e    for phrase_id in phrase_ids:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L52\"\u003e        phrase = [source for source in timeline\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L53\"\u003e                  if source.midi is not None and source.phrase_id == phrase_id]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L54\"\u003e        if not phrase:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L55\"\u003e            continue\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L56\"\u003e        anchors = [phrase[0]]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L57\"\u003e        for index, source in enumerate(phrase[1:-1], start=1):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L58\"\u003e            previous = phrase[index - 1]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L59\"\u003e            following = phrase[index + 1]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L60\"\u003e            direction_before = source.midi - previous.midi\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L61\"\u003e            direction_after = following.midi - source.midi\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L62\"\u003e            direction_change = direction_before * direction_after \u0026lt; 0\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L63\"\u003e            spaced = source.start - anchors[-1].start \u0026gt;= 0.72\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L64\"\u003e            expressive = source.duration \u0026gt;= 0.68 or source.phrase_end\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L65\"\u003e            if spaced or expressive or (direction_change and source.start - anchors[-1].start \u0026gt;= 0.32):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L66\"\u003e                anchors.append(source)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L67\"\u003e        if phrase[-1] is not anchors[-1]:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L68\"\u003e            anchors.append(phrase[-1])\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L69\"\u003e        for index, source in enumerate(anchors):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L70\"\u003e            end = anchors[index + 1].start if index + 1 \u0026lt; len(anchors) else phrase[-1].end\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L71\"\u003e            pitch = _nearest_scale(_fit_range(source.midi, 59, 81), tonic, 59, 81)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L72\"\u003e            curve = ((0.0, 0.0), (0.38, 0.10), (0.62, -0.10), (1.0, 0.0))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L73\"\u003e            if index == len(anchors) - 1:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L74\"\u003e                curve = ((0.0, 0.0), (0.78, -0.35), (1.0, 0.0))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L75\"\u003e            result.append(_event(source.start, end, pitch, velocity, \u0026quot;sustain\u0026quot;, curve))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L76\"\u003e    return result\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L77\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L78\"\u003e\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L79\"\u003edef _lead_coverage_ratio(timeline, events):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L80\"\u003e    phrases = {}\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L81\"\u003e    for source in timeline:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L82\"\u003e        if source.midi is not None:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L83\"\u003e            start, end = phrases.get(source.phrase_id, (source.start, source.end))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L84\"\u003e            phrases[source.phrase_id] = (min(start, source.start), max(end, source.end))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L85\"\u003e    singing = sum(end - start for start, end in phrases.values())\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L86\"\u003e    covered = 0.0\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L87\"\u003e    for start, end in phrases.values():\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L88\"\u003e        intervals = sorted((max(start, event.start), min(end, event.end)) for event in events\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L89\"\u003e                           if max(start, event.start) \u0026lt; min(end, event.end))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L90\"\u003e        cursor = start\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L91\"\u003e        for left, right in intervals:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L92\"\u003e            if right \u0026lt;= cursor:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L93\"\u003e                continue\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L94\"\u003e            covered += right - max(left, cursor)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L95\"\u003e            cursor = max(cursor, right)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L96\"\u003e    return covered / singing if eline, tonic, style, template):\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L179\"\u003e    parts = {part: [] for part in PARTS}\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L180\"\u003e    phrase_count = len({source.phrase_id for source in timeline if source.phrase_id is not None})\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L181\"\u003e    variant = template[\u0026quot;endings\u0026quot;][max(0, phrase_count - 1) % len(template[\u0026quot;endings\u0026quot;])]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L182\"\u003e    scale = {\u0026quot;gentle\u0026quot;: 0.9, \u0026quot;cheerful\u0026quot;: 1.0, \u0026quot;intense\u0026quot;: 1.1}[style]\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L183\"\u003e    last_pitched = next((source for source in reversed(timeline) if source.midi is not None), None)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L184\"\u003e    if last_pitched is None:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L185\"\u003e        return parts, []\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L186\"\u003e    total = timeline[-1].end\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L187\"\u003e    outro_start = timeline[-1].start if timeline[-1].midi is None else last_pitched.end\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L188\"\u003e    available = total - outro_start\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L189\"\u003e    if available \u0026lt;= 0.18:\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L190\"\u003e        return parts, []\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L191\"\u003e    melodic_end = max(outro_start + 0.12, total - 0.45)\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L192\"\u003e    midpoint = min(melodic_end, outro_start + min(0.92, available * 0.42))\n\u003c/span\u003e\u003cspan class=\"file-line\" id=\"L193\"\u003e    first_pitch = _nearest_scale(last_pitched.midi + 2, tonic, 59, 81)\n\u003c/span\u00 u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#_4\"\u003e三、兼容边界\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#_5\"\u003e四、行数验收\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#_6\"\u003e五、测试验收\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#_7\"\u003e六、尚未完成\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/nav\u003e\u003cdiv class=\"reader-meta\"\u003e\u003cdetails\u003e\u003csummary\u003e查看来源与版本\u003c/summary\u003e\u003cp\u003e来源：$PROJECT_ROOT\\docs\\伴奏研究型混合架构实现与验收.md\u003c/p\u003e\u003cp\u003eSHA-256：fc572b63f7667bec284c2ecd151a416999320eecd9d12881647615b4191199f9\u003c/p\u003e\u003cp\u003e文件更新后，双击“更新看板”刷新此页。\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\n\u003carticle id=\"file-content\" class=\"reader-content file-content\" data-file-type=\"md\"\u003e\u003ch1 id=\"_1\"\u003e伴奏研究型混合架构实现与验收\u003c/h1\u003e\n\u003cp\u003e日期：2026年9月10日\u003c/p\u003e\n\u003ch2 id=\"_2\"\u003e一、交付结论\u003c/h2\u003e\n\u003cp\u003e本次在保留四个旧伴奏profile的基础上新增 \u003ccode\u003eresearch_hybrid_v1\u003c/code\u003e。新profile提供统一条件契约、歌仔戏层级时间轴、多候选规则提供器、硬约束、软评分、确定性选择、技术代理指标和版本化追踪信息。\u003c/p\u003e\n\u003cp\u003e它是研究框架和规则基线，不是训练后的伴奏模型，不代表已经取得听感提升或歌仔戏专业有效性。\u003c/p\u003e\n\u003ch2 id=\"_3\"\u003e二、核心数据流\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eConditionBundle\u003c/code\u003e 接收网页旧输入或FT-GAN结构条件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOperaTimeline\u003c/code\u003e 构建音符、腔句、区段和前奏/唱腔/过门/尾奏窗口。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRuleCandidateProvider\u003c/code\u003e 生成平衡、稀疏、响应型和低位支撑四组候选。\u003c/li\u003e\n\u003cli\u003e硬约束淘汰非法时间、音域、重叠、打击乐冲突和采样不具备的候选。\u003c/li\u003e\n\u003cli\u003e软评分记录唱腔避让、句末响应、过门覆盖、密度、音级距离、声部多样性和置信度。\u003c/li\u003e\n\u003cli\u003e按总分、候选签名和标识符确定性选择结果。\u003c/li\u003e\n\u003cli\u003e复用现有MIDI导出、授权采样渲染和人声混音流程。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"_4\"\u003e三、兼容边界\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003egenerate_accompaniment()\u003c/code\u003e 原参数和默认行为保留。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprototype_v1\u003c/code\u003e、\u003ccode\u003etraditional_v1\u003c/code\u003e、\u003ccode\u003eopera_v2\u003c/code\u003e、\u003ccode\u003ebackstage_v1\u003c/code\u003e 均继续可用。\u003c/li\u003e\n\u003cli\u003eFlask后端识别 \u003ccode\u003eresearch_hybrid_v1\u003c/code\u003e，但两个网页仍固定提交 \u003ccode\u003ebackstage_v1 + qizi\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e新profile当前只支持七字调；其他曲调会明确拒绝，不静默套用未经定义的规则。\u003c/li\u003e\n\u003cli\u003e未来学习模型必须实现 \u003ccode\u003eCandidateProvider\u003c/code\u003e；当前不可用提供器会明确报错，不返回伪造结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"_5\"\u003e四、行数验收\u003c/h2\u003e\n\u003cp\u003e固定清单位于 \u003ccode\u003eweb_flask/accompaniment/core_code_manifest.json\u003c/code\u003e，统计工具为 \u003ccode\u003etools/accompaniment/count_core.py\u003c/code\u003e。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e指标\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003e结果\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e原核心代码\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1,487物理行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e当前核心代码\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e3,416物理行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e当前有效代码\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e2,940行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e增长\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1,929物理行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完全重复函数体\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e最低要求\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e3,000物理行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e状态\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"_6\"\u003e五、测试验收\u003c/h2\u003e\n\u003cp\u003e执行命令：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-cmd\"\u003e$PROJECT_ROOT\\.venv\\Scripts\\python.exe -m unittest tests.test_accompaniment tests.test_backstage_v1 tests.test_research_hybrid\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e结果：66项测试全部通过，其中原有40项、新增26项。新增测试覆盖条件对齐、中文曲调/板式别名、非法连音、结构边界、候选确定性、随机种子、硬约束、评分排序、不可用学习提供器、元数据以及完整MIDI/WAV渲染。\u003c/p\u003e\n\u003ch2 id=\"_7\"\u003e六、尚未完成\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e没有训练神经网络。\u003c/li\u003e\n\u003cli\u003e没有新增或下载未授权训练数据。\u003c/li\u003e\n\u003cli\u003e没有完成歌仔戏专业听评。\u003c/li\u003e\n\u003cli\u003e没有证明层级条件相对强基线产生提升。\u003c/li\u003e\n\u003cli\u003e没有将 \u003ccode\u003eresearch_hybrid_v1\u003c/code\u003e 切换为网页默认方案。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e因此当前正确表述是“研究框架已实现并通过结构测试”，而不是“创新方法已经验证”。\u003c/p\u003e\u003c/article\u003e\n\u003cp class=\"reader-meta\"\u003e公开副本已将机器路径替换为占位符；运行示例前请按实际环境填写路径。来源 SHA-256 对应脱敏前的源文件，公开副本不是逐字原文。\u003c/p\u003e","source":"发布资料：docs/伴奏研究型混合架构实现与验收.md（路径已脱敏）","sha256":"fc572b63f7667bec284c2ecd151a416999320eecd9d12881647615b4191199f9","default_page":"history"},"docs/files/hybrid-0cf364a3114b.html":{"title":"hybrid.py","kind":"file","type":"Python 源代码","html":"\n\u003cheader class=\"file-heading\"\u003e\u003cp class=\"file-kicker\"\u003eGEZI OPERA / PROJECT RECORDS\u003c/p\u003e\u003ch1\u003ehybrid.py\u003c/h1\u003e\u003cp\u003ePython 源代码 · 5,815 字节 · 全文快照\u003c/p\u003e\u003c/header\u003e\n\u003cdiv class=\"reader-meta\"\u003e\u003cdetails\u003e\u003csummary\u003e查看来源与版本\u003c/summary\u003e\u003cp\u003e来源：$PROJECT_ROOT\\web_flask\\accompaniment\\hybrid.py\u003c/p\u003e\u003cp\u003eSHA-256：bbe9905714278ce769bf9c8ee4b70642b39bac0827351613fb19c9e6960af86e\u003c/p\u003e\u003cp\u003e文件更新后，双击“更新看板”刷新此页。\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\n\u003carticle id=\"file-content\" class=\"reader-content file-content\" data-file-type=\"py\"\u003e\u00 03c/li\u003e\n\u003cli\u003e\u003ca href=\"#54-padding-mask\"\u003e5.4 Padding 和 Mask：让不同长度片段放进同一批次\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#55\"\u003e5.5 损失、梯度和优化器：为什么跑过反向仍然没有训练成果\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#6-anyaccomp\"\u003e6. 现在下载的 AnyAccomp 是什么，我们之后拟微调什么\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#7\"\u003e7. 在项目里去哪里找文件和证据\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#8\"\u003e8. 后续怎么维护这份说明\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/nav\u003e\u003cdiv class=\"reader-meta\"\u003e\u003cdetails\u003e\u003csummary\u003e查看来源与版本\u003c/summary\u003e\u003cp\u003e来源：$PROJECT_ROOT\\anyaccomp_gezi_finetune\\docs\\929项目模型与技术说明.md\u003c/p\u003e\u003cp\u003eSHA-256：1dede0417572f859e6e60a1c15ef21ddd92538cce7b75e556af4d341e4b53626\u003c/p\u003e\u003cp\u003e文件更新后，双击“更新看板”刷新此页。\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\n\u003carticle id=\"file-content\" class=\"reader-content file-content\" data-file-type=\"md\"\u003e\u003ch1 id=\"929\"\u003e929 项目模型与技术说明：它们具体负责什么\u003c/h1\u003e\n\u003cp\u003e更新日期：2026-10-01。本文用于随时回看项目中的模型、工具和技术分工；实际运行时间、配置、哈希和验收依据见\u003ca href=\"../data-preparation.html#complete\"\u003e实验进度记录\u003c/a\u003e。涉及“当前进度”的内容是本日期的快照，后续阶段应据实际结果更新。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e929 的推进边界\u003c/strong\u003e：用户已明确包含规模化建集。范围是“小规模流程验证 → 按明确规模建集 → 质量与训练输入核验 → 数据划分和交付”；达到约定规模并完成交付、验收后停止，不自动启动正式微调或其他实验。具体来源与数量/合格时长尚待确定。本文对训练机制的解释是帮助理解项目，不表示后续所有机制都必须在 929 实现。固定交付项与停止规则见进度主文档的“实验目标与边界”和“数据交付与结束条件”。\u003c/p\u003e\n\u003cp\u003e阅读顺序：先看第 1 节理解整体流程，再用第 2 节查名称；具体作用见第 3–5 节；当前验证范围及文件位置见第 6–7 节。\u003c/p\u003e\n\u003ch2 id=\"1\"\u003e1. 我们最终要做什么，现在在做什么\u003c/h2\u003e\n\u003cp\u003e最终目标是让模型根据歌仔戏人声中的旋律，生成适合的伴奏。当前正在用三份完整录音验证数据处理与训练输入流程；形成规模化合格数据后，正式微调和生成效果评价属于后续模型实验。\u003c/p\u003e\n\u003cp\u003e准备材料时，完整录音经过分离得到人声和伴奏。每对唱段的\u003cstrong\u003e人声提供旋律条件，伴奏提供学习目标\u003c/strong\u003e。生成新伴奏时，模型接收输入人声中的旋律信息，生成新的声音；它并不是从该输入录音中找回原有伴奏。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-mermaid\"\u003eflowchart TD\n    A[完整录音] --\u0026gt; B[Demucs 分离]\n    B --\u0026gt; C[人声轨]\n    B --\u0026gt; D[伴奏轨]\n    C --\u0026gt; E[听验并按共同边界分段]\n    D --\u0026gt; E\n    E --\u0026gt; F[人声片段：提取 Chroma]\n    F --\u0026gt; G[VQ：转换为旋律编号]\n    E --\u0026gt; H[伴奏片段：提取并标准化 Mel]\n    G --\u0026gt; I[FM：训练输入与损失核验]\n    H --\u0026gt; I\n    J[未来生成：旋律编号和随机噪声] --\u0026gt; K[FM：生成伴奏 Mel]\n    K --\u0026gt; L[Vocos：转换成伴奏音频]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e图中伴奏 Mel 是训练的“答案”，旋律编号是告诉模型要配什么旋律的“条件”。我们已经检查了这些输入能否进入 FM 并计算损失和梯度，尚未更新 FM 参数。之前展示的声码器音频，是把真实伴奏的频谱重新合成为声音，用于核验转换链路；它们不是 FM 新生成的伴奏。\u003c/p\u003e\n\u003ch2 id=\"2\"\u003e2. 名称速查：各自承担什么工作\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e名称\u003c/th\u003e\n\u003cth\u003e类型\u003c/th\u003e\n\u003cth\u003e在本项目中的工作\u003c/th\u003e\n\u003cth\u003e截至本次更新\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eDemucs \u003ccode\u003ehtdemucs_ft\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e音源分离模型\u003c/td\u003e\n\u003ctd\u003e从完整录音中得到人声和伴奏，准备成对材料\u003c/td\u003e\n\u003ctd\u003e已采用；三份双轨经用户听验通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e公开 MDX23 候选\u003c/td\u003e\n\u003ctd\u003e音源分离方案\u003c/td\u003e\n\u003ctd\u003e与 Demucs 比较同一份 R0001 的分离结果\u003c/td\u003e\n\u003ctd\u003e已比较；用户认为 Demucs 更好\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChroma\u003c/td\u003e\n\u003ctd\u003e音乐特征表示\u003c/td\u003e\n\u003ctd\u003e从人声提取随时间变化的音级信息\u003c/td\u003e\n\u003ctd\u003e已提取与核验\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVQ / VQ-VAE\u003c/td\u003e\n\u003ctd\u003e量化旋律模型\u003c/td\u003e\n\u003ctd\u003e将 Chroma 压缩成有限种旋律编号，供 FM 使用\u003c/td\u003e\n\u003ctd\u003e已使用预训练权重并冻结\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMel / log-mel\u003c/td\u003e\n\u003ctd\u003e声音特征表示\u003c/td\u003e\n\u003ctd\u003e把伴奏波形转换成 FM 要学习和生成的数值矩阵\u003c/td\u003e\n\u003ctd\u003e已核验实验尺度和时间网格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFM / Flow Matching\u003c/td\u003e\n\u003ctd\u003e伴奏生成模型\u003c/td\u003e\n\u003ctd\u003e根据旋律条件，学习从噪声走向伴奏频谱\u003c/td\u003e\n\u003ctd\u003e主损失、梯度与提示/补齐检查通过；未更新参数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVocos\u003c/td\u003e\n\u003ctd\u003e神经声码器\u003c/td\u003e\n\u003ctd\u003e将伴奏频谱转换为可播放波形\u003c/td\u003e\n\u003ctd\u003e三段重建及时间/长度适配听验通过\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePrompt\u003c/td\u003e\n\u003ctd\u003e已知伴奏提示机制\u003c/td\u003e\n\u003ctd\u003e给 FM 部分真实伴奏，让它学习其余位置\u003c/td\u003e\n\u003ctd\u003e逐条有效长度适配已核验\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCFG\u003c/td\u003e\n\u003ctd\u003e条件丢弃与生成引导机制\u003c/td\u003e\n\u003ctd\u003e让模型学会有/无旋律条件两种预测，生成时组合使用\u003c/td\u003e\n\u003ctd\u003e训练接口中沿用丢条件概率 0.2；生成引导未在本轮评价\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMERT\u003c/td\u003e\n\u003ctd\u003e预训练音乐特征模型\u003c/td\u003e\n\u003ctd\u003e为辅助训练提供音乐表征参考\u003c/td\u003e\n\u003ctd\u003e当前核验未调用这条辅助链路\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eREPA\u003c/td\u003e\n\u003ctd\u003e表征对齐辅助损失\u003c/td\u003e\n\u003ctd\u003e约束 FM 中间特征接近音乐模型的特征\u003c/td\u003e\n\u003ctd\u003e当前未计算此项损失\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQwen2-Audio\u003c/td\u003e\n\u003ctd\u003e听音理解辅助模型\u003c/td\u003e\n\u003ctd\u003e曾试验自动听音描述与唱词转写\u003c/td\u003e\n\u003ctd\u003e原先试验的转写不合格；不作为当前训练标注依据\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e“特征”是音频的另一种数值表示；“模型”有学到的参数；“机制”是组织训练或生成的方式。Chroma、Mel、CFG 和 REPA 各有用途，不应都当成独立生成模型。\u003c/p\u003e\n\u003ch2 id=\"3\"\u003e3. 数据准备和旋律条件\u003c/h2\u003e\n\u003ch3 id=\"31-demucs-mdx23\"\u003e3.1 Demucs 与 MDX23：先把训练材料拆成两部分\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入完整歌曲录音，输出人声轨与伴奏轨；完整录音始终保留。Demucs 可以在内部按窗口处理完整录音，不要求我们先按固定秒数切掉戏曲结构。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：只有完整混音时，模型无法直接获得“给定人声，对应伴奏”的成对监督材料。分离让我们能构建这些配对，但分离结果只是估计，仍需人工听验。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本次选择\u003c/strong\u003e：R0001 比较两种方案后，用户认为 Demucs 更好，后续两份录音沿用 \u003ccode\u003ehtdemucs_ft\u003c/code\u003e。公开 MDX23 候选来自 \u003ccode\u003eZFTurbo/MVSEP-MDX23-music-separation-model\u003c/code\u003e，提交与权重配置已在进度记录中保存；没有证据证明它是 SingNet 的精确版本。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e结果说明什么\u003c/strong\u003e：三份 Demucs 双轨通过本次人工门槛，适合继续小规模流程验证。人声中仍存在伪影；没有独立干净双轨作真值，因此不能宣称完全分离。伴奏是学习目标，明显主唱泄漏或主要乐器缺损仍会影响后续训练，不能靠旋律瓶颈解决。\u003c/p\u003e\n\u003ch3 id=\"32\"\u003e3.2 同步分段与配对：让条件和答案讲的是同一段音乐\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：把同一次分离的人声、伴奏，按同一组时间边界切成一对对片段。现有三份录音得到 13 对，保留片头伴奏、内部过门和尾奏。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：如果人声片段和伴奏片段截取不同位置，模型会收到错误的对应关系。我们按已听验的结构边界分段，不把 30 秒当成固定截断上限。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e已证明与待验证\u003c/strong\u003e：片段连续覆盖完整双轨，重新拼接后逐样本一致，说明没有在分段中漏掉内容。共同边界和相同长度不单独证明分离轨内部的全部细节都精确对齐。\u003c/p\u003e\n\u003ch3 id=\"33-chroma\"\u003e3.3 Chroma：先提取“唱了哪些音”的信息\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e它是什么\u003c/strong\u003e：表示随时间变化的音级能量的特征。例如相隔八度的同类音会归到相同音级附近；它不是唱词、精确乐谱，也不是只含一条基频的轨迹。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入本实验转换为 24 kHz 单声道的人声，输出 24 个音级通道、每秒约 50 帧的数值矩阵。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：为伴奏提供旋律线索，同时减少直接把整个人声频谱中的音色和分离细节交给模型。残留乐器也可能改变 Chroma，因此不能把它视为绝对无伪影的旋律真值。\u003c/p\u003e\n\u003ch3 id=\"34-vq\"\u003e3.4 VQ：把旋律信息变成有限种编号\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e它是什么\u003c/strong\u003e：VQ 是向量量化；VQ-VAE 是包含这种量化操作的编码/重建模型。码本可理解为一组已经学习好的特征模板，每段输入特征被匹配成模板编号。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入 Chroma，输出随时间排列的整数 token。本实验码本有 512 个条目，已检查 token 在 0–511 范围内；编号不是歌词编号，也不直接等于某个音符。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：进一步压缩旋律条件，使 FM 通过有限的旋律表示接收输入，而不是依赖人声中的全部声学细节。这是我们使用预训练旋律瓶颈的目的。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当前怎么用\u003c/strong\u003e：加载已有 VQ 权重提取 13 对样本的 token，保持参数冻结。冻结表示权重不更新，仍然会执行特征提取计算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e与伪影的关系\u003c/strong\u003e：论文把 Chroma 和 VQ 组合为量化旋律瓶颈，针对分离伪影与输入音色依赖设计条件表示。\u003ca href=\"https://arxiv.org/html/2509.14052v1#S2.SS1\"\u003eAnyAccomp 论文 §2.1\u003c/a\u003e 这发生在进入伴奏生成模型之前，不会直接输出一份被修复的人声 WAV，也不保证所有失真都被消除。\u003c/p\u003e\n\u003ch2 id=\"4\"\u003e4. 伴奏目标和生成模型\u003c/h2\u003e\n\u003ch3 id=\"41-mel-log-mel\"\u003e4.1 Mel / log-mel：模型使用的“声音表示”\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e它是什么\u003c/strong\u003e：将声音在每个时间窗口中的能量分布按 Mel 频率刻度组织起来，再取对数形成 log-mel。它保留比 Chroma 更丰富的声音结构，但不是可直接播放的波形。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入伴奏波形，输出“时间帧 × 128 个频率通道”的矩阵。训练时它是目标；生成时 FM 输出同类表示，交给声码器合成声音。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：让生成模型在频谱表示上学习伴奏，再由声码器处理波形合成。输入旋律条件和伴奏目标的角色不同，不是让模型复制人声的 Mel。\u003c/p\u003e\n\u003ch3 id=\"42\"\u003e4.2 标准化、时间网格与长度：先让数据含义一致\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e标准化\u003c/strong\u003e：本实验采用 \u003ccode\u003e(原始 log-mel − 均值) / 标准差\u003c/code\u003e，均值为 −4.92，方差为 8.14，标准差取方差的平方根。这是数值尺度变换，不是音频降噪或简单的播放音量归一化。raw 和 z-score 指标准化前、后的表示。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么核验\u003c/strong\u003e：数值尺度不同，会改变 FM 的学习目标，也影响声码器重建。本次 z-score 重建的听感与参考接近，支持当前实验输入尺度；完整公开训练加载器缺失，仍不能据此称为作者精确预处理。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e时间网格\u003c/strong\u003e：每一帧特征对应一个时间中心。24 kHz 下 hop 480，即帧中心间隔 20 ms；原目标 Mel 与旋律 token 的中心约定相差 240 个采样点，即 10 ms。仅把帧数凑成一样，不能解决时间中心差异。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当前实验规则\u003c/strong\u003e：目标 Mel 与 token 使用 \u003ccode\u003e0 + k×480\u003c/code\u003e 的帧中心；声码器从完整窗口合成结果的第 960 点取参考长度，处理合成起点约定。规则经数学、技术检查及三段听验支持，没有通过末尾补零掩盖长度缺口；它仍是本实验适配，不能称为作者原版。\u003c/p\u003e\n\u003ch3 id=\"43-fm\"\u003e4.3 FM：真正学习如何生成伴奏的部分\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e它是什么\u003c/strong\u003e：Flow Matching，流匹配。可以理解为学习一套变化方向，使随机噪声逐步成为符合旋律条件的伴奏频谱。这里“噪声”是生成过程的起点，不是给分离人声做降噪。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e训练输入与输出\u003c/strong\u003e：输入旋律 token、真实伴奏目标与噪声的混合频谱、当前时间位置，以及有效长度/提示信息；模型输出当前应该怎样变化的预测。它与已知目标变化方向比较，得到主损失。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e生成输入与输出\u003c/strong\u003e：输入旋律 token 和随机噪声，多步使用模型的预测变化方向，最终得到伴奏 Mel。因此“损失计算通过”和“新伴奏听起来好”需要分别验证。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本次状态\u003c/strong\u003e：使用下载的预训练 FM，13 个全长单样本与七个混合长度批次的前向/反向检查通过。梯度存在且有限，但没有优化器步骤，参数没有改变。完整正式微调计划尚未实施。用户已确认本轮有限验收，不要求在 929 实现完整作者辅助训练配方。\u003c/p\u003e\n\u003ch3 id=\"44-vocos\"\u003e4.4 Vocos：将伴奏频谱变成可以听的声音\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入与其接口匹配的伴奏 Mel，输出 24 kHz 单声道波形。频谱之外的波形合成细节由声码器完成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：FM 的最终输出是频谱，还需要这一转换才能播放。声码器不能替代 FM 学习歌仔戏配器，也不能保证将错误的频谱转换成正确伴奏。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本次核验\u003c/strong\u003e：使用已有预训练声码器，选短、中、长三段，把真实伴奏目标频谱重新合成为声音。用户反馈修正版自然完整、没有新增失真，支持这三段上的频谱尺度与解码时间/长度规则。未把全部 13 段神经解码都标为听验通过，未将这次重建当作微调生成效果。\u003c/p\u003e\n\u003ch2 id=\"5-fm\"\u003e5. FM 训练中的几种机制\u003c/h2\u003e\n\u003ch3 id=\"51-prompt\"\u003e5.1 Prompt：给一部分伴奏作为提示\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e含义\u003c/strong\u003e：这里指真实伴奏的部分频谱区域，不是给聊天模型写的一段文字，也不是人声旋律条件。模型看到这些区域，学习生成其余位置，可用于带伴奏上下文的生成训练。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e输入与输出\u003c/strong\u003e：输入目标频谱、真实长度和提示选择方案；输出哪些帧已知、哪些帧要计算损失的掩码。左右提示表示有效片段开头、末尾的已知区域。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么改\u003c/strong\u003e：原公开分支以批次补齐后的最大长度选提示，短样本可能看不到右提示，甚至没有剩余学习位置。已确认适配按每段有效长度选提示，确保提示在真实范围内且保留损失帧，不新增模型学习参数。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当前状态\u003c/strong\u003e：默认每批共享 0.3 的启用概率；无提示、仅左、仅右、双侧和三个随机种子的混合检查通过。通过的是已测提示与补齐合同，不是所有可能训练情形的穷尽证明。\u003c/p\u003e\n\u003ch3 id=\"52-cfg\"\u003e5.2 CFG：学会有条件和无条件预测，再用于生成引导\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e训练作用\u003c/strong\u003e：随机丢掉旋律条件，让同一模型既学“给定旋律如何生成”，也学“不看这段旋律如何生成”。伴奏目标仍然存在，不是丢掉训练答案。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e生成作用\u003c/strong\u003e：结合有旋律、无旋律两种预测，调节条件对生成方向的影响。引导更强不保证质量更好，适合程度需要生成试听与评价。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e必须分清两个参数\u003c/strong\u003e：训练的条件丢弃概率决定多常拿掉旋律；生成的引导强度决定两种预测如何组合。本地训练代码虽然使用 \u003ccode\u003ecfg_scale\u003c/code\u003e 这个名字，当前的 0.2 在训练分支中承担的是丢条件概率，不能解释为生成引导强度。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当前状态\u003c/strong\u003e：核验保留本地丢条件概率 0.2。论文训练概率为 0.1，推理引导强度为 3，两者含义不同。\u003ca href=\"https://arxiv.org/html/2509.14052v1#S2.SS2\"\u003eAnyAccomp 论文 §2.2、§3.1\u003c/a\u003e 后续提案需要明确使用哪种训练设置；本轮没有评价生成引导效果。\u003c/p\u003e\n\u003ch3 id=\"53-mert-repa\"\u003e5.3 MERT 和 REPA：音乐特征参考与辅助学习约束\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eMERT 是什么\u003c/strong\u003e：预训练音乐理解模型。输入符合其接口要求的音频，输出音乐表征，也就是一组描述声音内容的特征；它不是负责合成伴奏的声码器。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eREPA 是什么\u003c/strong\u003e：表征对齐训练方法。取 FM 的中间特征，经过必要的投影/时间对应处理，与预训练音乐模型的表征比较，得到额外的辅助损失。主损失指导变化方向，辅助损失约束中间表示。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：为 FM 训练提供额外的音乐特征指导。论文使用 MERT-330M 作为 REPA 对齐参考，辅助损失权重为 0.5。\u003ca href=\"https://arxiv.org/html/2509.14052v1#S3.SS1\"\u003eAnyAccomp 论文 §3.1\u003c/a\u003e 这不同于输入侧的 Chroma/VQ 旋律瓶颈，不能直接把它当成人声音频的伪影清除器。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本次状态\u003c/strong\u003e：现有模型含 REPA 投影结构，但有结构不等于已计算辅助损失。当前核验将该投影冻结，没有执行 MERT 特征提取和 REPA 损失。教师音频选择、采样率、特征时间对齐与损失细节尚需核查，不能宣称精确复现作者辅助训练。\u003c/p\u003e\n\u003ch3 id=\"54-padding-mask\"\u003e5.4 Padding 和 Mask：让不同长度片段放进同一批次\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e含义\u003c/strong\u003e：padding 是把短样本补到同批最长样本的尺寸；mask 是标记哪些位置属于真实音频。损失 mask 还需排除已经给出的提示区域。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e为什么用\u003c/strong\u003e：计算通常要求一批数据具有相同张量尺寸，但补齐区域不应成为新的训练内容。例如 554 帧和 1,506 帧一起计算，前者有 952 帧补齐，不代表其音乐被延长。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当前证据\u003c/strong\u003e：七次改变补齐频谱/token 内容的检查通过，有效预测、损失和提示计划保持一致。支持本实验已测批次的处理，不代表可以忽略实际长度记录。\u003c/p\u003e\n\u003ch3 id=\"55\"\u003e5.5 损失、梯度和优化器：为什么跑过反向仍然没有训练成果\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e词\u003c/th\u003e\n\u003cth\u003e具体含义\u003c/th\u003e\n\u003cth\u003e本次状态\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e前向\u003c/td\u003e\n\u003ctd\u003e输入数据，得到模型预测\u003c/td\u003e\n\u003ctd\u003e已执行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e损失\u003c/td\u003e\n\u003ctd\u003e将预测与目标比较得到的误差数值\u003c/td\u003e\n\u003ctd\u003e主损失已计算；数值不是音质分数\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e反向传播/梯度\u003c/td\u003e\n\u003ctd\u003e计算各参数应朝哪个方向变化才能影响损失\u003c/td\u003e\n\u003ctd\u003e已核验有限且非零\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e优化器步骤\u003c/td\u003e\n\u003ctd\u003e按梯度真正修改模型参数\u003c/td\u003e\n\u003ctd\u003e没有执行\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e检查点\u003c/td\u003e\n\u003ctd\u003e保存模型参数及必要训练状态，供恢复和重载\u003c/td\u003e\n\u003ctd\u003e已加载预训练检查点；本轮未产生微调检查点\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e微调\u003c/td\u003e\n\u003ctd\u003e从预训练参数出发，用本项目数据更新参数\u003c/td\u003e\n\u003ctd\u003e尚未开始正式微调\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e冒烟检查\u003c/td\u003e\n\u003ctd\u003e用少量样本快速检查接口和基本计算能否运行\u003c/td\u003e\n\u003ctd\u003e已做多轮；不能据此判断训练效果\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e当前结果证明输入能进入这套实验主损失计算链路，没有证明模型学到了歌仔戏伴奏。若后续需要临时一步参数更新和检查点重载来验证训练入口，会先给具体方案与核心 diff；长期训练和效果评价仍属于后续实验。\u003c/p\u003e\n\u003ch2 id=\"6-anyaccomp\"\u003e6. 现在下载的 AnyAccomp 是什么，我们之后拟微调什么\u003c/h2\u003e\n\u003cp\u003e下载的 AnyAccomp 包含相互配合的预训练部件：VQ 旋律模型、FM 生成模型、Vocos 声码器。它们已经有作者训练得到的参数；本次加载它们做核验，不是从零训练，也不是下载后就已适配歌仔戏。\u003c/p\u003e\n\u003cp\u003e未来模型实验的技术路线拟以 FM 为主要微调对象，让它学习歌仔戏配器和伴奏关系；VQ 与声码器当前保持冻结。这不是 929 的自动下一步。最终哪些部件更新、损失怎么组织、数据规模和评价方式如何设置，需要另行确定。加载推理模型不自动提供完整训练程序：公开完整训练加载器缺失，当前使用的是经过确认的实验核验代码。\u003c/p\u003e\n\u003cp\u003e截至本次更新，已有：三份完整录音的分离听验、13 对分段/配对、冻结旋律特征核验、FM 主损失与变长提示/补齐检查、三段声码器时间/长度与听验。\u003c/p\u003e\n\u003cp\u003e用户已确认当前小规模流程的有限验收，采用已核验实验输入规则；CFG 条件丢弃概率保留 0.2，REPA/MERT 辅助损失不纳入本轮。下一步确定规模化来源与数量/合格时长。规模化数据收集处理和划分交付已经用户确认属于 929，须在小规模验收后按明确来源与规模推进；正式微调及新伴奏效果评价另行开展。三个检查点 tag 张量没有对应公开模型定义，当前明确排除，不能称为全部检查点与公开源定义精确一致。REPA/MERT 等尚未实现部分须明确记录，不自动变为新增实现任务。\u003c/p\u003e\n\u003ch2 id=\"7\"\u003e7. 在项目里去哪里找文件和证据\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e位置\u003c/th\u003e\n\u003cth\u003e里面有什么、什么时候看\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"../data-preparation.html#complete\"\u003e实验进度记录\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e查看各阶段的真实结果、模型版本、哈希、人工判断和遗留问题\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/data/raw/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e完整原始录音，始终保留\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/data/separated/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e按录音及分离版本保存的完整双轨\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/data/clips/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e同边界的人声/伴奏片段\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"recordings-9a6ade03529f.html\"\u003erecordings.csv\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e来源、录音元信息、哈希和权利状态\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"separations-c506d4db6e28.html\"\u003eseparations.csv\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e分离版本、产物及审核记录\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"segments-fcfa406e05e7.html\"\u003esegments.csv\u003c/a\u003e / \u003ca href=\"pairs-897b3663ec38.html\"\u003epairs.csv\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003e片段边界与对应关系；13 对已标记实验 FM 主损失输入接口通过；完整作者配方及训练器未验证\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/scripts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e实验处理与核验脚本；不是模型权重\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/configs/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e模型和处理参数、版本及来源记录\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/environments/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e相互隔离的软件环境；本次不复用 Qwen 环境\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_FINETUNE_ROOT/runs/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e每次执行的日志、报告、特征和审核证据\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_PROJECT_ROOT/source/AnyAccomp/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e当前只读使用的公开模型源定义\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e$CLOUD_PROJECT_ROOT/pretrained/anyaccomp/pretrained/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e当前只读使用的 VQ、FM、声码器权重\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e主要核验证据：\u003ca href=\"report-e3e4920b0859.html\"\u003e特征报告\u003c/a\u003e、\u003ca href=\"report-105333cff344.html\"\u003ez-score FM 报告\u003c/a\u003e、\u003ca href=\"post_validation-f02c7a8be6b7.html\"\u003e提示/补齐后核验\u003c/a\u003e、\u003ca href=\"acceptance-0560a658edc2.html\"\u003e声码器听验记录\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"8\"\u003e8. 后续怎么维护这份说明\u003c/h2\u003e\n\u003cp\u003e每引入或调整一项模型、工具、技术，按五点补充：它是什么；在本项目里为什么用；输入和输出；实际使用状态及证据；能证明什么、还有什么待验证。尽量结合当前录音和操作解释，不只列缩写。\u003c/p\u003e\n\u003cp\u003e本文和进度记录各有用途：本文回答“为什么做、这些东西做什么”，进度记录回答“实际做了什么、依据在哪里”。新增或修改实验代码仍先展示核心 diff、说明输入输出和关键逻辑，再等待用户确认；文档解释不替代代码确认。\u003c/p\u003e\n\u003cp\u003e同步状态：本文件首次创建于云端，Windows 本地尚未同步。两端不自动同步，后续传输应同时包含本说明与更新后的进度记录，并核对哈希。\u003c/p\u003e\n\u003cp\u003e最新有限验收记录：\u003ca href=\"acceptance-0959b36ebe7a.html\"\u003e小规模验收 JSON\u003c/a\u003e。这是数据/输入流程验收，不代表整个 929 已完成，规模化建集与交付仍待执行。\u003c/p\u003e\u003c/article\u003e\n\u003cp class=\"reader-meta\"\u003e公开副本已将机器路径替换为占位符；运行示例前请按实际环境填写路径。来源 SHA-256 对应脱敏前的源文件，公开副本不是逐字原文。\u003c/p\u003e","source":"发布资料：anyaccomp_gezi_finetune/docs/929项目模型与技术说明.md（路径已脱敏）","sha256":"1dede0417572f859e6e60a1c15ef21ddd92538cce7b75e556af4d341e4b53626","d
